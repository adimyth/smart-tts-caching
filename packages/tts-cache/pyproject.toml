[project]
name = "smart-tts-cache"
version = "0.2.0"
description = "A sentence-level cache for text-to-speech audio: an agent's repeated sentences play from the cache instead of the provider"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Mishra" }]
requires-python = ">=3.12"
keywords = ["tts", "text-to-speech", "cache", "voice-agent", "pipecat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.13",
    "sentencex>=1.0.32",
]

[project.optional-dependencies]
redis = ["redis>=5"]
similarity = [
    "datasketch>=1.6",
    "rapidfuzz>=3",
    "model2vec>=0.4",
    "hnswlib>=0.8",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
]
verify = []
cli = []

[project.urls]
Homepage = "https://github.com/adimyth/smart-tts-caching"
Changelog = "https://github.com/adimyth/smart-tts-caching/blob/main/CHANGELOG.md"
Issues = "https://github.com/adimyth/smart-tts-caching/issues"

[project.scripts]
tts-cache = "tts_cache.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_cache"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
