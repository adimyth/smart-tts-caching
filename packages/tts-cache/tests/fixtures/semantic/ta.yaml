- {a: "அந்த பணம் 48 மணி நேரத்துல உங்க அக்கவுண்ட்டுக்கு திரும்ப வந்துடும்.", b: "48 மணி நேரத்துக்குள்ள அந்த தொகை உங்க அக்கவுண்ட்டுக்கு திரும்ப கிரெடிட் ஆகிடும்.", label: paraphrase}
- {a: "உங்க பெயர் ஸ்ரீனிவாசன் தானே?", b: "உங்க பெயர் ஸ்ரீனிவாசன், சரி தானே?", label: paraphrase}
- {a: "வணக்கம், நான் கவிதா பேசுறேன், உங்களுக்கு எப்படி உதவலாம்?", b: "வணக்கம், கவிதா பேசுறேன், நான் உங்களுக்கு என்ன உதவி செய்யணும்?", label: paraphrase}
- {a: "உங்க குரல் தெளிவா கேட்கலை, கொஞ்சம் சத்தமா பேசுங்க.", b: "உங்க வாய்ஸ் சரியா கேட்கலை, தயவுசெய்து கொஞ்சம் சத்தமா பேச முடியுமா?", label: paraphrase}
- {a: "நான் சொன்னது உங்களுக்கு புரிஞ்சுதா?", b: "நான் சொன்னதை நீங்க புரிஞ்சுக்கிட்டீங்களா?", label: paraphrase}
- {a: "இந்த சேவைக்கு எந்த கூடுதல் கட்டணமும் இல்லை.", b: "இந்த சர்வீஸுக்கு எக்ஸ்ட்ரா சார்ஜ் எதுவும் கிடையாது.", label: paraphrase}
- {a: "உங்க புது செக் புக் அடுத்த வாரம் வந்துடும்.", b: "அடுத்த வாரம் உங்க புது செக் புக் உங்களுக்கு வந்து சேரும்.", label: paraphrase}
