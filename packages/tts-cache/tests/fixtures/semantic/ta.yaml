- {a: "நீங்க டாக்டர் சுரேஷ்கிட்ட அப்பாயிண்ட்மெண்ட் புக் பண்ண விரும்புறீங்களா?", b: "டாக்டர் சுரேஷ்கிட்ட உங்களுக்கு ஒரு அப்பாயிண்ட்மெண்ட் புக் பண்ணணுமா?", label: paraphrase}
- {a: "உங்க அப்பாயிண்ட்மெண்ட்டுக்கு 15 நிமிஷம் முன்னாடியே வந்துடுங்க.", b: "அப்பாயிண்ட்மெண்ட் நேரத்துக்கு 15 நிமிஷம் முன்னாடியே தயவுசெய்து வந்து சேருங்க.", label: paraphrase}
- {a: "உங்க பழைய ரிப்போர்ட்களையும் கூட எடுத்துட்டு வாங்க.", b: "உங்க பழைய ரிப்போர்ட்களையும் மறக்காம கொண்டு வாங்க.", label: paraphrase}
