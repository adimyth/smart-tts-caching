- text: "ਵਧਾਈਆਂ! ਤੁਹਾਡਾ ਲੋਨ ਮਨਜ਼ੂਰ ਹੋ ਗਿਆ ਹੈ।"
  sentences: ["ਵਧਾਈਆਂ!", "ਤੁਹਾਡਾ ਲੋਨ ਮਨਜ਼ੂਰ ਹੋ ਗਿਆ ਹੈ।"]
- text: "ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ, ਕਾਲ ਕਰਨ ਲਈ ਧੰਨਵਾਦ। ਮੈਂ ਅੱਜ ਤੁਹਾਡੇ ਖਾਤੇ ਬਾਰੇ ਤੁਹਾਡੀ ਮਦਦ ਕਰ ਸਕਦਾ ਹਾਂ। ਕੀ ਤੁਸੀਂ ਮੈਨੂੰ ਆਪਣਾ ਰਜਿਸਟਰਡ ਮੋਬਾਈਲ ਨੰਬਰ ਦੱਸ ਸਕਦੇ ਹੋ? ਕੋਈ ਜਲਦੀ ਨਹੀਂ ਹੈ, ਆਰਾਮ ਨਾਲ ਦੱਸੋ।"
  sentences: ["ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ, ਕਾਲ ਕਰਨ ਲਈ ਧੰਨਵਾਦ।", "ਮੈਂ ਅੱਜ ਤੁਹਾਡੇ ਖਾਤੇ ਬਾਰੇ ਤੁਹਾਡੀ ਮਦਦ ਕਰ ਸਕਦਾ ਹਾਂ।", "ਕੀ ਤੁਸੀਂ ਮੈਨੂੰ ਆਪਣਾ ਰਜਿਸਟਰਡ ਮੋਬਾਈਲ ਨੰਬਰ ਦੱਸ ਸਕਦੇ ਹੋ?", "ਕੋਈ ਜਲਦੀ ਨਹੀਂ ਹੈ, ਆਰਾਮ ਨਾਲ ਦੱਸੋ।"]
- text: "ਮੈਂ ਠੀਕ ਹਾਂ। ਤੁਸੀਂ ਕਿਵੇਂ ਹੋ? ਚੰਗਾ ਜੀ।"
