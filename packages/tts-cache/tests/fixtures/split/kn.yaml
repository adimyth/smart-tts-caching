- text: "ನಮಸ್ಕಾರ, ಕರೆ ಮಾಡಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದಗಳು. ಇಂದು ನಿಮ್ಮ ಖಾತೆಯ ವಿಷಯದಲ್ಲಿ ನಾನು ಸಹಾಯ ಮಾಡಬಹುದು. ನಿಮ್ಮ ನೋಂದಾಯಿತ ಮೊಬೈಲ್ ನಂಬರ್ ಹೇಳಬಹುದಾ? ಅವಸರ ಇಲ್ಲ, ನಿಧಾನವಾಗಿ ಹೇಳಿ."
  sentences: ["ನಮಸ್ಕಾರ, ಕರೆ ಮಾಡಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದಗಳು.", "ಇಂದು ನಿಮ್ಮ ಖಾತೆಯ ವಿಷಯದಲ್ಲಿ ನಾನು ಸಹಾಯ ಮಾಡಬಹುದು.", "ನಿಮ್ಮ ನೋಂದಾಯಿತ ಮೊಬೈಲ್ ನಂಬರ್ ಹೇಳಬಹುದಾ?", "ಅವಸರ ಇಲ್ಲ, ನಿಧಾನವಾಗಿ ಹೇಳಿ."]
- text: "ನಾನು ಚೆನ್ನಾಗಿದ್ದೇನೆ. ನೀವು ಹೇಗಿದ್ದೀರಿ?"
  sentences: ["ನಾನು ಚೆನ್ನಾಗಿದ್ದೇನೆ.", "ನೀವು ಹೇಗಿದ್ದೀರಿ?"]
- text: "ಅಭಿನಂದನೆಗಳು! ನಿಮ್ಮ ಲೋನ್ ಅಪ್ರೂವ್ ಆಗಿದೆ."
  sentences: ["ಅಭಿನಂದನೆಗಳು!", "ನಿಮ್ಮ ಲೋನ್ ಅಪ್ರೂವ್ ಆಗಿದೆ."]
- text: "ಸರಿ. ಒಂದು ನಿಮಿಷ. ನೋಡುತ್ತೇನೆ."
