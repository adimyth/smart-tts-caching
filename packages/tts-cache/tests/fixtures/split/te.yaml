- text: "డా. రావు గారు రేపు మిమ్మల్ని కలుస్తారు. ధన్యవాదాలు."
  sentences: ["డా. రావు గారు రేపు మిమ్మల్ని కలుస్తారు.", "ధన్యవాదాలు."]
- text: "నమస్కారం. డా. రావు గారు రేపు మిమ్మల్ని కలుస్తారు."
  sentences: ["నమస్కారం.", "డా. రావు గారు రేపు మిమ్మల్ని కలుస్తారు."]
- text: "శ్రీ. రాముడు వచ్చారు. దయచేసి కూర్చోండి."
  sentences: ["శ్రీ. రాముడు వచ్చారు.", "దయచేసి కూర్చోండి."]
- text: "ధర Rs. 500 అండి. సరేనా?"
  sentences: ["ధర Rs. 500 అండి.", "సరేనా?"]
- text: "మీ ఆర్డర్ పంపబడింది! రేపు సాయంత్రం లోపు చేరుతుంది."
  sentences: ["మీ ఆర్డర్ పంపబడింది!", "రేపు సాయంత్రం లోపు చేరుతుంది."]
- text: "నమస్కారం, కాల్ చేసినందుకు ధన్యవాదాలు. ఈ రోజు మీ ఖాతా విషయంలో నేను సహాయం చేయగలను. మీ రిజిస్టర్డ్ మొబైల్ నంబర్ చెప్పగలరా? తొందర లేదు, నెమ్మదిగా చెప్పండి."
  sentences: ["నమస్కారం, కాల్ చేసినందుకు ధన్యవాదాలు.", "ఈ రోజు మీ ఖాతా విషయంలో నేను సహాయం చేయగలను.", "మీ రిజిస్టర్డ్ మొబైల్ నంబర్ చెప్పగలరా?", "తొందర లేదు, నెమ్మదిగా చెప్పండి."]
- text: "నేను బాగున్నాను. మీరు ఎలా ఉన్నారు?"
  sentences: ["నేను బాగున్నాను.", "మీరు ఎలా ఉన్నారు?"]
- text: "సరే. చూస్తాను. ఆగండి."
  sentences: ["సరే.", "చూస్తాను.", "ఆగండి."]
