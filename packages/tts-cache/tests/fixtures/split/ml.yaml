- text: "എനിക്ക് സുഖമാണ്. നിങ്ങൾക്ക് സുഖമാണോ?"
  sentences: ["എനിക്ക് സുഖമാണ്.", "നിങ്ങൾക്ക് സുഖമാണോ?"]
- text: "നിങ്ങളുടെ ഓർഡർ എത്തി! ദയവായി വാതിൽ തുറക്കൂ."
  sentences: ["നിങ്ങളുടെ ഓർഡർ എത്തി!", "ദയവായി വാതിൽ തുറക്കൂ."]
