- text: "Acme Inc. നന്ദി."
  sentences: ["Acme Inc.", "നന്ദി."]
- text: "നമസ്കാരം, വിളിച്ചതിന് നന്ദി. ഇന്ന് നിങ്ങളുടെ അക്കൗണ്ട് കാര്യത്തിൽ ഞാൻ സഹായിക്കാം. നിങ്ങളുടെ രജിസ്റ്റർ ചെയ്ത മൊബൈൽ നമ്പർ പറയാമോ? തിരക്കൊന്നുമില്ല, സാവധാനം പറയൂ."
