- text: "டாக்டர். குமார் நாளை வருவார். நன்றி."
  sentences: ["டாக்டர். குமார் நாளை வருவார்.", "நன்றி."]
- text: "திரு. குமார் வந்துள்ளார். அமருங்கள்."
  sentences: ["திரு. குமார் வந்துள்ளார்.", "அமருங்கள்."]
- text: "Acme Inc. நன்றி."
  sentences: ["Acme Inc.", "நன்றி."]
- text: "வணக்கம், அழைத்ததற்கு நன்றி. இன்று உங்கள் கணக்கில் நான் உங்களுக்கு உதவ முடியும். உங்கள் பதிவு செய்த மொபைல் எண்ணைச் சொல்ல முடியுமா? அவசரம் இல்லை, நிதானமாகச் சொல்லுங்கள்."
  sentences: ["வணக்கம், அழைத்ததற்கு நன்றி.", "இன்று உங்கள் கணக்கில் நான் உங்களுக்கு உதவ முடியும்.", "உங்கள் பதிவு செய்த மொபைல் எண்ணைச் சொல்ல முடியுமா?", "அவசரம் இல்லை, நிதானமாகச் சொல்லுங்கள்."]
- text: "விலை Rs. 500. சரியா?"
