- {lang: gu, a: 'અમારા ટાવરમાં સમારકામ ચાલુ હોવાથી, રાત્રે 2 વાગ્યા સુધી સિગ્નલ નબળું રહી શકે છે.', b: 'ટાવર પર રિપેરનું કામ ચાલે છે, તેથી રાત્રે 2 વાગ્યા સુધી નેટવર્ક ઓછું મળી શકે.', label: paraphrase, request: paraphrase, stored: new}
