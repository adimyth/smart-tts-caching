- {lang: te, a: 'శుభవార్త, మీ ఆర్డర్ అనుకున్నదానికంటే ముందుగానే గురువారం వస్తోంది!', b: 'మంచి వార్త, అనుకున్న తేదీ కంటే త్వరగా, గురువారం నాడే మీ ఆర్డర్ చేరుతుంది!', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'సర్జరీకి ముందు రోజు, మీరు ఉదయం 8 గంటలకు అడ్మిట్ కావాలి.', b: ఆపరేషన్ ముందు రోజు ఉదయం 8 గంటలకు మీరు హాస్పిటల్‌లో జాయిన్ అవ్వాలి., label: paraphrase, request: paraphrase, stored: new}
