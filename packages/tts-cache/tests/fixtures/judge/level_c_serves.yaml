- {lang: ml, a: സൺറൈസ് ഹോസ്പിറ്റലിൽ ഞായറാഴ്ചകളിലും ഒപി പ്രവർത്തിക്കുന്നുണ്ട്., b: ഞായറാഴ്ച ദിവസങ്ങളിലും സൺറൈസ് ഹോസ്പിറ്റലിലെ ഒപി തുറന്നിരിക്കും., label: paraphrase, request: paraphrase, stored: new}
