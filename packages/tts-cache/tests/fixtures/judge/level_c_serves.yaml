- {lang: gu, a: '1 એપ્રિલથી, અમારું ક્લિનિક એ જ બિલ્ડિંગના ત્રીજા માળે ખસેડાયું છે.', b: ધ્યાનમાં રાખજો કે 1 એપ્રિલથી દવાખાનું એ જ ઇમારતમાં ત્રીજા માળે શિફ્ટ થયું છે., label: paraphrase, request: paraphrase, stored: new}
