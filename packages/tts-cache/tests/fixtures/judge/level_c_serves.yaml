- {lang: or, a: 'ରିଟର୍ନ ପାଇଁ ଆପଣଙ୍କୁ କୌଣସି ଚାର୍ଜ ଦେବାକୁ ପଡ଼ିବ ନାହିଁ, କେବଳ 7 ଦିନ ଭିତରେ ଅନୁରୋଧ କରନ୍ତୁ।', b: '7 ଦିନ ମଧ୍ୟରେ ରିକ୍ୱେଷ୍ଟ ଦେଲେ ଜିନିଷ ଫେରାଇବା ସମ୍ପୂର୍ଣ୍ଣ ମାଗଣା, ଏଥିପାଇଁ ଟଙ୍କା ଲାଗିବ ନାହିଁ।', label: paraphrase, request: paraphrase, stored: new}
