- {lang: te, a: 'ఆర్టీఓ ఆఫీసులో మీ డ్రైవింగ్ టెస్ట్ టోకెన్ నంబర్ 37, ఒరిజినల్ లెర్నర్ లైసెన్స్ తెచ్చుకోండి.', b: 'డ్రైవింగ్ టెస్ట్ కోసం ఆర్టీఓలో మీకు టోకెన్ నంబర్ 37 వచ్చింది, లెర్నర్ లైసెన్స్ అసలు కాపీ వెంట ఉంచుకోండి.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ఈ టికెట్‌ను నేను ఇప్పుడు క్లోజ్ చేయవచ్చా, దివ్య గారు?', b: 'దివ్య గారు, మీ టికెట్‌ను ఈ సమయంలోనే మూసివేయడానికి మీ అనుమతి ఉందా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: ఈ ప్లాన్‌లో నెట్‌ఫ్లిక్స్ సబ్‌స్క్రిప్షన్ ఉచితంగా వస్తుంది., b: 'ఈ ప్యాక్ తీసుకుంటే, నెట్‌ఫ్లిక్స్ సభ్యత్వం మీకు ఫ్రీగా లభిస్తుంది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: ఈ ఫిక్స్‌డ్ డిపాజిట్‌పై సంవత్సరానికి 7 శాతం వడ్డీ వస్తుంది., b: ఈ ఎఫ్‌డీలో మీకు ఏడాదికి 7 శాతం చొప్పున వడ్డీ లభిస్తుంది., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ఈ బిల్లింగ్ ప్రశ్నకు అకౌంట్స్ విభాగం వారే జవాబివ్వగలరు, నేను మీ కాల్‌ను సుమన్ గారికి కలుపుతున్నాను.', b: 'బిల్లింగ్ విషయాలు అకౌంట్స్ టీమ్ చూసుకుంటుంది, అందుకే మీ కాల్‌ను సుమన్ గారికి ట్రాన్స్‌ఫర్ చేస్తున్నాను.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ఈ రోజు రీఛార్జ్ చేస్తే, ఉచితంగా 2 జీబీ అదనపు డేటా మీ సొంతం!', b: 'ఈ రోజే రీఛార్జ్ చేసుకుంటే, మీకు 2 జీబీ ఎక్స్‌ట్రా డేటా ఫ్రీగా లభిస్తుంది!', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ఈ రోజు స్లాట్స్ అన్నీ నిండిపోయాయి, కానీ రేపు మధ్యాహ్నం 2 గంటలకు ఖాళీ ఉంది.', b: 'ఈ రోజుకు బుకింగ్స్ ఫుల్ అయ్యాయి, అయితే రేపు మధ్యాహ్నం 2 గంటలకు ఒక టైమ్ అందుబాటులో ఉంది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ఈ సెలూన్‌లో హెయిర్ స్పా అపాయింట్‌మెంట్ ధర ₹1,800, ఇందులో హెడ్ మసాజ్ కూడా ఉంది.', b: 'మా సెలూన్‌లో హెయిర్ స్పాకు ₹1,800 అవుతుంది, అదే ప్యాకేజీలో తల మసాజ్ కూడా చేస్తాము.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ఈ ₹349 ఐటమ్ రిటర్న్ పాలసీ కిందకు రాదు, కాబట్టి వెనక్కి తీసుకోలేము.', b: 'ఈ ₹349 వస్తువుకు రిటర్న్ సదుపాయం లేదు, అందువల్ల దాన్ని తిరిగి స్వీకరించడం కుదరదు.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ఏటీఎం నుంచి రోజుకు గరిష్టంగా ₹40,000 విత్‌డ్రా చేసుకోవచ్చు.', b: 'ఒక్క రోజులో ఏటీఎం ద్వారా మీరు తీయగలిగే అత్యధిక మొత్తం ₹40,000.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ఒక్క క్షణం ఆగండి, నవీన్ గారు.', b: 'నవీన్ గారు, దయచేసి కొద్దిసేపు వేచి ఉండండి.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'కన్సల్టేషన్ ఫీజు ₹500, దాన్ని రిసెప్షన్‌లో చెల్లించవచ్చు.', b: రిసెప్షన్ కౌంటర్‌లో మీరు ₹500 కన్సల్టేషన్ రుసుము కట్టేయవచ్చు., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: కాల్ డ్రాప్ సమస్యను మా నెట్‌వర్క్ ఇంజనీర్ భాస్కర్ పరిశీలిస్తున్నారు., b: తరచుగా కాల్స్ కట్ అవుతున్న విషయాన్ని నెట్‌వర్క్ ఇంజనీర్ భాస్కర్ చెక్ చేస్తున్నారు., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'కేబుల్ కట్ అయినందు వల్ల మీ వీధిలో ఇంటర్నెట్ ఆగిపోయింది, రాత్రి 9 గంటల లోపు సరిచేస్తాము.', b: 'మీ వీధిలో కేబుల్ తెగిపోవడంతో నెట్ పోయింది, దాన్ని రాత్రి 9 గంటలలోపే రిపేర్ చేస్తాము.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'కేవైసీ అప్‌డేట్ చేయకపోతే, నవంబర్ 30 తర్వాత మీ ఖాతా ఫ్రీజ్ అవుతుంది.', b: 'నవంబర్ 30 దాటిన తర్వాత కూడా కేవైసీ పూర్తి చేయకపోతే, మీ అకౌంట్‌ను ఫ్రీజ్ చేస్తారు.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'క్షమించండి, ఈ రోజు సర్వర్ డౌన్ కావడంతో మీ ₹7,500 ట్రాన్స్‌ఫర్ ఆలస్యమవుతోంది.', b: 'సర్వర్‌లో ఈ రోజు ఇబ్బంది ఉన్నందువల్ల, మీ ₹7,500 బదిలీ కొంచెం ఆలస్యంగా జరుగుతోంది, మన్నించండి.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'క్షమించండి, మా ఫైబర్ లైన్ మీ ఇంటికి 800 మీటర్ల దూరం వరకే వచ్చింది.', b: 'క్షమించాలి, మా ఫైబర్ కేబుల్ ప్రస్తుతం మీ ఇంటి నుంచి 800 మీటర్ల దూరంలోనే ఆగిపోయింది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: గత 6 నెలల మీ ఖాతా స్టేట్‌మెంట్‌ను మీ ఈమెయిల్‌కు పంపించాను., b: మీ అకౌంట్‌కు సంబంధించిన చివరి 6 నెలల స్టేట్‌మెంట్ ఇప్పుడే మీ మెయిల్ ఐడీకి వెళ్ళింది., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'గోపాల్ గారు, మీకు పెన్సిలిన్ వంటి మందులకు అలర్జీ ఉందా?', b: 'గోపాల్ గారు, పెన్సిలిన్ లాంటి మెడిసిన్స్ వేసుకుంటే మీకు రియాక్షన్ వస్తుందా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'చైతన్య గారు, పళ్ళ క్లీనింగ్‌తో పాటు ఎక్స్‌రే కూడా అదే రోజు తీయించుకుంటారా?', b: 'చైతన్య గారు, అదే రోజున క్లీనింగ్ అయ్యాక పళ్ళకు ఎక్స్‌రే కూడా తీయించాలనుకుంటున్నారా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'జూన్ నెల బిల్ కాపీని వాట్సాప్‌లో పంపమంటారా?', b: 'జూన్ నెలకు సంబంధించిన బిల్లు ప్రతిని మీ వాట్సాప్ నంబర్‌కు షేర్ చేయాలా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: ట్రాకింగ్ నంబర్ 22058 ఉన్న మీ షిప్‌మెంట్ ప్రస్తుతం చెన్నై హబ్‌లో ఉంది., b: ప్రస్తుతానికి 22058 ట్రాకింగ్ నంబర్ షిప్‌మెంట్ మా చెన్నై సెంటర్‌లో ఆగి ఉంది., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'డాక్టర్ గారు 30 నిమిషాలు ఆలస్యంగా వస్తున్నారు, దయచేసి వెయిటింగ్ హాల్‌లో కూర్చోండి.', b: 'డాక్టర్ రావడానికి ఇంకో 30 నిమిషాలు పడుతుంది, అప్పటి వరకు వెయిటింగ్ రూమ్‌లో విశ్రాంతి తీసుకోండి.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'డెలివరీ ఓటీపీ 7290 ఏజెంట్‌కు చెప్పారా?', b: 'మీకు వచ్చిన 7290 డెలివరీ కోడ్‌ను మా ఏజెంట్‌తో పంచుకున్నారా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: డెలివరీ బాయ్ సందీప్ పది నిమిషాల్లో మీ ఇంటికి చేరుకుంటారు., b: మరో పది నిమిషాల్లో మా డెలివరీ ఏజెంట్ సందీప్ మీ ఇంటి దగ్గర ఉంటారు., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: దయచేసి రెండు నిమిషాలు లైన్‌లో ఉండండి., b: మరో రెండు నిమిషాల పాటు దయచేసి హోల్డ్‌లో వేచి ఉండండి., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: నంబర్ పోర్టింగ్ ప్రక్రియ పూర్తి కావడానికి 7 పని దినాలు పడుతుంది., b: మీ నంబర్‌ను మా నెట్‌వర్క్‌కు పోర్ట్ చేసే పని 7 వర్కింగ్ డేస్‌లో ముగుస్తుంది., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'నమస్కారం, నా పేరు కిరణ్, ఈ రోజు మీ సమస్యను నేను పరిష్కరిస్తాను.', b: 'నమస్తే అండి, కిరణ్ మాట్లాడుతున్నాను, మీ సమస్యకు ఈ రోజు నేనే పరిష్కారం చూపిస్తాను.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'పద్మ గారు, మీరు వాడుతున్న హ్యాండ్‌సెట్ 5జీ సపోర్ట్ చేస్తుందా?', b: 'పద్మ గారు, మీ దగ్గర ఉన్న మొబైల్‌లో 5జీ నెట్‌వర్క్ పని చేసే సదుపాయం ఉందా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ప్రసాద్ గారు, మీరు ఇంతకు ముందు మా ఆసుపత్రిలో చూపించుకున్నారా?', b: 'ప్రసాద్ గారు, గతంలో ఎప్పుడైనా మా హాస్పిటల్‌లో డాక్టర్‌ను కన్సల్ట్ చేశారా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'ఫాలో-అప్ విజిట్‌కు ఫీజు లేదు, కానీ అది 15 రోజుల లోపే ఉండాలి.', b: '15 రోజుల లోపల మళ్ళీ చూపించుకుంటే, ఆ ఫాలో-అప్‌కు ఏమీ చెల్లించనక్కర్లేదు.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: ఫిజియోథెరపీ సెషన్ ప్రతిసారీ 45 నిమిషాలు ఉంటుంది., b: ప్రతి ఫిజియో సెషన్ నిడివి 45 నిమిషాలుగా నిర్ణయించాము., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'భద్రత దృష్ట్యా, విశ్వాస్ బ్యాంక్ ఫోన్‌లో ఎప్పుడూ మీ పిన్ అడగదు.', b: 'సెక్యూరిటీ కారణాల రీత్యా, కాల్ చేసి మీ పిన్ చెప్పమని విశ్వాస్ బ్యాంక్ ఎప్పుడూ కోరదు.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'భారీ వర్షాల కారణంగా, హైదరాబాద్‌లో డెలివరీలు రెండు రోజులు ఆలస్యం కావచ్చు.', b: 'హైదరాబాద్‌లో విపరీతంగా వానలు పడుతుండటంతో, ఆర్డర్లు రావడానికి రెండు రోజులు ఎక్కువ పట్టే అవకాశం ఉంది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మా కస్టమర్ కేర్ సోమవారం నుంచి శనివారం వరకు పని చేస్తుంది., b: వారంలో సోమవారం మొదలుకొని శనివారం దాకా మా కస్టమర్ కేర్ అందుబాటులో ఉంటుంది., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మా రికార్డుల ప్రకారం మీరు ఈ ప్రొడక్ట్‌ను జూలై 12న కొన్నారు., b: 'మా దగ్గర ఉన్న రికార్డులు చూస్తే, ఈ ప్రొడక్ట్ మీరు జూలై 12న కొనుగోలు చేసినట్లు ఉంది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ ఇంటర్నెట్ బ్యాంకింగ్ మూడు తప్పు ప్రయత్నాల తర్వాత లాక్ అయింది., b: 'వరుసగా మూడు సార్లు తప్పు పాస్‌వర్డ్ ఎంటర్ చేయడంతో, మీ నెట్ బ్యాంకింగ్ బ్లాక్ అయింది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ ఇంటర్నెట్ మళ్ళీ పని చేస్తోంది, వరుణ్ గారు!', b: 'వరుణ్ గారు, మీ నెట్ కనెక్షన్ తిరిగి సరిగ్గా నడుస్తోంది!', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ ఇంటికి దగ్గర్లో గుర్తుగా చెప్పడానికి ఏదైనా గుడి లేదా స్కూల్ ఉందా, లక్ష్మణ్ గారు?', b: 'లక్ష్మణ్ గారు, మీ అడ్రస్ సులభంగా కనిపెట్టేందుకు దగ్గరలో ఏదైనా ల్యాండ్‌మార్క్ చెప్పగలరా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ ఈమెయిల్ ఐడీలో మొదటి అక్షరం ఎస్ ఆ, లేక ఎఫ్ ఆ?', b: 'మీ ఈమెయిల్ అడ్రస్ మొదటి అక్షరం ఎస్ అని రాయాలా, లేదంటే ఎఫ్ అనా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ ఎంఆర్ఐ స్కాన్ ఆగస్టు 9న సాయంత్రం 4 గంటలకు ఉంది., b: ఆగస్టు 9వ తేదీ సాయంత్రం 4 గంటలకు మీకు ఎంఆర్ఐ స్కాన్ షెడ్యూల్ చేశాము., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ ఏరియాలో టవర్ మెయింటెనెన్స్ వల్ల సాయంత్రం 6 గంటల వరకు సిగ్నల్ ఉండకపోవచ్చు., b: 'టవర్‌లో రిపేర్ పనులు జరుగుతున్నందున, సాయంత్రం 6 గంటల దాకా మీ ప్రాంతంలో నెట్‌వర్క్ రాకపోవచ్చు.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ కుటుంబ ప్లాన్‌లో ఇప్పుడు 4 సిమ్‌లు కలిశాయి!, b: ఇక నుంచి మీ ఫ్యామిలీ ప్యాక్ కింద 4 కనెక్షన్లు చేరాయి!, label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ కొత్త ఈ-సిమ్ 4 గంటల్లో యాక్టివేట్ అవుతుంది, అప్పటివరకు ఫోన్ రీస్టార్ట్ చేయకండి.', b: 'ఈ-సిమ్ పనిచేయడం మొదలవ్వడానికి 4 గంటలు పడుతుంది, ఆ లోపు మొబైల్‌ను స్విచ్ ఆఫ్ చేసి ఆన్ చేయకండి.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ క్రెడిట్ లిమిట్ ₹1,50,000 కి పెరిగింది!', b: 'శుభవార్త, ఇప్పటి నుంచి మీ కార్డ్ క్రెడిట్ లిమిట్ ₹1,50,000 అయింది!', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ ఖాతా నుంచి ప్రతి నెలా 5వ తేదీన ₹1,000 ఎస్ఐపీగా కట్ అవుతుంది.', b: 'నెలనెలా 5వ తేదీ రాగానే ₹1,000 ఎస్ఐపీ కోసం మీ అకౌంట్ నుంచి డెబిట్ అవుతుంది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ టికెట్ నంబర్ 70214 ఇంకా ఓపెన్‌లోనే ఉంది., b: ఇప్పటికీ మీ 70214 నంబర్ టికెట్ ఓపెన్ స్థితిలోనే కొనసాగుతోంది., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ నంబర్‌పై 30 రోజుల పాటు ఇంటర్నేషనల్ రోమింగ్ యాక్టివేట్ చేశాను., b: ఇప్పటి నుంచి 30 రోజుల వరకు మీ సిమ్‌కు అంతర్జాతీయ రోమింగ్ ఆన్ అయింది., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ నంబర్‌పై వచ్చిన అదనపు ఛార్జ్ ₹59 కాలర్ ట్యూన్ సర్వీస్‌ది., b: '₹59 ఎక్స్‌ట్రా ఛార్జ్ పడింది, అది మీ కాలర్ ట్యూన్ సబ్‌స్క్రిప్షన్ వల్ల వచ్చింది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ నెలవారీ ఈఎంఐ ₹12,800 ఆటో డెబిట్ ద్వారా కట్ అవ్వాలని కోరుకుంటున్నారా?', b: 'ప్రతి నెలా ₹12,800 ఈఎంఐ మీ ఖాతా నుంచి ఆటోమేటిక్‌గా డెబిట్ అయ్యేలా సెట్ చేయమంటారా?', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ పాత కంప్లైంట్ మార్చి 3న క్లోజ్ చేయబడింది., b: మార్చి 3వ తేదీన మేము మీ పాత ఫిర్యాదును మూసివేశాము., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ పాత ప్లాన్ ఈ నెల 28న ముగుస్తుంది, ఆ తర్వాత కొత్త ప్లాన్ ఆటోమేటిక్‌గా మొదలవుతుంది.', b: 'ఈ నెల 28వ తేదీతో పాత ప్లాన్ అయిపోతుంది, తర్వాత కొత్తది దానంతట అదే యాక్టివ్ అవుతుంది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ పాస్‌పోర్ట్ వెరిఫికేషన్ అపాయింట్‌మెంట్ 22 నవంబర్‌కు బుక్ అయింది., b: 22 నవంబర్ తేదీన మీ పాస్‌పోర్ట్ వెరిఫికేషన్ కోసం స్లాట్ కేటాయించాము., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ పెంపుడు కుక్క వ్యాక్సినేషన్ కోసం వెటర్నరీ డాక్టర్ జనవరి 2న అందుబాటులో ఉంటారు., b: జనవరి 2వ తేదీన పశువైద్యులు మీ కుక్కకు టీకా వేయడానికి అందుబాటులో ఉంటారు., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ ప్రాంతానికి ప్రస్తుతం క్విక్‌షిప్ ఎక్స్‌ప్రెస్ డెలివరీ సౌకర్యం లేదు., b: క్విక్‌షిప్ ఎక్స్‌ప్రెస్ సర్వీస్ ఈ సమయంలో మీ ఏరియాలో అందుబాటులో లేదు., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ ఫిక్స్‌డ్ డిపాజిట్ ఆగస్టు 20న మెచ్యూర్ అవుతుంది., b: ఆగస్టు 20వ తేదీకి మీ ఎఫ్‌డీ మెచ్యూరిటీ గడువు పూర్తవుతుంది., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ ఫిర్యాదును బ్యాంకింగ్ అంబుడ్స్‌మన్‌కు పంపడానికి 30 రోజులు వేచి ఉండాలి., b: 'బ్యాంకింగ్ అంబుడ్స్‌మన్ దగ్గరకు మీ కంప్లైంట్ వెళ్ళాలంటే, ముందుగా 30 రోజుల సమయం ఆగాల్సి ఉంటుంది.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: మీ ఫైబర్ కనెక్షన్ స్పీడ్ 100 ఎంబీపీఎస్ నుంచి 200కి అప్‌గ్రేడ్ అయింది., b: ఫైబర్ ఇంటర్నెట్ వేగాన్ని 100 ఎంబీపీఎస్ నుంచి 200 ఎంబీపీఎస్‌కు పెంచాము., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ ఫ్యామిలీ ప్లాన్‌లో ఇంకా 3 మందిని చేర్చుకోవచ్చు, ఒక్కొక్కరికి అదనంగా ₹149 అవుతుంది.', b: 'ఒక్కో సభ్యుడికి ₹149 అదనంగా చెల్లిస్తే, మీ ఫ్యామిలీ ప్లాన్‌కు మరో 3 మందిని కలపవచ్చు.', label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: 'మీ బంగారు ఆభరణాల మీద ఎంత లోన్ కావాలి, ₹50,000 సరిపోతుందా?', b: 'నగలు తాకట్టు పెట్టి మీరు ఎంత రుణం తీసుకోవాలనుకుంటున్నారు, ₹50,000 చాలా?', label: paraphrase, request: paraphrase, stored: new}
