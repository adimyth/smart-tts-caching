- {lang: ml, a: 'ശരി, നിങ്ങൾ പറഞ്ഞ പിൻകോഡ് 682031 ഞാൻ കുറിച്ചെടുത്തു.', b: 'നിങ്ങൾ തന്ന 682031 എന്ന പിൻകോഡ് ഞാൻ എഴുതി വെച്ചിട്ടുണ്ട്, ശരി.', label: paraphrase, request: paraphrase, stored: new}
