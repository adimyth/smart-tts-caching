- {lang: pa, a: 'ਯੂਪੀਆਈ ਰਾਹੀਂ ਇੱਕ ਦਿਨ ਵਿੱਚ ਵੱਧ ਤੋਂ ਵੱਧ ₹1,00,000 ਭੇਜੇ ਜਾ ਸਕਦੇ ਹਨ।', b: 'ਰੋਜ਼ਾਨਾ ਯੂਪੀਆਈ ਟ੍ਰਾਂਸਫ਼ਰ ਦੀ ਉਪਰਲੀ ਹੱਦ ₹1,00,000 ਰੱਖੀ ਗਈ ਹੈ।', label: paraphrase, request: paraphrase, stored: new}
- {lang: pa, a: 'ਵਧਾਈਆਂ, ਤੁਹਾਨੂੰ 2 ਜੀਬੀ ਮੁਫ਼ਤ ਡਾਟਾ ਮਿਲ ਗਿਆ ਹੈ!', b: 'ਮੁਬਾਰਕਾਂ, 2 ਜੀਬੀ ਡਾਟਾ ਬਿਲਕੁਲ ਮੁਫ਼ਤ ਤੁਹਾਡੇ ਨੰਬਰ ''ਤੇ ਜੋੜ ਦਿੱਤਾ ਗਿਆ ਹੈ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: pa, a: 'ਵਾਹ ਜੀ, ਤੁਹਾਡਾ ਮਸਲਾ ਹੱਲ ਹੋ ਗਿਆ, ਇਹ ਸੁਣ ਕੇ ਬੜੀ ਖ਼ੁਸ਼ੀ ਹੋਈ, ਜਸਪ੍ਰੀਤ ਜੀ!', b: 'ਜਸਪ੍ਰੀਤ ਜੀ, ਮੈਨੂੰ ਬਹੁਤ ਚੰਗਾ ਲੱਗਿਆ ਕਿ ਤੁਹਾਡੀ ਦਿੱਕਤ ਹੁਣ ਦੂਰ ਹੋ ਗਈ ਹੈ!', label: paraphrase, request: paraphrase, stored: new}
