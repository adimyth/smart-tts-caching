- {lang: ml, a: കോൾ ഡ്രോപ്പ് പരാതി 41730 ആയി രജിസ്റ്റർ ചെയ്തു., b: നിങ്ങളുടെ കോൾ ഡ്രോപ്പ് പ്രശ്നം 41730 എന്ന നമ്പറിൽ ഞങ്ങൾ രേഖപ്പെടുത്തിയിട്ടുണ്ട്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ക്യാഷ് ഓൺ ഡെലിവറിക്ക് ₹1,349 കൃത്യമായി കരുതി വെക്കണേ.', b: 'പാഴ്സൽ വാങ്ങുമ്പോൾ കൊടുക്കാനായി ₹1,349 ചില്ലറയായി തയ്യാറാക്കി വെക്കൂ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ക്ഷമിക്കണം, ഡോക്ടർ എമർജൻസി കേസിലാണ്, ഏകദേശം 40 മിനിറ്റ് കൂടി കാത്തിരിക്കേണ്ടി വരും.', b: 'സോറി, ഡോക്ടർ ഒരു അത്യാഹിത കേസ് നോക്കുകയാണ്, ഒരു 40 മിനിറ്റോളം ഇനിയും വെയിറ്റ് ചെയ്യേണ്ടി വരും.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ചെക്ക് ക്ലിയറിംഗിന് സാധാരണ 2 പ്രവൃത്തി ദിവസം എടുക്കും, അതിനാൽ തുക തിങ്കളാഴ്ചയോടെ അക്കൗണ്ടിൽ കാണാം.', b: 'സാധാരണയായി ചെക്ക് ക്ലിയർ ആകാൻ 2 വർക്കിംഗ് ഡേയ്സ് വേണം, അതുകൊണ്ട് തിങ്കളാഴ്ച ആകുമ്പോഴേക്കും പണം അക്കൗണ്ടിൽ എത്തും.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: ചെക്ക് ബുക്ക് 7 ദിവസത്തിനകം എത്തും., b: 7 ദിവസം കൊണ്ട് പുതിയ ചെക്ക് ബുക്ക് നിങ്ങളുടെ വിലാസത്തിൽ കിട്ടും., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഞങ്ങളിൽ നിന്ന് വാങ്ങിയതിന് നന്ദി, അടുത്ത ഓർഡറിന് 15 ശതമാനം കിഴിവ് കിട്ടും.', b: 'ഞങ്ങളോടൊപ്പം ഷോപ്പ് ചെയ്തതിന് നന്ദി, അടുത്ത തവണ ഓർഡർ ചെയ്യുമ്പോൾ 15 ശതമാനം ഡിസ്കൗണ്ട് ലഭിക്കും.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഡെലിവറി ചെയ്യുന്നതിന് 10 മിനിറ്റ് മുമ്പ് ഞാൻ നിങ്ങളെ വിളിക്കട്ടെ?', b: 'എത്തുന്നതിന് ഒരു 10 മിനിറ്റ് മുമ്പ് നിങ്ങളെ ഫോണിൽ അറിയിക്കണോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഡെലിവറി വിലാസത്തിൽ ലാൻഡ്മാർക്ക് ആയി സെന്റ് മേരീസ് പള്ളി ചേർക്കട്ടെ?', b: 'സെന്റ് മേരീസ് പള്ളി എന്ന ലാൻഡ്മാർക്ക് കൂടി നിങ്ങളുടെ അഡ്രസ്സിൽ ആഡ് ചെയ്യട്ടെ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഡോക്ടർ ഗോപി നിർദ്ദേശിച്ചതുപോലെ, ഇസിജി എടുക്കുന്നതിന് മുമ്പ് ബിപി ഗുളിക കഴിച്ചിരുന്നോ?', b: 'ഇസിജിക്ക് മുമ്പ് ബിപിയുടെ ഗുളിക കഴിക്കാൻ ഡോക്ടർ ഗോപി പറഞ്ഞിരുന്നല്ലോ, അത് നിങ്ങൾ കഴിച്ചോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഡോക്ടർ ജോർജ് കുറിച്ച മരുന്നുകൾ 10 ദിവസം കൃത്യമായി കഴിച്ചിരുന്നോ?', b: 'ഡോക്ടർ ജോർജ് എഴുതിത്തന്ന മരുന്ന് 10 ദിവസവും മുടങ്ങാതെ നിങ്ങൾ കഴിച്ചിരുന്നോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: ഡോക്ടർ ശാലിനിയെ കാണാനുള്ള ടോക്കൺ നമ്പർ 14 ആണ്., b: ഡോക്ടർ ശാലിനിയുടെ ഒപിയിൽ നിങ്ങൾക്ക് കിട്ടിയിരിക്കുന്നത് 14-ാം ടോക്കൺ ആണ്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: ദയവായി 3 മിനിറ്റ് ലൈനിൽ തുടരൂ., b: ഒരു 3 മിനിറ്റ് നേരത്തേക്ക് കോൾ ഹോൾഡിൽ വെക്കണേ., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: ദീപ ഒപ്പിട്ട് പാഴ്സൽ വാങ്ങി., b: പാഴ്സൽ ഒപ്പിട്ടു കൈപ്പറ്റിയത് ദീപയാണ്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നമസ്കാരം, കേരള ഫസ്റ്റ് ബാങ്കിന്റെ ഫോൺ ബാങ്കിംഗിൽ നിന്ന് ലത ആണ് സംസാരിക്കുന്നത്.', b: 'കേരള ഫസ്റ്റ് ബാങ്ക് ഫോൺ ബാങ്കിംഗ് വിഭാഗത്തിലെ ലത ആണ് വിളിക്കുന്നത്, നമസ്കാരം.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ അക്കൗണ്ട് ഇനി പൂർണ്ണമായും സജീവമാണ്, ജയ!', b: 'ജയ, ഇപ്പോൾ മുതൽ നിങ്ങളുടെ അക്കൗണ്ട് മുഴുവനായി ആക്ടീവ് ആയിക്കഴിഞ്ഞു!', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ പ്രതിമാസ ശമ്പളം ₹45,000-ന് മുകളിലാണോ?', b: 'മാസം നിങ്ങൾക്ക് കിട്ടുന്ന സാലറി ₹45,000-ത്തിൽ കൂടുതലുണ്ടോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ പ്രദേശത്തെ ടവറിൽ അറ്റകുറ്റപ്പണി നടക്കുന്നതിനാൽ, രാത്രി 11 മണി വരെ സിഗ്നൽ ദുർബലമായിരിക്കും.', b: 'നിങ്ങളുടെ ഏരിയയിലെ ടവർ നന്നാക്കുന്ന പണി നടക്കുന്നതുകൊണ്ട്, രാത്രി 11 മണി ആകുന്നത് വരെ നെറ്റ്വർക്ക് കുറവായിരിക്കും.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: നിങ്ങളുടെ പ്രീപെയ്ഡ് പ്ലാനിൽ ദിവസം 2 ജിബി ഡാറ്റ ലഭിക്കും., b: ഈ പ്രീപെയ്ഡ് പ്ലാൻ പ്രകാരം ഓരോ ദിവസവും 2 ജിബി ഡാറ്റ ഉപയോഗിക്കാം., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: നിങ്ങളുടെ ഫൈബർ കണക്ഷൻ ഇപ്പോൾ 300 എംബിപിഎസ് വേഗത്തിലേക്ക് അപ്ഗ്രേഡ് ചെയ്തു!, b: 'അടിപൊളി, 300 എംബിപിഎസ് സ്പീഡിലേക്ക് നിങ്ങളുടെ ഫൈബർ കണക്ഷൻ ഉയർത്തിയിട്ടുണ്ട്!', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ ഫോളോ-അപ്പ് സന്ദർശനത്തിനുള്ള ഓർമ്മപ്പെടുത്തൽ നവംബർ 2-ന് എസ്എംഎസ് ആയി വരും, ആരോഗ്യത്തോടെയിരിക്കൂ.', b: 'ആരോഗ്യത്തോടെയിരിക്കൂ, ഫോളോ-അപ്പിന് വരാനുള്ള റിമൈൻഡർ നവംബർ 2-ന് മെസേജായി നിങ്ങൾക്ക് കിട്ടും.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ ഫർണിച്ചർ വലുതായതിനാൽ, ഞങ്ങളുടെ 2 ജീവനക്കാർ വന്ന് അത് ഫിറ്റ് ചെയ്തു തരും.', b: 'ഫർണിച്ചർ വലിപ്പമുള്ളതുകൊണ്ട്, 2 സ്റ്റാഫ് വന്ന് അസംബിൾ ചെയ്ത് തരുന്നതാണ്.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ ബിൽ അടയ്ക്കാൻ ഇനി 3 ദിവസം കൂടി ബാക്കിയുണ്ട്, അതിന് ശേഷം ലേറ്റ് ഫീ ഈടാക്കും.', b: 'ബിൽ പേ ചെയ്യാനുള്ള സമയം 3 ദിവസം കൂടിയേ ഉള്ളൂ, അത് കഴിഞ്ഞാൽ പിഴ വരും.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: നിങ്ങളുടെ വാഷിംഗ് മെഷീന് പകരം പുതിയ ഒന്ന് 2 ആഴ്ചയ്ക്കുള്ളിൽ നൽകും., b: പഴയ വാഷിംഗ് മെഷീൻ മാറ്റി പുതിയത് 2 ആഴ്ചയ്ക്കകം ഞങ്ങൾ എത്തിച്ചു തരുന്നതാണ്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ വീട്ടിലെ 3 ഉപകരണങ്ങളിലും ഇതേ പ്രശ്നം കാണുന്നുണ്ടോ?', b: 'ഈ ബുദ്ധിമുട്ട് വീട്ടിലുള്ള 3 ഡിവൈസുകളിലും ഒരുപോലെ ഉണ്ടോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ സ്ഥലം ഞങ്ങളുടെ സർവീസ് ഏരിയയ്ക്ക് പുറത്തായതിനാൽ, അടുത്തുള്ള ഈസികാർട്ട് പിക്കപ്പ് പോയിന്റിൽ നിന്ന് പാഴ്സൽ വാങ്ങേണ്ടി വരും.', b: 'ഞങ്ങൾ സർവീസ് ചെയ്യുന്ന ഏരിയയിൽ നിങ്ങളുടെ സ്ഥലം ഉൾപ്പെടാത്തതുകൊണ്ട്, അടുത്തുള്ള ഈസികാർട്ട് പിക്കപ്പ് പോയിന്റിൽ പോയി പാഴ്സൽ എടുക്കണം.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: നിങ്ങൾ ഇപ്പോൾ ഉപയോഗിക്കുന്ന പ്ലാനിനേക്കാൾ ₹50 കുറവിൽ കൂടുതൽ ഡാറ്റ കിട്ടുന്ന ഒരു പുതിയ പ്ലാൻ ഇപ്പോൾ ലഭ്യമാണ്., b: ഇപ്പോഴത്തെ പ്ലാനിനെക്കാൾ ₹50 വില കുറഞ്ഞതും എന്നാൽ ഡാറ്റ കൂടുതലുള്ളതുമായ ഒരു പ്ലാൻ ഞങ്ങളുടെ പക്കലുണ്ട്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങൾ ഇൻസ്റ്റാൾ ചെയ്തിരിക്കുന്നത് ആപ്പിന്റെ 6 എന്ന പഴയ വേർഷൻ ആണോ?', b: 'നിങ്ങളുടെ ഫോണിൽ ഇപ്പോഴുള്ളത് ആപ്പിന്റെ പഴയ 6 വേർഷനാണോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: നിങ്ങൾ ഓർഡർ ചെയ്ത 4 ഇനങ്ങളും സ്റ്റോക്കിൽ ഉണ്ട്., b: ഓർഡറിൽ ഉള്ള 4 സാധനങ്ങളും ഇപ്പോൾ ഞങ്ങളുടെ പക്കൽ ലഭ്യമാണ്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നിങ്ങൾ പോസ്റ്റ്പെയ്ഡിൽ നിന്ന് പ്രീപെയ്ഡിലേക്ക് മാറാൻ ആഗ്രഹിക്കുന്നത് മാർച്ച് മുതലാണോ?', b: 'മാർച്ച് മുതൽ നിങ്ങളുടെ കണക്ഷൻ പോസ്റ്റ്പെയ്ഡിൽ നിന്ന് പ്രീപെയ്ഡ് ആക്കണമെന്നാണോ പറയുന്നത്?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'നോമിനിയായി ചേർക്കേണ്ടത് നിങ്ങളുടെ ഭാര്യ സുമയെ ആണോ?', b: 'സുമ എന്ന നിങ്ങളുടെ ഭാര്യയെയാണോ നോമിനി ആക്കേണ്ടത്?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: പണം 48 മണിക്കൂറിനകം തിരികെ വരും., b: 48 മണിക്കൂറിനുള്ളിൽ ആ തുക നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് റിവേഴ്സ് ആകും., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'പഴയ ഗേറ്റ് കോഡ് 2580 ഇപ്പോഴും പ്രവർത്തിക്കുമോ?', b: '2580 എന്ന പഴയ ഗേറ്റ് കോഡ് ഇപ്പോഴും വർക്ക് ചെയ്യുന്നുണ്ടോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'പഴയ ഡിവൈസ് തിരികെ തന്നാൽ, പുതിയ മോഡലിന് ₹3,000 വരെ എക്സ്ചേഞ്ച് കിഴിവ് കിട്ടും.', b: 'നിങ്ങളുടെ പഴയ ഡിവൈസ് എക്സ്ചേഞ്ച് ചെയ്യുകയാണെങ്കിൽ, പുതിയ മോഡലിന്റെ വിലയിൽ ₹3,000 വരെ കുറവ് ലഭിക്കും.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: പാക്കറ്റിന് 3 കിലോ ഭാരമുണ്ട്., b: ഈ പാക്കറ്റിന്റെ ആകെ തൂക്കം 3 കിലോഗ്രാം ആണ്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'പാക്കേജിന് കേടുപാട് കണ്ടാൽ, ഡെലിവറി ഏജന്റ് ബാബുവിന്റെ മുന്നിൽ വെച്ച് തന്നെ അത് നിരസിക്കാം.', b: 'പൊതിക്ക് എന്തെങ്കിലും ഡാമേജ് ഉണ്ടെങ്കിൽ, ബാബു എന്ന ഡെലിവറി ഏജന്റ് നിൽക്കുമ്പോൾ തന്നെ നിങ്ങൾക്ക് അത് സ്വീകരിക്കാതിരിക്കാം.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'പാഴ്സൽ അയൽവാസിയായ ജോയിയെ ഏൽപ്പിക്കട്ടെ?', b: 'നിങ്ങളുടെ അയൽക്കാരൻ ജോയിയുടെ കയ്യിൽ പാഴ്സൽ കൊടുത്തോട്ടെ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'പാഴ്സൽ ഏത് സമയത്ത് എത്തിക്കുന്നതാണ് സൗകര്യം, വൈകുന്നേരം 6 മണിക്ക് ശേഷമാണോ?', b: 'നിങ്ങൾക്ക് പാഴ്സൽ കിട്ടാൻ ഇഷ്ടമുള്ള സമയം ഏതാണ്, വൈകുന്നേരം 6 മണി കഴിഞ്ഞാണോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: പാസ്ബുക്ക് അപ്ഡേറ്റ് ചെയ്യാൻ ഏതെങ്കിലും ശാഖയിൽ ശനിയാഴ്ച ഉച്ചവരെ വരാം., b: ശനിയാഴ്ച ഉച്ച വരെ ഏത് ബ്രാഞ്ചിൽ ചെന്നാലും പാസ്ബുക്ക് പ്രിന്റ് ചെയ്തു കിട്ടും., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: പിൻ മാറ്റാൻ 3 തവണ മാത്രം ശ്രമിക്കാം., b: പിൻ മാറ്റാനുള്ള ശ്രമം പരമാവധി 3 പ്രാവശ്യം വരെയേ അനുവദിക്കൂ., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: പുതിയ സിം കാർഡ് അഭിലാഷിന്റെ പേരിലാണ് രജിസ്റ്റർ ചെയ്തിരിക്കുന്നത്., b: അഭിലാഷിന്റെ പേരിൽ ആണ് ഈ പുതിയ സിം എടുത്തിട്ടുള്ളത്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'പ്രശ്നം ഞാൻ മനസ്സിലാക്കുന്നു, സാജു.', b: 'സാജു, നിങ്ങൾ നേരിടുന്ന ബുദ്ധിമുട്ട് എനിക്ക് പൂർണ്ണമായി മനസ്സിലാകുന്നുണ്ട്.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഫിക്സഡ് ഡിപ്പോസിറ്റിന് ഇപ്പോൾ 8 ശതമാനം പലിശ നൽകുന്നുണ്ട്, മുതിർന്ന പൗരന്മാർക്ക് അതിലും കൂടുതൽ കിട്ടും.', b: 'ഇപ്പോൾ ഫിക്സഡ് ഡിപ്പോസിറ്റിനുള്ള പലിശനിരക്ക് 8 ശതമാനമാണ്, സീനിയർ സിറ്റിസൺസിന് അതിനേക്കാൾ ഉയർന്ന നിരക്കുണ്ട്.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: ഫിസിയോതെറാപ്പി 6 സെഷനുകൾ ബാക്കിയുണ്ട്., b: ഇനി 6 ഫിസിയോതെറാപ്പി സെഷനുകൾ കൂടി ചെയ്യാനുണ്ട്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: ഫ്രിഡ്ജ് ഓർഡർ ചെയ്ത എല്ലാവർക്കും ഡിസംബർ 5 വരെ സൗജന്യ ഇൻസ്റ്റലേഷൻ ലഭിക്കും., b: ഡിസംബർ 5 വരെ ഫ്രിഡ്ജ് ഓർഡർ ചെയ്യുന്ന ആർക്കും ഇൻസ്റ്റലേഷൻ ഫ്രീ ആയി ചെയ്തു കൊടുക്കും., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: ബിജു എന്ന ഞങ്ങളുടെ ടെക്നീഷ്യൻ നാളെ നിങ്ങളുടെ വീട്ടിൽ വരും., b: നാളെ ഞങ്ങളുടെ ടെക്നീഷ്യനായ ബിജു നിങ്ങളുടെ വീട്ടിലേക്ക് എത്തുന്നതാണ്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ബിൽ, ഇമെയിലായി അയയ്ക്കുന്നതിന് പകരം, എല്ലാ മാസവും 3-ാം തീയതി വാട്സാപ്പിൽ അയച്ചാൽ മതിയോ?', b: 'ചേച്ചി, ബിൽ ഇമെയിലായി അയയ്ക്കുന്നതിന് പകരം, എല്ലാ മാസവും 3-ാം തീയതി വാട്സാപ്പിൽ അയച്ചാൽ മതിയോ?', label: paraphrase, request: filler, stored: punct_inner}
- {lang: ml, a: 'മികച്ചത്, നിങ്ങളുടെ ഷുഗർ ലെവൽ 110 ആയി കുറഞ്ഞു!', b: 'നല്ല പുരോഗതി, ഷുഗർ ഇപ്പോൾ 110-ലേക്ക് താഴ്ന്നിട്ടുണ്ട്!', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'മീര, എന്റെ ശബ്ദം വ്യക്തമായി കേൾക്കുന്നുണ്ടോ?', b: 'മീര, ഞാൻ പറയുന്നത് നിങ്ങൾക്ക് തെളിഞ്ഞു കേൾക്കാൻ പറ്റുന്നുണ്ടോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'മുട്ടുവേദനയ്ക്ക് ഓർത്തോപീഡിക് വിഭാഗത്തിലെ ഡോക്ടർ സക്കറിയയെ ആണോ കാണേണ്ടത്?', b: 'മുട്ടിലെ വേദനയ്ക്ക് ഓർത്തോ വിഭാഗത്തിലുള്ള ഡോക്ടർ സക്കറിയയുടെ അപ്പോയിന്റ്മെന്റ് ആണോ നിങ്ങൾക്ക് വേണ്ടത്?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'മെയ് 20 വരെ നിങ്ങൾ വിദേശത്താണോ?', b: 'മെയ് 20 ആകുന്നത് വരെ നിങ്ങൾ ഇന്ത്യക്ക് പുറത്തായിരിക്കുമോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'യുപിഐ ഇടപാടുകൾക്ക് ദിവസം ₹1,00,000 ആണ് പരിധി.', b: 'ഒരു ദിവസം യുപിഐ വഴി പരമാവധി ₹1,00,000 വരെ അയയ്ക്കാം.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: രേഖ ഇന്ന് രാവിലെ നിങ്ങളുടെ പരാതി ക്ലോസ് ചെയ്തു., b: നിങ്ങളുടെ പരാതി ഇന്ന് രാവിലെ അവസാനിപ്പിച്ചത് രേഖയാണ്., label: paraphrase, request: paraphrase, stored: new}
