- {lang: kn, a: 'ಅಭಿನಂದನೆಗಳು, ನಿಮ್ಮ ಕ್ರೆಡಿಟ್ ಮಿತಿ ಈಗ ₹1,50,000 ಕ್ಕೆ ಏರಿದೆ!', b: 'ಕ್ಷಮಿಸಿ, ನಿಮ್ಮ ಕ್ರೆಡಿಟ್ ಮಿತಿ ಈಗ ₹1,50,000 ಕ್ಕೆ ಇಳಿದಿದೆ!', label: changed, request: meaning_change, stored: new}
- {lang: kn, a: ಉತ್ಪನ್ನ ಹಿಂತಿರುಗಿಸಲು ಖರೀದಿಸಿದ 7 ದಿನಗಳ ಒಳಗೆ ವಿನಂತಿ ಸಲ್ಲಿಸಬೇಕು., b: 'ಚೆಕ್ ಬುಕ್ ಬೇಕಾದರೆ ನೆಟ್ ಬ್ಯಾಂಕಿಂಗ್‌ನಲ್ಲಿ ವಿನಂತಿ ಹಾಕಿ, 7 ದಿನದಲ್ಲಿ ಬರುತ್ತದೆ.', label: changed, request: new, stored: slot_change}
- {lang: kn, a: 'ಧನ್ಯವಾದಗಳು, ನಿಮ್ಮ ರೀಚಾರ್ಜ್ ಯಶಸ್ವಿಯಾಗಿದೆ, ವ್ಯಾಲಿಡಿಟಿ 28 ದಿನ.', b: 'ಕ್ಷಮಿಸಿ, ನಿಮ್ಮ ರೀಚಾರ್ಜ್ ವಿಫಲವಾಗಿದೆ, ವ್ಯಾಲಿಡಿಟಿ 28 ದಿನ.', label: changed, request: meaning_change, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಅಂಗಡಿ ಶ್ರೀ ಗಣೇಶ ಟ್ರೇಡರ್ಸ್ ಹೆಸರಿನಲ್ಲಿ ಕರೆಂಟ್ ಖಾತೆ ತೆರೆಯೋಣವೇ?', b: 'ನಿಮ್ಮ ಅಂಗಡಿ ಮಂಜು ಎಂಟರ್‌ಪ್ರೈಸಸ್ ಹೆಸರಿನಲ್ಲಿ ಕರೆಂಟ್ ಖಾತೆ ತೆರೆಯೋಣವೇ?', label: changed, request: slot_change, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಅಂಗಡಿ ಶ್ರೀ ಗಣೇಶ ಟ್ರೇಡರ್ಸ್ ಹೆಸರಿನಲ್ಲಿ ಕರೆಂಟ್ ಖಾತೆ ತೆರೆಯೋಣವೇ?', b: 'ನಿಮ್ಮ ಅಂಗಡಿ ಶ್ರೀ ಗಣೇಶ ಟ್ರೇಡರ್ಸ್ ಹೆಸರಿನಲ್ಲಿರುವ ಕರೆಂಟ್ ಖಾತೆ ಮುಚ್ಚೋಣವೇ?', label: changed, request: meaning_change, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಅಂಗಡಿ ಶ್ರೀ ಗಣೇಶ ಟ್ರೇಡರ್ಸ್ ಹೆಸರಿನಲ್ಲಿ ಕರೆಂಟ್ ಖಾತೆ ತೆರೆಯೋಣವೇ?', b: 'ನಿಮ್ಮ ಅಂಗಡಿ ಸಾಯಿ ಏಜೆನ್ಸೀಸ್ ಹೆಸರಿನಲ್ಲಿ ಕರೆಂಟ್ ಖಾತೆ ತೆರೆಯೋಣವೇ?', label: changed, request: slot_change, stored: new}
- {lang: kn, a: '17 ನವೆಂಬರ್ ರ ಶಸ್ತ್ರಚಿಕಿತ್ಸೆಗೆ ನಿಮ್ಮ ಜೊತೆ ಒಬ್ಬ ಸಹಾಯಕರು ಬರುತ್ತಾರೆಯೇ?', b: '17 ನವೆಂಬರ್ ರಂದು ಆಪರೇಷನ್ ಇರುವಾಗ, ನಿಮ್ಮನ್ನು ನೋಡಿಕೊಳ್ಳಲು ಯಾರಾದರೂ ಜೊತೆಗೆ ಇರುತ್ತಾರಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 24 ಗಂಟೆಯೊಳಗೆ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ರದ್ದುಗೊಳಿಸಿದರೆ ₹200 ಶುಲ್ಕ ವಿಧಿಸಲಾಗುತ್ತದೆ., b: 'ಭೇಟಿಗೆ 24 ಗಂಟೆ ಬಾಕಿ ಇರುವಾಗ ಕ್ಯಾನ್ಸಲ್ ಮಾಡಿದರೆ, ನೀವು ₹200 ಫೀ ಕಟ್ಟಬೇಕಾಗುತ್ತದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 8 ನಿಮಿಷ ಕಾಯಿಸಿದ್ದಕ್ಕೆ ಕ್ಷಮೆ ಇರಲಿ!, b: ನಿಮ್ಮನ್ನು 8 ನಿಮಿಷ ಕಾಯುವಂತೆ ಮಾಡಿದ್ದಕ್ಕೆ ದಯವಿಟ್ಟು ಕ್ಷಮಿಸಿ!, label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ಬುಕ್ ಆಯಿತು, ಶ್ರೀಧರ್ ಅವರೇ, ಬೇಗ ಗುಣಮುಖರಾಗಿ!', b: 'ಶ್ರೀಧರ್ ಅವರೇ, ನಿಮ್ಮ ಬುಕಿಂಗ್ ಕನ್‌ಫರ್ಮ್ ಆಗಿದೆ, ಆದಷ್ಟು ಬೇಗ ಹುಷಾರಾಗಿ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಅಭಿನಂದನೆಗಳು, ನಿಮ್ಮ ಕ್ರೆಡಿಟ್ ಮಿತಿ ಈಗ ₹1,50,000 ಕ್ಕೆ ಏರಿದೆ!', b: 'ಶುಭ ಸುದ್ದಿ, ನಿಮ್ಮ ಕ್ರೆಡಿಟ್ ಲಿಮಿಟ್ ಅನ್ನು ₹1,50,000 ವರೆಗೆ ಹೆಚ್ಚಿಸಲಾಗಿದೆ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಅರ್ಜುನ್ ಅವರೇ, ನಿಮ್ಮ ಸಮಸ್ಯೆ ಸಂಪೂರ್ಣವಾಗಿ ಬಗೆಹರಿದಿದೆ ಎಂದು ಕೇಳಿ ಖುಷಿಯಾಯಿತು!', b: 'ಅರ್ಜುನ್ ಅವರೇ, ನಿಮ್ಮ ತೊಂದರೆ ಪೂರ್ತಿಯಾಗಿ ಸರಿಹೋಯಿತು ಅನ್ನುವುದು ನಮಗೆ ಸಂತೋಷದ ವಿಷಯ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಅಲ್ವಾ, ಇ-ಸಿಮ್ ಸಕ್ರಿಯಗೊಳಿಸಲು ನಿಮಗೆ ಬಂದ ಕ್ಯೂಆರ್ ಕೋಡ್ ಅನ್ನು 15 ನಿಮಿಷದೊಳಗೆ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ.', b: ನಿಮಗೆ ಕಳುಹಿಸಿದ ಕ್ಯೂಆರ್ ಕೋಡ್ ಅನ್ನು 15 ನಿಮಿಷದ ಒಳಗೆ ಸ್ಕ್ಯಾನ್ ಮಾಡಿದರೆ ಮಾತ್ರ ಇ-ಸಿಮ್ ಚಾಲೂ ಆಗುತ್ತದೆ., label: paraphrase, request: paraphrase, stored: filler}
- {lang: kn, a: 'ಅಲ್ವಾ, ಪಿನ್ ಕೋಡ್ 577201 ಪ್ರದೇಶಕ್ಕೆ ಸದ್ಯಕ್ಕೆ ನಾವು ಡೆಲಿವರಿ ಮಾಡುವುದಿಲ್ಲ.', b: ಈ ಸಮಯದಲ್ಲಿ 577201 ಪಿನ್ ಕೋಡ್ ಏರಿಯಾಗೆ ನಮ್ಮ ಡೆಲಿವರಿ ಸೇವೆ ಲಭ್ಯವಿಲ್ಲ., label: paraphrase, request: paraphrase, stored: filler}
- {lang: kn, a: ಆರ್ಡರ್ 66130 ಎಲ್ಲಿದೆ ಎಂದು ನಾನು ಈಗ ಟ್ರ್ಯಾಕ್ ಮಾಡುತ್ತಿದ್ದೇನೆ., b: 'ಒಂದು ಕ್ಷಣ, ಆರ್ಡರ್ 66130 ಯಾವ ಸ್ಥಳದಲ್ಲಿದೆ ಎಂದು ಸಿಸ್ಟಮ್‌ನಲ್ಲಿ ಚೆಕ್ ಮಾಡುತ್ತಿದ್ದೇನೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಆ್ಯಪ್ ಅನ್ನು ಆವೃತ್ತಿ 6 ಗೆ ಅಪ್‌ಡೇಟ್ ಮಾಡಿದರೆ ಈ ಲಾಗಿನ್ ದೋಷ ಹೋಗುತ್ತದೆ., b: ಲಾಗಿನ್‌ನಲ್ಲಿ ಬರುವ ಈ ಎರರ್ ಸರಿಯಾಗಲು ಆ್ಯಪ್‌ನ 6 ನೇ ವರ್ಷನ್ ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡಿ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಇ-ಸಿಮ್ ಸಕ್ರಿಯಗೊಳಿಸಲು ನಿಮಗೆ ಬಂದ ಕ್ಯೂಆರ್ ಕೋಡ್ ಅನ್ನು 15 ನಿಮಿಷದೊಳಗೆ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ., b: ನಿಮಗೆ ಕಳುಹಿಸಿದ ಕ್ಯೂಆರ್ ಕೋಡ್ ಅನ್ನು 15 ನಿಮಿಷದ ಒಳಗೆ ಸ್ಕ್ಯಾನ್ ಮಾಡಿದರೆ ಮಾತ್ರ ಇ-ಸಿಮ್ ಚಾಲೂ ಆಗುತ್ತದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಈ ಕರೆಯ ಕೊನೆಯಲ್ಲಿ ಒಂದು ಚಿಕ್ಕ ಸರ್ವೆ ಬರುತ್ತದೆ, ಅದಕ್ಕೆ 1 ರಿಂದ 5 ರೇಟಿಂಗ್ ಕೊಡಿ.', b: 'ಕಾಲ್ ಮುಗಿದ ಮೇಲೆ ಸಣ್ಣ ಸರ್ವೆ ಕೇಳುತ್ತದೆ, ದಯವಿಟ್ಟು 1 ರಿಂದ 5 ರ ನಡುವೆ ಅಂಕ ನೀಡಿ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಈ ಕಾಂಬೋ ಪ್ಯಾಕ್‌ನಲ್ಲಿ ನೆಟ್‌ಫ್ಲಿಕ್ಸ್ ಚಂದಾದಾರಿಕೆ ಉಚಿತವಾಗಿ ಸಿಗುತ್ತದೆ!, b: 'ಈ ಕಾಂಬೋ ಪ್ಲಾನ್ ಜೊತೆಗೆ, ನೆಟ್‌ಫ್ಲಿಕ್ಸ್ ಸಬ್‌ಸ್ಕ್ರಿಪ್ಷನ್ ನಿಮಗೆ ಫ್ರೀ ಆಗಿ ಬರುತ್ತದೆ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಈ ತಿಂಗಳ ಬಿಲ್ ₹1,186, ಅದರಲ್ಲಿ ₹200 ಹೆಚ್ಚುವರಿ ಡೇಟಾ ಶುಲ್ಕ ಸೇರಿದೆ.', b: 'ನಿಮ್ಮ ಈ ತಿಂಗಳ ₹1,186 ಬಿಲ್‌ನಲ್ಲಿ, ಎಕ್ಸ್ಟ್ರಾ ಡೇಟಾ ಬಳಕೆಗಾಗಿ ₹200 ಸೇರಿಸಲಾಗಿದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಈ ಸೌಲಭ್ಯ ಪ್ರೀಮಿಯಂ ಸದಸ್ಯರಿಗೆ ಮಾತ್ರ, ಇದರ ವಾರ್ಷಿಕ ಶುಲ್ಕ ₹999.', b: 'ಪ್ರೀಮಿಯಂ ಮೆಂಬರ್‌ಶಿಪ್ ಇರುವವರಿಗೆ ಮಾತ್ರ ಈ ಫೀಚರ್ ಸಿಗುತ್ತದೆ, ಅದಕ್ಕೆ ವರ್ಷಕ್ಕೆ ₹999 ಕಟ್ಟಬೇಕು.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಈ ಹಣ ವರ್ಗಾವಣೆ 2 ಗಂಟೆಯೊಳಗೆ ಪೂರ್ಣಗೊಳ್ಳುತ್ತದೆ., b: ಮುಂದಿನ 2 ಗಂಟೆಗಳಲ್ಲಿ ಈ ಫಂಡ್ ಟ್ರಾನ್ಸ್‌ಫರ್ ಮುಗಿಯುತ್ತದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಉತ್ಪನ್ನ ಹಿಂತಿರುಗಿಸಲು ಖರೀದಿಸಿದ 10 ದಿನಗಳ ಒಳಗೆ ವಿನಂತಿ ಸಲ್ಲಿಸಬೇಕು., b: 'ಪ್ರಾಡಕ್ಟ್ ರಿಟರ್ನ್ ಮಾಡಬೇಕಾದರೆ, ಖರೀದಿ ದಿನದಿಂದ 10 ದಿನದೊಳಗೆ ರಿಕ್ವೆಸ್ಟ್ ಹಾಕಬೇಕಾಗುತ್ತದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಎಕ್ಸ್‌ಪ್ರೆಸ್ ಡೆಲಿವರಿಗೆ ಹೆಚ್ಚುವರಿ ₹99 ಆಗುತ್ತದೆ, ಬೇಕೇ?', b: 'ಬೇಗ ತಲುಪಿಸುವ ಎಕ್ಸ್‌ಪ್ರೆಸ್ ಆಯ್ಕೆಗೆ ₹99 ಎಕ್ಸ್ಟ್ರಾ ಚಾರ್ಜ್ ಇದೆ, ಅದನ್ನು ಆರಿಸುತ್ತೀರಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಓಹ್, ನಿಮ್ಮ ₹650 ಕೇಕ್ ಆರ್ಡರ್ ತಪ್ಪು ವಿಳಾಸಕ್ಕೆ ಹೋಗಿದೆ!', b: 'ಅಯ್ಯೋ, ₹650 ಬೆಲೆಯ ನಿಮ್ಮ ಕೇಕ್ ಬೇರೆ ಯಾರದೋ ಅಡ್ರೆಸ್‌ಗೆ ಡೆಲಿವರಿ ಆಗಿಬಿಟ್ಟಿದೆ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಕಣ್ಣಿನ ಪರೀಕ್ಷೆಯ ನಂತರ 4 ಗಂಟೆ ವಾಹನ ಚಲಾಯಿಸಬೇಡಿ., b: ಐ ಟೆಸ್ಟ್ ಮುಗಿದ ಮೇಲೆ ಮುಂದಿನ 4 ಗಂಟೆಗಳ ಕಾಲ ನೀವೇ ಗಾಡಿ ಓಡಿಸಲು ಹೋಗಬೇಡಿ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಕಣ್ಣಿನ ಪರೀಕ್ಷೆಯ ನಂತರ, 4 ಗಂಟೆ ವಾಹನ ಚಲಾಯಿಸಬೇಡಿ.', b: ಐ ಟೆಸ್ಟ್ ಮುಗಿದ ಮೇಲೆ ಮುಂದಿನ 4 ಗಂಟೆಗಳ ಕಾಲ ನೀವೇ ಗಾಡಿ ಓಡಿಸಲು ಹೋಗಬೇಡಿ., label: paraphrase, request: paraphrase, stored: punct_inner}
- {lang: kn, a: 'ಕರೆ ಮುಗಿಸುತ್ತಿದ್ದೇನೆ, ಅನಿಲ್ ಅವರೇ, ನಿಮ್ಮ ಸಂಜೆ ಶುಭವಾಗಿರಲಿ!', b: 'ಅನಿಲ್ ಅವರೇ, ಈಗ ನಾನು ಕಾಲ್ ಕಟ್ ಮಾಡುತ್ತೇನೆ, ಒಳ್ಳೆಯ ಸಂಜೆ ನಿಮ್ಮದಾಗಲಿ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಕಳೆದ 3 ದಿನಗಳಿಂದ ಕಾಲ್ ಡ್ರಾಪ್ ಮನೆಯೊಳಗೆ ಮಾತ್ರ ಆಗುತ್ತಿದೆಯೇ?', b: 'ಕಳೆದ 3 ದಿನದಿಂದ ಕರೆಗಳು ಕಟ್ ಆಗುವುದು ಕೇವಲ ಮನೆಯ ಒಳಗಡೆ ಮಾತ್ರವಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಕಳೆದ ಭಾನುವಾರ ಸಾಫ್ಟ್‌ವೇರ್ ಅಪ್‌ಡೇಟ್ ಆದ ನಂತರ ವೋಲ್ಟಿ ಕೆಲಸ ಮಾಡುತ್ತಿಲ್ಲವೇ?', b: 'ಕಳೆದ ಭಾನುವಾರ ಫೋನ್ ಅಪ್‌ಡೇಟ್ ಆದಾಗಿನಿಂದ ವೋಲ್ಟಿ ಕರೆಗಳು ಬರುತ್ತಿಲ್ಲವೇ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಕೆನರಾ ಬ್ಯಾಂಕ್ ಎಂದಿಗೂ ಫೋನ್‌ನಲ್ಲಿ ನಿಮ್ಮ ನೆಟ್ ಬ್ಯಾಂಕಿಂಗ್ ಪಾಸ್‌ವರ್ಡ್ ಕೇಳುವುದಿಲ್ಲ!, b: 'ನೆನಪಿಡಿ, ಕೆನರಾ ಬ್ಯಾಂಕ್‌ನಿಂದ ಯಾರೂ ಕರೆ ಮಾಡಿ ನಿಮ್ಮ ನೆಟ್ ಬ್ಯಾಂಕಿಂಗ್ ಪಾಸ್‌ವರ್ಡ್ ಕೇಳುವುದಿಲ್ಲ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಕ್ಯಾಶ್ ಆನ್ ಡೆಲಿವರಿಗೆ ₹1,840 ಚಿಲ್ಲರೆ ಸಿದ್ಧವಾಗಿಡಿ.', b: 'ಡೆಲಿವರಿ ಸಮಯದಲ್ಲಿ ನಗದು ಕೊಡಬೇಕಾದ ₹1,840 ಅನ್ನು ಸರಿಯಾದ ಚೇಂಜ್ ಜೊತೆ ರೆಡಿ ಇಟ್ಟುಕೊಳ್ಳಿ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಕ್ಲಿನಿಕ್‌ನ ಪಾರ್ಕಿಂಗ್ 2 ಗಂಟೆಗಳವರೆಗೆ ಉಚಿತ., b: ಕ್ಲಿನಿಕ್ ಆವರಣದಲ್ಲಿ ಮೊದಲ 2 ಗಂಟೆಗಳ ಕಾಲ ಫ್ರೀ ಆಗಿ ಗಾಡಿ ನಿಲ್ಲಿಸಬಹುದು., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಕ್ಷಮಿಸಿ, ಡಾಕ್ಟರ್ ತುರ್ತು ಶಸ್ತ್ರಚಿಕಿತ್ಸೆಯಲ್ಲಿರುವುದರಿಂದ ಗುರುವಾರದ ಎಲ್ಲಾ ಭೇಟಿಗಳು ರದ್ದಾಗಿವೆ.', b: 'ವೈದ್ಯರು ಎಮರ್ಜೆನ್ಸಿ ಆಪರೇಷನ್‌ನಲ್ಲಿ ಇರುವ ಕಾರಣ, ಗುರುವಾರ ಬುಕ್ ಆಗಿದ್ದ ಎಲ್ಲಾ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್‌ಗಳನ್ನು ಕ್ಯಾನ್ಸಲ್ ಮಾಡಲಾಗಿದೆ, ಕ್ಷಮಿಸಿ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಗರ್ಭಿಣಿಯರ ತಪಾಸಣೆಗೆ ಡಾಕ್ಟರ್ ಶಾಲಿನಿ ಅವರು ಸೋಮವಾರ ಮತ್ತು ಗುರುವಾರ ಮಾತ್ರ ಸಿಗುತ್ತಾರೆ., b: ಪ್ರೆಗ್ನೆನ್ಸಿ ಚೆಕಪ್‌ಗಾಗಿ ಡಾಕ್ಟರ್ ಶಾಲಿನಿ ಅವರನ್ನು ವಾರದಲ್ಲಿ ಸೋಮವಾರ ಹಾಗೂ ಗುರುವಾರ ಮಾತ್ರ ಕಾಣಬಹುದು., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಚಾಟ್‌ನಲ್ಲಿ ನಿಮಗೆ ಸಹಾಯ ಮಾಡಿದ ಪೂಜಾ ಅವರು ನಾಳೆ ಮತ್ತೆ ಕರೆ ಮಾಡುತ್ತಾರೆ., b: 'ನಾಳೆ ಮತ್ತೊಮ್ಮೆ ಪೂಜಾ ಅವರೇ ನಿಮಗೆ ಫೋನ್ ಮಾಡುತ್ತಾರೆ, ಚಾಟ್‌ನಲ್ಲಿ ನಿಮಗೆ ನೆರವಾದವರು ಅವರೇ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಚೆಕ್ ಬುಕ್ ಬೇಕಾದರೆ ನೆಟ್ ಬ್ಯಾಂಕಿಂಗ್‌ನಲ್ಲಿ ವಿನಂತಿ ಹಾಕಿ, 7 ದಿನದಲ್ಲಿ ಬರುತ್ತದೆ.', b: 'ನೆಟ್ ಬ್ಯಾಂಕಿಂಗ್ ಮೂಲಕ ಚೆಕ್ ಬುಕ್‌ಗೆ ರಿಕ್ವೆಸ್ಟ್ ಮಾಡಿದರೆ, ಅದು 7 ದಿನದೊಳಗೆ ನಿಮ್ಮ ಕೈ ಸೇರುತ್ತದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಜಂಟಿ ಖಾತೆದಾರರಾದ ಅಕ್ಷಯ್ ಅವರ ಅನುಮತಿಯೂ ಇದಕ್ಕೆ ಬೇಕಾಗುತ್ತದೆ., b: ಈ ಕೆಲಸಕ್ಕೆ ಜಾಯಿಂಟ್ ಅಕೌಂಟ್‌ನ ಇನ್ನೊಬ್ಬ ಹೋಲ್ಡರ್ ಅಕ್ಷಯ್ ಅವರ ಒಪ್ಪಿಗೆ ಕೂಡ ಅಗತ್ಯ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಟವರ್ 7 ರ ಸೆಕ್ಯುರಿಟಿ ಗೇಟ್‌ನಲ್ಲಿ ಪಾರ್ಸಲ್ ಬಿಟ್ಟು ಹೋಗಬಹುದೇ?', b: 'ಪ್ಯಾಕೇಜ್ ಅನ್ನು ಟವರ್ 7 ರ ಗೇಟ್ ಬಳಿ ಇರುವ ಸೆಕ್ಯುರಿಟಿಯವರ ಕೈಗೆ ಕೊಟ್ಟರೆ ಸರಿಯೇ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ತೂಕ 42 ಕಿಲೋ ಇರುವುದರಿಂದ, ಈ ವಸ್ತುವನ್ನು ತರಲು ಇಬ್ಬರು ಸಿಬ್ಬಂದಿ ಬರುತ್ತಾರೆ.', b: 'ಇದು 42 ಕಿಲೋ ಭಾರದ ಸಾಮಾನು, ಹಾಗಾಗಿ ಅದನ್ನು ಹೊತ್ತು ತರಲು ಇಬ್ಬರು ಜನ ಬರುತ್ತಾರೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ದಯವಿಟ್ಟು 2 ನಿಮಿಷ ಲೈನ್‌ನಲ್ಲಿರಿ., b: ಕೇವಲ 2 ನಿಮಿಷ ಕಾಲ್ ಹೋಲ್ಡ್‌ನಲ್ಲಿ ಇಟ್ಟುಕೊಳ್ಳಿ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ದೀಪಾವಳಿ ಹಬ್ಬದ ಜನಸಂದಣಿಯಿಂದಾಗಿ, ಈ ವಾರ ಡೆಲಿವರಿ ಒಂದೆರಡು ದಿನ ತಡವಾಗಬಹುದು.', b: 'ಈ ವಾರ ದೀಪಾವಳಿ ಸೀಸನ್‌ನ ರಶ್ ಇರುವುದರಿಂದ, ಪಾರ್ಸಲ್‌ಗಳು ಒಂದೆರಡು ದಿನ ಲೇಟ್ ಆಗಿ ಬರುವ ಸಾಧ್ಯತೆ ಇದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಧನ್ಯವಾದಗಳು, ನಿಮ್ಮ ರೀಚಾರ್ಜ್ ಯಶಸ್ವಿಯಾಗಿದೆ, ವ್ಯಾಲಿಡಿಟಿ 28 ದಿನ.', b: 'ರೀಚಾರ್ಜ್ ಸರಿಯಾಗಿ ಆಗಿದೆ, ಅದರ ಅವಧಿ 28 ದಿನಗಳು, ಥ್ಯಾಂಕ್ಯೂ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಮ್ಮ ಡೆಲಿವರಿ ಹುಡುಗ ಮಂಜು ನಿಮ್ಮ ಬೀದಿಯ ತಿರುವಿನಲ್ಲಿ ಕಾಯುತ್ತಿದ್ದಾರೆ., b: ಮಂಜು ಎಂಬ ನಮ್ಮ ಡೆಲಿವರಿ ಏಜೆಂಟ್ ನಿಮ್ಮ ರಸ್ತೆಯ ಕಾರ್ನರ್‌ನಲ್ಲಿ ನಿಂತಿದ್ದಾರೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಾನು ಈಗ ನಿಮ್ಮ ಹಿಂದಿನ 2 ದೂರುಗಳ ಇತಿಹಾಸವನ್ನು ನೋಡುತ್ತಿದ್ದೇನೆ., b: ನೀವು ಹಿಂದೆ ನೀಡಿದ 2 ಕಂಪ್ಲೇಂಟ್‌ಗಳ ಹಿಸ್ಟರಿಯನ್ನು ಈ ಕ್ಷಣ ಪರಿಶೀಲಿಸುತ್ತಿದ್ದೇನೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಾಳೆ ಬೆಳಿಗ್ಗೆಯ ಭೇಟಿಗೆ ನೀವು ಬರುತ್ತೀರಾ?', b: 'ನಾಳೆ ಬೆಳಿಗ್ಗೆ ನಿಗದಿಯಾದ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್‌ಗೆ ನೀವು ಹಾಜರಾಗುತ್ತೀರಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ 20 ಡಿಸೆಂಬರ್ ಪ್ರಯಾಣಕ್ಕೆ ಮುಂಚೆ ಅಂತರರಾಷ್ಟ್ರೀಯ ರೋಮಿಂಗ್ ಆನ್ ಮಾಡಬೇಕೇ?', b: '20 ಡಿಸೆಂಬರ್ ರಂದು ನೀವು ಪ್ರಯಾಣ ಹೊರಡುವ ಮೊದಲು ಇಂಟರ್‌ನ್ಯಾಷನಲ್ ರೋಮಿಂಗ್ ಚಾಲೂ ಮಾಡಲೇ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಅಂಗಡಿ ಶ್ರೀ ಗಣೇಶ ಟ್ರೇಡರ್ಸ್ ಹೆಸರಿನಲ್ಲಿ ಕರೆಂಟ್ ಖಾತೆ ತೆರೆಯೋಣವೇ?', b: 'ಶ್ರೀ ಗಣೇಶ ಟ್ರೇಡರ್ಸ್ ಎಂಬ ನಿಮ್ಮ ಅಂಗಡಿಯ ಹೆಸರಿಗೆ ಒಂದು ಕರೆಂಟ್ ಅಕೌಂಟ್ ಓಪನ್ ಮಾಡಬಹುದಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಆಧಾರ್ ಮತ್ತು ಪ್ಯಾನ್ ಎರಡೂ ಖಾತೆ 30045 ಗೆ ಜೋಡಣೆಯಾಗಿವೆ., b: ಖಾತೆ 30045 ಗೆ ನಿಮ್ಮ ಪ್ಯಾನ್ ಹಾಗೂ ಆಧಾರ್ ಎರಡನ್ನೂ ಲಿಂಕ್ ಮಾಡಲಾಗಿದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಆರ್ಡರ್ 72904 ಹುಬ್ಬಳ್ಳಿ ಗೋದಾಮಿನಿಂದ ಹೊರಟಿದೆ., b: ಆರ್ಡರ್ 72904 ಈಗ ಹುಬ್ಬಳ್ಳಿಯ ವೇರ್‌ಹೌಸ್ ಬಿಟ್ಟು ನಿಮ್ಮ ಕಡೆ ಬರುತ್ತಿದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಊಟದ ಆರ್ಡರ್ 25 ನಿಮಿಷದಲ್ಲಿ ಬಿಸಿ ಬಿಸಿಯಾಗಿ ಬರುತ್ತದೆ., b: ಇನ್ನು 25 ನಿಮಿಷಗಳಲ್ಲಿ ನೀವು ಆರ್ಡರ್ ಮಾಡಿದ ಊಟ ಹಾಟ್ ಆಗಿಯೇ ನಿಮ್ಮ ಬಾಗಿಲಿಗೆ ತಲುಪುತ್ತದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಎಂಆರ್‌ಐ ಸ್ಕ್ಯಾನ್ 3 ನೇ ಮಹಡಿಯ ಕೊಠಡಿ 304 ರಲ್ಲಿ ನಡೆಯುತ್ತದೆ., b: ಎಂಆರ್‌ಐ ಸ್ಕ್ಯಾನ್‌ಗಾಗಿ ನೀವು 3 ನೇ ಫ್ಲೋರ್‌ನಲ್ಲಿರುವ 304 ನಂಬರ್ ರೂಮ್‌ಗೆ ಹೋಗಬೇಕು., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಕಂಪ್ಲೇಂಟ್ ಅನ್ನು ನಾನು ಹಿರಿಯ ವ್ಯವಸ್ಥಾಪಕರಾದ ಶ್ರೀನಿವಾಸ್ ಅವರಿಗೆ ವರ್ಗಾಯಿಸುತ್ತೇನೆ., b: ಶ್ರೀನಿವಾಸ್ ಎಂಬ ನಮ್ಮ ಸೀನಿಯರ್ ಮ್ಯಾನೇಜರ್ ಇನ್ನು ಮುಂದೆ ಈ ದೂರನ್ನು ನೋಡಿಕೊಳ್ಳುವಂತೆ ನಾನು ಕಳುಹಿಸುತ್ತೇನೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಕಾರಿನ ಸರ್ವೀಸ್‌ಗೆ 9 ನವೆಂಬರ್ ಬೆಳಿಗ್ಗೆ ಸ್ಲಾಟ್ ಬುಕ್ ಆಗಿದೆ., b: 9 ನವೆಂಬರ್ ಬೆಳಿಗ್ಗೆ ನಿಮ್ಮ ಕಾರನ್ನು ಸರ್ವೀಸ್ ಸೆಂಟರ್‌ಗೆ ತರಲು ಸಮಯ ನಿಗದಿಯಾಗಿದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಕಾರ್ಡ್‌ನಿಂದ ₹8,750 ರ ವಹಿವಾಟು ನಡೆದಿದೆ, ಇದು ನೀವೇ ಮಾಡಿದ್ದೇ?', b: '₹8,750 ಮೊತ್ತದ ಒಂದು ಟ್ರಾನ್ಸಾಕ್ಷನ್ ನಿಮ್ಮ ಕಾರ್ಡ್‌ನಲ್ಲಿ ಕಾಣಿಸುತ್ತಿದೆ, ಅದನ್ನು ನೀವು ಮಾಡಿದ್ದೀರಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಕೇಸ್ 15 ನವೆಂಬರ್ ಒಳಗೆ ಮುಕ್ತಾಯವಾಗುವ ನಿರೀಕ್ಷೆಯಿದೆ., b: 15 ನವೆಂಬರ್ ಒಳಗೆ ಈ ಕೇಸ್ ಕ್ಲೋಸ್ ಆಗಬಹುದು ಎಂದು ನಾವು ಅಂದಾಜಿಸಿದ್ದೇವೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಚೆಕ್ ಸಂಖ್ಯೆ 002317 ಬೌನ್ಸ್ ಆಗಿದೆ., b: 002317 ನಂಬರಿನ ನಿಮ್ಮ ಚೆಕ್ ಅನ್ನು ಬ್ಯಾಂಕ್ ಹಿಂದಿರುಗಿಸಿದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಟಿಕೆಟ್ 58214 ಈಗಾಗಲೇ ನಮ್ಮ ತಾಂತ್ರಿಕ ತಂಡಕ್ಕೆ ಕಳುಹಿಸಲಾಗಿದೆ., b: ನಾವು ಟಿಕೆಟ್ 58214 ಅನ್ನು ಈಗಾಗಲೇ ಟೆಕ್ನಿಕಲ್ ಟೀಮ್‌ಗೆ ಫಾರ್ವರ್ಡ್ ಮಾಡಿದ್ದೇವೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಟಿಪಿ-ಲಿಂಕ್ ರೌಟರ್‌ನಲ್ಲಿ ಕೆಂಪು ಲೈಟ್ ಮಿನುಗುತ್ತಿದೆಯೇ?', b: 'ಟಿಪಿ-ಲಿಂಕ್ ರೌಟರ್‌ನ ಮೇಲೆ ಕೆಂಪು ಬಣ್ಣದ ದೀಪ ಬ್ಲಿಂಕ್ ಆಗುತ್ತಿದೆಯಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ದಿನಸಿ ಆರ್ಡರ್‌ನಲ್ಲಿ ನಂದಿನಿ ಹಾಲು ಸ್ಟಾಕ್ ಇಲ್ಲ, ಬದಲಿಗೆ ಬೇರೆ ಬ್ರ್ಯಾಂಡ್ ಕಳಿಸಲೇ?', b: 'ನೀವು ಕೇಳಿದ ನಂದಿನಿ ಹಾಲು ಸದ್ಯಕ್ಕೆ ಲಭ್ಯವಿಲ್ಲ, ಅದರ ಜಾಗದಲ್ಲಿ ಇನ್ನೊಂದು ಕಂಪನಿಯದು ಕೊಡಬಹುದಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ನಂಬರ್ ಪೋರ್ಟ್ ವಿನಂತಿ ತಿರಸ್ಕೃತವಾಗಿದೆ, ಏಕೆಂದರೆ ₹340 ಬಾಕಿ ಇದೆ.', b: '₹340 ಬಾಕಿ ಬಿಲ್ ಉಳಿದಿರುವ ಕಾರಣ, ನಂಬರ್ ಪೋರ್ಟ್ ಮಾಡುವ ನಿಮ್ಮ ರಿಕ್ವೆಸ್ಟ್ ರಿಜೆಕ್ಟ್ ಆಗಿದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಪಾರ್ಸಲ್ ಬೆಳಿಗ್ಗೆ 10 ಕ್ಕೆ ತಲುಪಿತು!, b: ಬೆಳಿಗ್ಗೆ 10 ಗಂಟೆಗೆ ನಿಮ್ಮ ಪ್ಯಾಕೇಜ್ ಡೆಲಿವರ್ ಆಗಿಬಿಟ್ಟಿದೆ!, label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಪ್ರದೇಶದಲ್ಲಿ ಟವರ್ ನಿರ್ವಹಣೆ ಕೆಲಸ ನಡೆಯುತ್ತಿದೆ, ಸಂಜೆ 6 ರೊಳಗೆ ನೆಟ್‌ವರ್ಕ್ ವಾಪಸ್ ಬರುತ್ತದೆ.', b: 'ನಿಮ್ಮ ಏರಿಯಾದ ಟವರ್‌ನಲ್ಲಿ ಮೇಂಟೆನೆನ್ಸ್ ನಡೆಯುತ್ತಿದೆ, ಸಂಜೆ 6 ಗಂಟೆಗೆ ಮುಂಚೆ ಸಿಗ್ನಲ್ ಸರಿಯಾಗುತ್ತದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಪ್ರಶ್ನೆಗೆ ಇಮೇಲ್ ಮೂಲಕ 48 ಗಂಟೆಗಳಲ್ಲಿ ಉತ್ತರ ನೀಡುತ್ತೇವೆ., b: 48 ಗಂಟೆಗಳ ಒಳಗೆ ನಿಮ್ಮ ಪ್ರಶ್ನೆಯ ಉತ್ತರವನ್ನು ಮೇಲ್‌ನಲ್ಲಿ ಕಳುಹಿಸಲಾಗುವುದು., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಫಿಕ್ಸೆಡ್ ಡೆಪಾಸಿಟ್ ಮಾರ್ಚ್ 31 ರಂದು ಮೆಚ್ಯೂರ್ ಆದ, ನಂತರ ಸ್ವಯಂಚಾಲಿತವಾಗಿ ನವೀಕರಣಗೊಳ್ಳುತ್ತದೆ.', b: 'ಮಾರ್ಚ್ 31 ಕ್ಕೆ ಮೆಚ್ಯೂರಿಟಿ ಮುಗಿದ ಮೇಲೆ, ನಿಮ್ಮ ಎಫ್‌ಡಿ ತಾನಾಗಿಯೇ ರಿನ್ಯೂ ಆಗುತ್ತದೆ.', label: paraphrase, request: paraphrase, stored: punct_inner}
- {lang: kn, a: ನಿಮ್ಮ ಫೈಬರ್ ಸಂಪರ್ಕದ ವೇಗವನ್ನು 100 ಎಂಬಿಪಿಎಸ್‌ಗೆ ಏರಿಸಲಾಗಿದೆ., b: ನಾವು ಅಪ್‌ಗ್ರೇಡ್ ಮಾಡಿದ್ದರಿಂದ ಈಗಿನಿಂದ ನಿಮ್ಮ ಫೈಬರ್ ಇಂಟರ್ನೆಟ್ 100 ಎಂಬಿಪಿಎಸ್ ಸ್ಪೀಡ್‌ನಲ್ಲಿ ಓಡುತ್ತದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಮಗನ ಸಿಮ್ ಅನ್ನು ನಿಮ್ಮ ಫ್ಯಾಮಿಲಿ ಪ್ಲಾನ್‌ಗೆ ಸೇರಿಸಬಹುದು, ಹೆಚ್ಚುವರಿ ₹150 ಆಗುತ್ತದೆ.', b: '₹150 ಹೆಚ್ಚು ಕೊಟ್ಟರೆ, ನಿಮ್ಮ ಮಗನ ಸಿಮ್ ಕೂಡ ಫ್ಯಾಮಿಲಿ ಪ್ಲಾನ್‌ನ ಒಳಗೆ ಬರುತ್ತದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ಮಗಳು ದಿವ್ಯಾ ಹೆಸರಿನಲ್ಲಿ ಸುಕನ್ಯಾ ಸಮೃದ್ಧಿ ಖಾತೆ ತೆರೆಯಲು ಜನನ ಪ್ರಮಾಣಪತ್ರ ಬೇಕು., b: 'ದಿವ್ಯಾಗಾಗಿ ಸುಕನ್ಯಾ ಸಮೃದ್ಧಿ ಅಕೌಂಟ್ ಮಾಡಿಸಲು, ನೀವು ಮಗಳ ಬರ್ತ್ ಸರ್ಟಿಫಿಕೇಟ್ ತರಬೇಕು.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಮನೆ ನಂಬರ್ 214 ಹತ್ತಿರ ಯಾವುದಾದರೂ ಹೆಗ್ಗುರುತು ಇದೆಯೇ?', b: 'ಮನೆ ಸಂಖ್ಯೆ 214 ಅನ್ನು ಸುಲಭವಾಗಿ ಹುಡುಕಲು ಹತ್ತಿರದಲ್ಲಿ ಯಾವುದಾದರೂ ಲ್ಯಾಂಡ್‌ಮಾರ್ಕ್ ಹೇಳಬಹುದಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಮನೆಯ ಪಿನ್ ಕೋಡ್ 560034 ಸರಿಯೇ?', b: 'ನಿಮ್ಮ ವಿಳಾಸದ ಪಿನ್ ಕೋಡ್ 560034 ಎಂದು ನಾನು ಸರಿಯಾಗಿ ಬರೆದುಕೊಂಡಿದ್ದೇನಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಮನೆಯ ಫೈಬರ್ ಕೇಬಲ್ ಕತ್ತರಿಸಿ ಹೋಗಿದೆ, ತಂತ್ರಜ್ಞ ಹರ್ಷ ಅವರನ್ನು ಕಳುಹಿಸುತ್ತಿದ್ದೇವೆ.', b: 'ನಿಮ್ಮ ಮನೆಯ ಫೈಬರ್ ವೈರ್ ಕಟ್ ಆಗಿದೆ, ಅದನ್ನು ರಿಪೇರಿ ಮಾಡಲು ಹರ್ಷ ಎಂಬ ಟೆಕ್ನಿಷಿಯನ್ ಬರುತ್ತಾರೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ರೇಟಿಂಗ್ ನಮ್ಮ ಡೆಲಿವರಿ ಪಾಲುದಾರರಿಗೆ ತುಂಬಾ ಮುಖ್ಯ, 5 ಸ್ಟಾರ್ ಕೊಡುತ್ತೀರಾ?', b: 'ನೀವು ಕೊಡುವ ರೇಟಿಂಗ್ ನಮ್ಮ ಡೆಲಿವರಿ ಪಾರ್ಟ್‌ನರ್‌ಗಳಿಗೆ ಬಹಳ ಮಹತ್ವದ್ದು, ದಯವಿಟ್ಟು 5 ಸ್ಟಾರ್ ನೀಡುವಿರಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಲಾಕರ್‌ನ ವಾರ್ಷಿಕ ಬಾಡಿಗೆ ₹3,000 ಬಾಕಿ ಇದೆ.', b: 'ಲಾಕರ್‌ಗೆ ಕಟ್ಟಬೇಕಾದ ಈ ವರ್ಷದ ₹3,000 ಬಾಡಿಗೆ ಇನ್ನೂ ಪಾವತಿ ಆಗಬೇಕಿದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಲ್ಯಾಂಡ್‌ಲೈನ್ ದುರಸ್ತಿ ದೂರು ಸಂಖ್ಯೆ 31877, ದಯವಿಟ್ಟು ಬರೆದುಕೊಳ್ಳಿ.', b: 'ಲ್ಯಾಂಡ್‌ಲೈನ್ ರಿಪೇರಿಗಾಗಿ ನೀವು ಕೊಟ್ಟ ಕಂಪ್ಲೇಂಟ್‌ನ ನಂಬರ್ 31877, ಇದನ್ನು ನೋಟ್ ಮಾಡಿಟ್ಟುಕೊಳ್ಳಿ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ವಕೀಲರಾದ ಶ್ರೀಮತಿ ಜ್ಯೋತಿ ಅವರೊಂದಿಗಿನ ಭೇಟಿ ಶುಕ್ರವಾರ ಸಂಜೆಗೆ ಬದಲಾಗಿದೆ., b: ಶ್ರೀಮತಿ ಜ್ಯೋತಿ ಎಂಬ ನಿಮ್ಮ ಲಾಯರ್ ಜೊತೆಗಿನ ಮೀಟಿಂಗ್ ಅನ್ನು ಶುಕ್ರವಾರ ಸಂಜೆಗೆ ಶಿಫ್ಟ್ ಮಾಡಲಾಗಿದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನಿಮ್ಮ ವಾರಂಟಿ ಡಿಸೆಂಬರ್ 2027 ರವರೆಗೆ ಮಾನ್ಯವಾಗಿದೆ., b: ಡಿಸೆಂಬರ್ 2027 ತನಕ ನಿಮ್ಮ ಪ್ರಾಡಕ್ಟ್‌ಗೆ ವಾರಂಟಿ ಕವರೇಜ್ ಇರುತ್ತದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನಿಮ್ಮ ಸ್ಟಾರ್ ಹೆಲ್ತ್ ವಿಮೆಯಲ್ಲಿ ಕ್ಯಾಶ್‌ಲೆಸ್ ಸೌಲಭ್ಯ ಇದೆಯೇ?', b: 'ಸ್ಟಾರ್ ಹೆಲ್ತ್ ಇನ್ಶೂರೆನ್ಸ್ ಮೂಲಕ ನೀವು ಕ್ಯಾಶ್‌ಲೆಸ್ ಚಿಕಿತ್ಸೆ ಪಡೆಯಲು ಅವಕಾಶ ಇದೆಯಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನೀವು 3 ಕ್ಕಿಂತ ಹೆಚ್ಚು ಸಲ ತಪ್ಪು ಪಾಸ್‌ವರ್ಡ್ ಹಾಕಿದಿರಾ?', b: 'ತಪ್ಪಾದ ಪಾಸ್‌ವರ್ಡ್ ಅನ್ನು 3 ಕ್ಕಿಂತ ಅಧಿಕ ಬಾರಿ ಎಂಟರ್ ಮಾಡಿದ್ದೀರಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನೀವು ಕರೆ ಮಾಡುತ್ತಿರುವ ಸಂಖ್ಯೆ 9845012345 ನಿಮ್ಮ ಹೆಸರಿನಲ್ಲಿ ನೋಂದಾಯಿತವಾಗಿದೆಯೇ?', b: 'ಈಗ ನೀವು ಬಳಸುತ್ತಿರುವ 9845012345 ನಂಬರ್ ನಿಮ್ಮದೇ ಹೆಸರಿನಲ್ಲಿ ರಿಜಿಸ್ಟರ್ ಆಗಿದೆಯಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನೀವು ಕೊನೆಯ ಬಾರಿ ಅಕ್ಟೋಬರ್ 2 ರಂದು ರೀಚಾರ್ಜ್ ಮಾಡಿದ್ದೀರಿ., b: ನಿಮ್ಮ ಹಿಂದಿನ ರೀಚಾರ್ಜ್ ಅಕ್ಟೋಬರ್ 2 ರಂದು ಆಗಿತ್ತು ಎಂದು ದಾಖಲೆ ತೋರಿಸುತ್ತಿದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನೀವು ಡಾಕ್ಟರ್ ಮೋಹನ್ ಅವರ ಕ್ಲಿನಿಕ್‌ಗೆ ಮೊದಲ ಬಾರಿ ಬರುತ್ತಿದ್ದೀರಾ?', b: 'ಡಾಕ್ಟರ್ ಮೋಹನ್ ಅವರನ್ನು ಕಾಣಲು ಇದು ನಿಮ್ಮ ಮೊದಲನೇ ಭೇಟಿಯಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನೀವು ಶನಿವಾರ ಜಯನಗರದ ಎಟಿಎಂನಿಂದ ಹಣ ತೆಗೆದಿದ್ದೀರಾ?', b: 'ಶನಿವಾರದಂದು ಜಯನಗರದಲ್ಲಿರುವ ಎಟಿಎಂನಲ್ಲಿ ನೀವು ಕ್ಯಾಶ್ ವಿತ್‌ಡ್ರಾ ಮಾಡಿದ್ದೀರಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನೀವು ಸ್ಯಾಮ್‌ಸಂಗ್ ಫೋನ್‌ನಲ್ಲಿ ನಮ್ಮ ಆ್ಯಪ್ ಬಳಸುತ್ತಿದ್ದೀರಾ?', b: 'ನಮ್ಮ ಆ್ಯಪ್ ಅನ್ನು ನೀವು ಓಪನ್ ಮಾಡುತ್ತಿರುವುದು ಸ್ಯಾಮ್‌ಸಂಗ್ ಮೊಬೈಲ್‌ನಲ್ಲಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ನೆಟ್‌ವರ್ಕ್ ತೊಂದರೆಗೆ ಪರಿಹಾರವಾಗಿ ನಿಮ್ಮ ಸಂಖ್ಯೆಗೆ 5 ಜಿಬಿ ಉಚಿತ ಡೇಟಾ ನೀಡಿದ್ದೇವೆ., b: 'ಸಿಗ್ನಲ್ ಸಮಸ್ಯೆಗೆ ಕ್ಷಮೆಯಾಚನೆಯಾಗಿ, ನಿಮ್ಮ ನಂಬರ್‌ಗೆ 5 ಜಿಬಿ ಫ್ರೀ ಇಂಟರ್ನೆಟ್ ಸೇರಿಸಲಾಗಿದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ನೇಹಾ ಅವರೇ, ನಿಮ್ಮ ಅಭಿಪ್ರಾಯ ನಮಗೆ ತುಂಬಾ ಅಮೂಲ್ಯ!', b: 'ನೇಹಾ ಅವರೇ, ನೀವು ಕೊಟ್ಟ ಫೀಡ್‌ಬ್ಯಾಕ್‌ಗೆ ನಾವು ಬಹಳ ಬೆಲೆ ಕೊಡುತ್ತೇವೆ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಪಾರ್ಸಲ್ ಈಗ ಕೇವಲ 3 ಕಿಲೋಮೀಟರ್ ದೂರದಲ್ಲಿರುವುದರಿಂದ, ವಿಳಾಸ ಬದಲಾಯಿಸಲು ತಡವಾಗಿದೆ.', b: 'ಪ್ಯಾಕೇಜ್ 3 ಕಿಲೋಮೀಟರ್ ಅಂತರಕ್ಕೆ ಬಂದುಬಿಟ್ಟಿದೆ, ಹಾಗಾಗಿ ಅಡ್ರೆಸ್ ಚೇಂಜ್ ಮಾಡುವ ಸಮಯ ಮೀರಿದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಪಾಸ್‌ಪೋರ್ಟ್ ಸೇವಾ ಕೇಂದ್ರದಲ್ಲಿ ನಿಮ್ಮ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ಸಂಖ್ಯೆ 4482 ಆಗಿದೆ., b: ಪಾಸ್‌ಪೋರ್ಟ್ ಆಫೀಸ್‌ನಲ್ಲಿ ನಿಮ್ಮ ಭೇಟಿಗೆ ನೀಡಲಾಗಿರುವ ನಂಬರ್ 4482., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಪಾಸ್‌ಬುಕ್ ಪ್ರಿಂಟ್ ಮಾಡಿಸಲು ಶಾಖೆಯ ಕೌಂಟರ್ ನಂಬರ್ 3 ಗೆ ಹೋಗಿ., b: ನಿಮ್ಮ ಪಾಸ್‌ಬುಕ್ ಎಂಟ್ರಿ ಹಾಕಿಸಿಕೊಳ್ಳಬೇಕಾದರೆ ಬ್ರಾಂಚ್‌ನ 3 ನೇ ಕೌಂಟರ್‌ಗೆ ಭೇಟಿ ನೀಡಿ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಪಿನ್ ಕೋಡ್ 577201 ಪ್ರದೇಶಕ್ಕೆ ಸದ್ಯಕ್ಕೆ ನಾವು ಡೆಲಿವರಿ ಮಾಡುವುದಿಲ್ಲ., b: ಈ ಸಮಯದಲ್ಲಿ 577201 ಪಿನ್ ಕೋಡ್ ಏರಿಯಾಗೆ ನಮ್ಮ ಡೆಲಿವರಿ ಸೇವೆ ಲಭ್ಯವಿಲ್ಲ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಫಿಸಿಯೋಥೆರಪಿಯ 6 ಸೆಷನ್‌ಗಳ ಪ್ಯಾಕೇಜ್ ಬುಕ್ ಮಾಡಲಾಗಿದೆ., b: ನಿಮಗಾಗಿ ಒಟ್ಟು 6 ಫಿಸಿಯೋಥೆರಪಿ ಸಿಟ್ಟಿಂಗ್‌ಗಳ ಪ್ಯಾಕೇಜ್ ಅನ್ನು ಕಾಯ್ದಿರಿಸಿದ್ದೇವೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಬಳಸಿದ ವಸ್ತುಗಳಿಗೆ ಪೂರ್ಣ ಹಣ ವಾಪಸ್ ಸಿಗುವುದಿಲ್ಲ, ಆದರೆ ₹200 ಕೂಪನ್ ನೀಡಬಹುದು.', b: 'ಉಪಯೋಗಿಸಿದ ಪ್ರಾಡಕ್ಟ್‌ಗೆ ಫುಲ್ ರಿಫಂಡ್ ಸಾಧ್ಯವಿಲ್ಲ, ಬದಲಿಗೆ ನಿಮಗೆ ₹200 ಮೌಲ್ಯದ ಕೂಪನ್ ಕೊಡಬಹುದು.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಬ್ಯಾಂಕ್ ಮುಚ್ಚುವ ಮೊದಲು, ಅಂದರೆ ಸಂಜೆ 4 ಗಂಟೆಯೊಳಗೆ ಡಿಡಿ ಕೌಂಟರ್‌ಗೆ ಬನ್ನಿ.', b: 'ಡಿಮ್ಯಾಂಡ್ ಡ್ರಾಫ್ಟ್‌ಗಾಗಿ ಸಂಜೆ 4 ಗಂಟೆಗೆ ಮುಂಚೆಯೇ ಕೌಂಟರ್ ತಲುಪಿ, ಆಮೇಲೆ ಬ್ಯಾಂಕ್ ಮುಚ್ಚುತ್ತದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಬ್ಯಾಂಕ್ ಸಿಬ್ಬಂದಿ ಎಂದು ಹೇಳಿಕೊಂಡು ಕರೆ ಮಾಡುವವರಿಗೆ ನಿಮ್ಮ 3 ಅಂಕಿಯ ಸಿವಿವಿ ಹೇಳಬೇಡಿ., b: ನಾವು ಬ್ಯಾಂಕ್‌ನವರು ಎಂದು ಫೋನ್ ಮಾಡುವ ಯಾರಿಗೂ ಕಾರ್ಡ್‌ನ 3 ಅಂಕಿಯ ಸಿವಿವಿ ಕೊಡಬೇಡಿ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಮಾರಾಟಗಾರರ ಬಳಿ ಸ್ಟಾಕ್ ಮುಗಿದಿರುವುದರಿಂದ, ನಿಮ್ಮ ಪ್ರೆಸ್ಟೀಜ್ ಮಿಕ್ಸರ್ ಆರ್ಡರ್ ರದ್ದಾಗಿದೆ.', b: 'ಸೆಲ್ಲರ್ ಬಳಿ ಸ್ಟಾಕ್ ಖಾಲಿಯಾದ ಕಾರಣ, ನೀವು ಬುಕ್ ಮಾಡಿದ ಪ್ರೆಸ್ಟೀಜ್ ಮಿಕ್ಸರ್ ಕ್ಯಾನ್ಸಲ್ ಆಗಿದೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ರಕ್ತ ಪರೀಕ್ಷೆಗೆ ಬರುವ ಮುನ್ನ 12 ಗಂಟೆ ಉಪವಾಸ ಇರಬೇಕು., b: ಬ್ಲಡ್ ಟೆಸ್ಟ್ ಮಾಡಿಸುವ ಮೊದಲು 12 ಗಂಟೆಗಳ ಕಾಲ ಖಾಲಿ ಹೊಟ್ಟೆಯಲ್ಲಿ ಇರಬೇಕಾಗುತ್ತದೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ರಮೇಶ್ ಅವರೇ, ಇದು ಖಂಡಿತ ನಮ್ಮದೇ ತಪ್ಪು!', b: 'ರಮೇಶ್ ಅವರೇ, ಇದರಲ್ಲಿ ತಪ್ಪು ಸಂಪೂರ್ಣವಾಗಿ ನಮ್ಮ ಕಡೆಯಿಂದಲೇ ಆಗಿದೆ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ರಿಟರ್ನ್ ಪಿಕಪ್ ನಾಳೆ ಬೆಳಿಗ್ಗೆ 9 ರಿಂದ 12 ರ ನಡುವೆ ನಡೆಯುತ್ತದೆ., b: ನಾಳೆ ಬೆಳಿಗ್ಗೆ 9 ಗಂಟೆಯಿಂದ 12 ಗಂಟೆಯೊಳಗೆ ನಮ್ಮವರು ಬಂದು ರಿಟರ್ನ್ ಐಟಂ ತೆಗೆದುಕೊಂಡು ಹೋಗುತ್ತಾರೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ರೌಟರ್‌ನ ಹಿಂದೆ ಇರುವ ಸಣ್ಣ ರೀಸೆಟ್ ಬಟನ್ ಅನ್ನು 10 ಸೆಕೆಂಡ್ ಒತ್ತಿ ಹಿಡಿಯಿರಿ., b: ರೌಟರ್‌ನ ಹಿಂಭಾಗದಲ್ಲಿರುವ ಪುಟ್ಟ ರೀಸೆಟ್ ಬಟನ್ ಅನ್ನು 10 ಸೆಕೆಂಡುಗಳ ಕಾಲ ಪ್ರೆಸ್ ಮಾಡಿಯೇ ಇಡಿ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಶುಕ್ರವಾರ ಮಧ್ಯಾಹ್ನ ಪಾರ್ಸಲ್ ತಂದಾಗ ಮನೆಯಲ್ಲಿ ಯಾರಾದರೂ ಇರುತ್ತಾರಾ?', b: 'ಶುಕ್ರವಾರ ಮಧ್ಯಾಹ್ನದ ಡೆಲಿವರಿ ವೇಳೆ ಪ್ಯಾಕೇಜ್ ಪಡೆಯಲು ಮನೆಯಲ್ಲಿ ಯಾರಾದರೂ ಸಿಗುತ್ತಾರಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಸಂಪರ್ಕ ಕಡಿತದ ನಿಮ್ಮ ವಿನಂತಿ ಸ್ವೀಕರಿಸಿದ್ದೇವೆ, ರೌಟರ್ ಅನ್ನು 30 ನವೆಂಬರ್ ಒಳಗೆ ಹಿಂದಿರುಗಿಸಿ.', b: 'ಕನೆಕ್ಷನ್ ರದ್ದು ಮಾಡುವ ನಿಮ್ಮ ರಿಕ್ವೆಸ್ಟ್ ನಮಗೆ ಬಂದಿದೆ, 30 ನವೆಂಬರ್ ಒಳಗೆ ರೌಟರ್ ವಾಪಸ್ ಕೊಡಿ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಸೀಲ್ ಒಡೆದ ಬಾಕ್ಸ್ ಅನ್ನು ದಯವಿಟ್ಟು ಸ್ವೀಕರಿಸಬೇಡಿ, ಸಂಗೀತಾ ಅವರೇ!', b: 'ಸಂಗೀತಾ ಅವರೇ, ಪ್ಯಾಕಿಂಗ್ ಸೀಲ್ ತೆರೆದಿದ್ದರೆ ಆ ಪಾರ್ಸಲ್ ಅನ್ನು ತೆಗೆದುಕೊಳ್ಳಲೇಬೇಡಿ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ಸೆಪ್ಟೆಂಬರ್ ತಿಂಗಳ ಖಾತೆ ಸ್ಟೇಟ್‌ಮೆಂಟ್ ನಿಮ್ಮ ಇಮೇಲ್‌ಗೆ ಕಳುಹಿಸಲಾಗಿದೆ., b: ನಿಮ್ಮ ಮೇಲ್ ಐಡಿಗೆ ಸೆಪ್ಟೆಂಬರ್ ತಿಂಗಳ ಬ್ಯಾಂಕ್ ಸ್ಟೇಟ್‌ಮೆಂಟ್ ಅನ್ನು ನಾವು ಕಳಿಸಿದ್ದೇವೆ., label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಹೂಡಿಕೆ ಮಾಡುವ ಮೊದಲು ನಮ್ಮ ಸಲಹೆಗಾರ ರಾಜೀವ್ ಅವರೊಂದಿಗೆ ಮಾತನಾಡಲು ಬಯಸುವಿರಾ?', b: 'ಇನ್ವೆಸ್ಟ್ ಮಾಡುವುದಕ್ಕೆ ಮುಂಚೆ ನಮ್ಮ ಅಡ್ವೈಸರ್ ರಾಜೀವ್ ಅವರ ಜೊತೆ ಒಮ್ಮೆ ಚರ್ಚಿಸುತ್ತೀರಾ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: 'ಹೌದು ಮೀನಾ ಅವರೇ, ನೀವು ಹೇಳಿದ್ದು ನನಗೆ ಅರ್ಥವಾಯಿತು.', b: 'ಮೀನಾ ಅವರೇ, ನಿಮ್ಮ ವಿಷಯ ನನಗೆ ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಯಿತು.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ₹299 ರ ಪ್ರಿಪೇಯ್ಡ್ ಪ್ಲಾನ್‌ನಲ್ಲಿ ನಿಮಗೆ ದಿನಕ್ಕೆ 2 ಜಿಬಿ ಡೇಟಾ ಸಿಗುತ್ತದೆ., b: '₹299 ರ ಪ್ರಿಪೇಯ್ಡ್ ರೀಚಾರ್ಜ್ ಮಾಡಿದರೆ, ಪ್ರತಿದಿನ 2 ಜಿಬಿ ಇಂಟರ್ನೆಟ್ ಬಳಸಬಹುದು.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: '₹4,000 ತಪ್ಪು ಖಾತೆಗೆ ಹೋಗಿದ್ದರೆ, ನಾವು ಅದನ್ನು ಮರಳಿ ಪಡೆಯಲು ಪ್ರಯತ್ನಿಸುತ್ತೇವೆ.', b: 'ಆ ₹4,000 ಬೇರೆ ಯಾರದೋ ಅಕೌಂಟ್‌ಗೆ ಹೋಗಿದ್ದರೆ, ಅದನ್ನು ವಾಪಸ್ ತರಲು ನಾವು ಯತ್ನಿಸುತ್ತೇವೆ.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: '₹45,00,000 ಗೃಹ ಸಾಲದ ಪ್ರಕ್ರಿಯೆಗೆ ಮನೆಯ ಖಾತಾ ಪ್ರಮಾಣಪತ್ರದ ಪ್ರತಿ ಬೇಕು.', b: 'ನಿಮ್ಮ ₹45,00,000 ಹೋಮ್ ಲೋನ್ ಮುಂದುವರಿಸಲು, ಆಸ್ತಿಯ ಖಾತಾ ಸರ್ಟಿಫಿಕೇಟ್ ಕಾಪಿ ಕೊಡಬೇಕು.', label: paraphrase, request: paraphrase, stored: new}
- {lang: kn, a: ₹499 ಮೇಲಿನ ಆರ್ಡರ್‌ಗಳಿಗೆ ಡೆಲಿವರಿ ಉಚಿತ!, b: 'ನಿಮ್ಮ ಆರ್ಡರ್ ₹499 ದಾಟಿದರೆ, ಡೆಲಿವರಿ ಸಂಪೂರ್ಣ ಫ್ರೀ ಆಗಿರುತ್ತದೆ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഡെലിവറി ചെയ്യുന്നതിന് 10 മിനിറ്റ് മുമ്പ് ഞാൻ നിങ്ങളെ വിളിക്കട്ടെ?', b: 'ഡെലിവറി ചെയ്തതിന് 10 മിനിറ്റ് ശേഷം ഞാൻ നിങ്ങളെ വിളിക്കട്ടെ?', label: changed, request: meaning_change, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ പ്രദേശത്തെ ടവറിൽ അറ്റകുറ്റപ്പണി നടക്കുന്നതിനാൽ, രാത്രി 11 മണി വരെ സിഗ്നൽ ദുർബലമായിരിക്കും.', b: 'നിങ്ങളുടെ പ്രദേശത്തെ ടവറിൽ അറ്റകുറ്റപ്പണി നടക്കുന്നുണ്ടെങ്കിലും, രാത്രി 11 മണി വരെ സിഗ്നൽ ശക്തമായിരിക്കും.', label: changed, request: meaning_change, stored: new}
- {lang: ml, a: 'നിങ്ങളുടെ ബിൽ അടയ്ക്കാൻ ഇനി 2 ദിവസം കൂടി ബാക്കിയുണ്ട്, അതിന് ശേഷം ലേറ്റ് ഫീ ഈടാക്കും.', b: നിങ്ങളുടെ വാഷിംഗ് മെഷീന് പകരം പുതിയ ഒന്ന് 2 ആഴ്ചയ്ക്കുള്ളിൽ നൽകും., label: changed, request: new, stored: slot_change}
- {lang: ml, a: നിങ്ങളുടെ വാഷിംഗ് മെഷീന് പകരം പുതിയ ഒന്ന് 3 ആഴ്ചയ്ക്കുള്ളിൽ നൽകും., b: 'നിങ്ങളുടെ ബിൽ അടയ്ക്കാൻ ഇനി 3 ദിവസം കൂടി ബാക്കിയുണ്ട്, അതിന് ശേഷം ലേറ്റ് ഫീ ഈടാക്കും.', label: changed, request: new, stored: slot_change}
- {lang: ml, a: 'നിങ്ങൾ ആവശ്യപ്പെട്ട സമയം ഒഴിവുണ്ട്, പകരം രാവിലെ 9 മണിക്കോ വൈകുന്നേരം 5 മണിക്കോ ബുക്ക് ചെയ്യേണ്ട.', b: 'നിങ്ങൾ ചോദിച്ച സ്ലോട്ട് ബുക്ക്ഡ് ആണ്, അതിന് പകരം രാവിലെ 9 മണിയോ വൈകുന്നേരം 5 മണിയോ തരാം.', label: changed, request: paraphrase, stored: meaning_change}
- {lang: ml, a: 'നിങ്ങൾ പോസ്റ്റ്പെയ്ഡിൽ നിന്ന് പ്രീപെയ്ഡിലേക്ക് മാറാൻ ആഗ്രഹിക്കുന്നത് മാർച്ച് മുതലാണോ?', b: 'നിങ്ങൾ പ്രീപെയ്ഡിൽ നിന്ന് പോസ്റ്റ്പെയ്ഡിലേക്ക് മാറാൻ ആഗ്രഹിക്കുന്നത് മാർച്ച് മുതലാണോ?', label: changed, request: meaning_change, stored: new}
- {lang: ml, a: 'മികച്ചത്, നിങ്ങളുടെ ഷുഗർ ലെവൽ 110 ആയി കുറഞ്ഞു!', b: 'മികച്ചതല്ല, നിങ്ങളുടെ ഷുഗർ ലെവൽ 110 ആയി കൂടി!', label: changed, request: meaning_change, stored: new}
- {lang: ml, a: ഷോപ്പ്മാർട്ട് കസ്റ്റമർ കെയറിൽ ഇപ്പോൾ ഹിന്ദിയിലും സഹായം ലഭ്യമാണ്., b: ഷോപ്പ്മാർട്ട് കസ്റ്റമർ കെയറിൽ ഇപ്പോൾ ഹിന്ദിയിൽ സഹായം ലഭ്യമല്ല., label: changed, request: meaning_change, stored: new}
- {lang: ml, a: 'സുമ എന്ന നിങ്ങളുടെ ഭാര്യയെയാണോ നോമിനി ആക്കേണ്ടത്?', b: 'നോമിനിയിൽ നിന്ന് നീക്കം ചെയ്യേണ്ടത് നിങ്ങളുടെ ഭാര്യ സുമയെ ആണോ?', label: changed, request: meaning_change, stored: paraphrase}
- {lang: ml, a: 'അക്കൗണ്ട് നമ്പറിന്റെ അവസാന 4 അക്കങ്ങൾ പറയാമോ?', b: 'നിങ്ങളുടെ അക്കൗണ്ട് നമ്പറിലെ ഒടുവിലത്തെ 4 ഡിജിറ്റുകൾ ഒന്ന് പറഞ്ഞു തരാമോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'അക്കൗണ്ട് സ്ഥിരീകരിക്കാൻ, ആധാറിൽ നിങ്ങളുടെ ജനനവർഷം 1986 ആണെന്ന് ഉറപ്പാണോ?', b: 'അക്കൗണ്ട് വെരിഫൈ ചെയ്യുന്നതിനായി ചോദിക്കുകയാണ്, ആധാർ പ്രകാരം നിങ്ങൾ ജനിച്ചത് 1986-ൽ ആണെന്ന് തീർച്ചയാണോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: അടുത്ത 3 മാസത്തേക്ക് ഒടിടി സബ്സ്ക്രിപ്ഷൻ സൗജന്യമായി കിട്ടും!, b: ഇനിയുള്ള 3 മാസം ഒടിടി സബ്സ്ക്രിപ്ഷന് നിങ്ങൾ ഒരു രൂപ പോലും കൊടുക്കേണ്ട!, label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: അഡ്രസ്സിൽ വീട്ടുനമ്പർ ഇല്ലാത്തതിനാൽ കൊറിയർ 17-ാം വാർഡ് ഓഫീസിൽ തിരികെ ഏൽപ്പിച്ചു., b: വിലാസത്തിൽ ഹൗസ് നമ്പർ ചേർക്കാത്തതുകൊണ്ട് കൊറിയർ 17-ാം വാർഡ് ഓഫീസിലേക്ക് തിരിച്ചു കൊടുത്തു., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'അയ്യോ, പാഴ്സൽ ഏത് സമയത്ത് എത്തിക്കുന്നതാണ് സൗകര്യം, വൈകുന്നേരം 6 മണിക്ക് ശേഷമാണോ?', b: 'നിങ്ങൾക്ക് പാഴ്സൽ കിട്ടാൻ ഇഷ്ടമുള്ള സമയം ഏതാണ്, വൈകുന്നേരം 6 മണി കഴിഞ്ഞാണോ?', label: paraphrase, request: paraphrase, stored: filler}
- {lang: ml, a: 'ആ ശരി, വീഡിയോ കൺസൾട്ടേഷനുള്ള ലിങ്ക് 15 മിനിറ്റ് മുമ്പ് നിങ്ങളുടെ ഫോണിലേക്ക് അയയ്ക്കും.', b: 'ശരി സർ, വീഡിയോ കൺസൾട്ടേഷനുള്ള ലിങ്ക് 15 മിനിറ്റ് മുമ്പ് നിങ്ങളുടെ ഫോണിലേക്ക് അയയ്ക്കും.', label: paraphrase, request: filler, stored: filler}
- {lang: ml, a: 'ആതിര എന്ന ഞാൻ, കേരള നെറ്റിന്റെ പുതിയ ഫൈബർ ഓഫറുകൾ പരിചയപ്പെടുത്താനാണ് വിളിക്കുന്നത്.', b: കേരള നെറ്റ് പുതുതായി ഇറക്കിയ ഫൈബർ ഓഫറുകളെ കുറിച്ച് നിങ്ങളോട് പറയാനാണ് ആതിര ആയ ഞാൻ ഇപ്പോൾ വിളിച്ചത്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഇത് ഹേമയുടെ പുതിയ നമ്പറാണോ?', b: 'ഹേമ ഇപ്പോൾ ഉപയോഗിക്കുന്ന പുതിയ ഫോൺ നമ്പർ ഇതാണോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: ഇന്നലെ രാത്രി 9 മണിക്ക് നിങ്ങളുടെ ഡെബിറ്റ് കാർഡ് ഉപയോഗിച്ച് ഒരു ഓൺലൈൻ പർച്ചേസ് നടന്നതായി ഞങ്ങൾ കണ്ടു., b: നിങ്ങളുടെ ഡെബിറ്റ് കാർഡിൽ നിന്ന് ഇന്നലെ രാത്രി 9 മണിയോടെ ഒരു ഓൺലൈൻ പർച്ചേസ് നടന്നത് ഞങ്ങളുടെ ശ്രദ്ധയിൽ പെട്ടു., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: ഈ ഓർഡറിലെ ഗ്ലാസ് പാത്രങ്ങൾ 6 പ്രത്യേക ബോക്സുകളിലായി പായ്ക്ക് ചെയ്തിട്ടുണ്ട്., b: ഗ്ലാസ് പാത്രങ്ങളെല്ലാം 6 വെവ്വേറെ പെട്ടികളിലാക്കിയാണ് ഞങ്ങൾ പായ്ക്ക് ചെയ്തിരിക്കുന്നത്., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഉഷ, നാളത്തെ ബുക്കിംഗ് ഉറപ്പിക്കട്ടെ?', b: 'ഉഷ, നാളേക്കുള്ള അപ്പോയിന്റ്മെന്റ് ഞാൻ കൺഫേം ചെയ്യട്ടേ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഉൽപ്പന്നത്തിന്റെ പിന്നിലുള്ള സീരിയൽ നമ്പർ 7 എന്ന അക്കത്തിലാണോ തുടങ്ങുന്നത്?', b: 'പുറകുവശത്ത് കാണുന്ന സീരിയൽ നമ്പറിന്റെ ആദ്യത്തെ അക്കം 7 ആണോ?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: എക്സ്പ്രസ് ഡെലിവറി തിരഞ്ഞെടുത്താൽ ₹40 അധികം നൽകണം., b: എക്സ്പ്രസ് ഷിപ്പിംഗ് വേണമെങ്കിൽ ₹40 എക്സ്ട്രാ ചാർജ് വരും., label: paraphrase, request: paraphrase, stored: new}
- {lang: ml, a: 'ഒക്ടോബർ 14-ന് കിട്ടിയ ബോക്സിന്റെ സീൽ പൊട്ടിയിരുന്നോ?', b: 'ഒക്ടോബർ 14-ന് നിങ്ങൾക്ക് ലഭിച്ച പെട്ടിയുടെ സീൽ നേരത്തെ തന്നെ തുറന്ന നിലയിലായിരുന്നോ?', label: paraphrase, request: paraphrase, stored: new}
