- {lang: bn, a: 'যোগাযোগের জন্য আপনার আর একটা নম্বর দিতে পারবেন, যেটায় দিনের বেলা সহজে পাওয়া যায়?', b: 'দিনের বেলা আপনাকে ধরা যায় এমন কোনো বিকল্প ফোন নম্বর কি আমাদের জানাতে পারবেন?', label: paraphrase, request: paraphrase, stored: new}
