- {lang: te, a: 'రమేష్ గారు, క్షమించండి, మీ పార్సెల్ పొరపాటున వేరే ఊరికి వెళ్ళింది!', b: 'రమేష్ గారు, మా తప్పు వల్ల మీ ప్యాకేజీ మరో పట్టణానికి చేరింది, మన్నించండి!', label: paraphrase, request: paraphrase, stored: new}
