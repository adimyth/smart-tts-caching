- {lang: ta, a: 'இன்னைக்கு எங்களோட பேசினதுக்கு நன்றி, உங்க கேஸ் பத்தி 48 மணி நேரத்துல அப்டேட் அனுப்பறோம்.', b: 'அடுத்த 48 மணி நேரத்துக்குள்ள உங்க கேஸோட நிலையை தெரிவிக்கிறோம், இன்னைக்கு கால் பண்ணதுக்கு நன்றி.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க ஃபிக்ஸட் டெபாசிட் ஏப்ரல் 12 அன்னைக்கு மெச்சூர் ஆகும்., b: ஏப்ரல் 12 அன்னைக்கு உங்க வைப்பு நிதியோட காலம் முடிஞ்சு பணம் கைக்கு வரும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க அப்பா பேர்ல இருக்கற பென்ஷன் அக்கவுண்ட்டுக்கு லைஃப் சர்டிஃபிகேட் நவம்பர் 30 க்குள்ள கொடுக்கணும்., b: நவம்பர் 30 தேதிக்கு முன்னாடி உங்க அப்பாவோட ஓய்வூதிய கணக்குக்கு உயிர் வாழ் சான்றிதழ் சமர்ப்பிக்கணும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க ஆட்டோ டெபிட் மேண்டேட் ஜூன் மாசத்துல இருந்து கேன்சல் ஆகிடும்., b: ஜூன் மாசத்துல இருந்து உங்க தானியங்கி பணம் பிடித்தம் நிறுத்தப்படும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க ஆர்டர் 48213 ஷிப் ஆகிடுச்சு, வெள்ளிக்கிழமைக்குள் வந்துடும்.', b: 'நாங்க உங்க 48213 ஆர்டரை அனுப்பிட்டோம், வெள்ளிக்கிழமை முடியறதுக்குள்ள அது உங்க கைக்கு வரும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க ஆர்டர்ல இருந்த 3 பொருள்ல ஒண்ணு மட்டும் இன்னைக்கு வரும்., b: நீங்க ஆர்டர் செஞ்ச 3 சாமான்கள்ல ஒரே ஒரு சாமான் தான் இன்னைக்கு கைக்கு வரும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க இசிம் க்யூஆர் கோட் உங்க இமெயிலுக்கு 15 நிமிஷத்துல வரும்., b: இசிம் செட்டப் பண்றதுக்கான க்யூஆர் கோட் 15 நிமிஷத்துக்குள்ள உங்க மெயில் இன்பாக்ஸ்ல இருக்கும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க ஏரியாவுக்கு ஃப்ரிட்ஜ் மாதிரி பெரிய பொருட்களை டெலிவரி பண்ண 3 நாள் கூடுதலா ஆகும், அது பரவாயில்லையா?', b: 'ஃப்ரிட்ஜ் போன்ற பெரிய சாமான்களை உங்க பகுதிக்கு கொண்டு வர இன்னும் 3 நாள் அதிகமாகும், உங்களுக்கு அது ஏற்புடையதா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க கார் சர்வீஸுக்கு மொத்தம் ₹4,850 ஆகும், அதுல ஆயில் மாத்தறதும் சேர்ந்திருக்கு.', b: '₹4,850 என்ற மொத்த சர்வீஸ் கட்டணத்துல ஆயில் மாற்றும் செலவும் அடங்கியிருக்கு.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க கார்டு நேத்து ராத்திரி 9 மணிக்கு அப்புறம் தான் காணாம போச்சா?', b: 'நேத்து ராத்திரி 9 மணிக்கு பிறகுதான் உங்க கார்டை தொலைச்சீங்களா, சார்?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க கார்டுல இருந்து வெளிநாட்டுல ஒரு ₹9,870 பேமெண்ட் போயிருக்கு, அது நீங்க பண்ணதா?', b: 'வெளிநாட்டு வியாபாரி ஒருத்தருக்கு உங்க கார்டு மூலமா ₹9,870 செலுத்தப்பட்டிருக்கு, அதை நீங்கதான் செஞ்சீங்களா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க குழந்தைக்கு தடுப்பூசி போட்டு 6 வாரம் ஆச்சா?', b: 'குழந்தைக்கு கடைசியா ஊசி போட்டதுல இருந்து 6 வாரம் கடந்துடுச்சா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க கேஸ் ஐடி 90417., b: 'சரிங்க சார், உங்க கேஸ் ஐடி 90417.', label: paraphrase, request: filler, stored: new}
- {lang: ta, a: 'உங்க கோல்டு லோனை நவம்பர் 15 தேதிக்கு முன்னாடி ரினியூ பண்ண விரும்பறீங்களா?', b: 'நவம்பர் 15 தேதி வர்றதுக்குள்ள உங்க நகைக்கடனை புதுப்பிக்க ஆசைப்படறீங்களா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க சிம் கார்டை பிளாக் பண்ணிட்டோம், யாரும் அதை தவறா பயன்படுத்த முடியாது, விக்னேஷ் சார்.', b: 'விக்னேஷ் சார், உங்க சிம்மை முடக்கிட்டதால, இனி வேற யாரும் அதை தப்பா யூஸ் பண்ண வழியில்லை.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க செக்புக் அனுப்பியாச்சு, ஜெயா மேடம்.', b: 'ஜெயா மேடம், புது காசோலை புத்தகம் உங்க முகவரிக்கு போய்க்கிட்டு இருக்கு.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க ஜாயிண்ட் அக்கவுண்ட்ல இருக்கற இன்னொரு பேர் சுந்தர் தானே?', b: 'இந்த கூட்டுக் கணக்குல உங்களோட சேர்ந்து இருக்கறவர் சுந்தர் தானா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க டாக்டைம் பேலன்ஸ் ₹12., b: உங்க கணக்குல மீதி இருக்கற பேச்சு நேரத் தொகை ₹12., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க டிக்கெட் நம்பர் 58214 தானா?', b: 'நீங்க சொன்ன டிக்கெட் எண் 58214 தானே, சரியா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க டெலிவரி ஓடிபி 4471, அதை டெலிவரி பையன் கிட்ட மட்டும் சொல்லுங்க.', b: பொருள் கொடுக்க வர்றவர் கிட்ட மட்டும் 4471 என்ற ஓடிபியை பகிர்ந்துக்கோங்க., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க நம்பரை போர்ட் பண்ண யுபிசி கோட் 7 நாள் தான் செல்லுபடியாகும்., b: 'நம்பர் மாற்றத்துக்கான யுபிசி கோட்டை 7 நாளுக்குள்ள பயன்படுத்தணும், அதுக்கு அப்புறம் அது காலாவதியாகிடும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க நெட்வொர்க் பிரச்சனை சரியாகிடுச்சுன்னு நினைக்கிறேன், வேற ஏதாவது இருந்தா 198 க்கு கூப்பிடுங்க.', b: 'இப்போ உங்க நெட்வொர்க் சிக்கல் தீர்ந்திருக்கும்னு நம்பறேன், இன்னும் ஏதாவது தேவைன்னா 198 எண்ணுக்கு அழையுங்க.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க பக்கத்து வீட்டு நாய் ரொம்ப குரைக்குது, அதனால எங்க ஆள் கேட் வெளியிலயே நிப்பார், கணேஷ் சார்.', b: 'கணேஷ் சார், பக்கத்து வீட்டு நாய் சத்தமா குரைக்கறதால, எங்க டெலிவரி ஆள் கேட்டுக்கு வெளியில காத்திருப்பார்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க பயணம் 12 நாள்னா, மாசாந்திர ரோமிங் பேக்கை விட தினசரி பேக் லாபமா இருக்கும்.', b: 'நீங்க 12 நாள் தான் வெளிநாட்டுல இருக்கப் போறீங்கன்னா, மாச பேக்கை விட நாள் கணக்கு பேக் தான் உங்களுக்கு மலிவா இருக்கும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க பல் சிகிச்சைக்கு மொத்தம் 3 சிட்டிங் தேவைப்படும், ஒவ்வொரு சிட்டிங்குக்கும் இடையில ஒரு வாரம் இடைவெளி இருக்கும்.', b: 'பல் சிகிச்சையை 3 அமர்வுகள்ல முடிப்போம், ஒவ்வொண்ணுக்கும் நடுவுல ஒரு வார இடைவெளி விடுவோம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க பழைய புகார் 31207 ஏற்கனவே மூடப்பட்டுடுச்சு., b: 31207 என்ற உங்க முந்தைய புகாரை நாங்க ஏற்கனவே முடிச்சு வச்சுட்டோம்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க பழைய போன்ல இருந்த 2,300 போட்டோக்களும் புது போனுக்கு மாறிடுச்சு!', b: 'பழைய மொபைல்ல இருந்த 2,300 புகைப்படங்களையும் உங்க புது மொபைலுக்கு காப்பி பண்ணிட்டோம்!', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க பிரச்சனைக்கு ஒரு டெக்னீஷியனை சனிக்கிழமை அனுப்பட்டுமா?', b: 'சனிக்கிழமை அன்னைக்கு ஒரு டெக்னீஷியன் வந்து இதை சரிபார்க்க ஏற்பாடு பண்ணட்டுமா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க பிராட்பேண்ட் ஸ்பீடை 100 எம்பிபிஎஸ்ஸில இருந்து 300 எம்பிபிஎஸ்ஸுக்கு அப்கிரேட் பண்ணலாமா?', b: 'இப்போ இருக்கற 100 எம்பிபிஎஸ் வேகத்தை 300 எம்பிபிஎஸ்ஸா உயர்த்த உங்களுக்கு விருப்பமா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க பிறந்த தேதி 23 ஜனவரி தானே?', b: 'நீங்க பிறந்தது 23 ஜனவரி அன்னைக்கு தானே, சரிதானா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க பில் சைக்கிள் 21 ஆம் தேதி ஆரம்பிக்குது., b: ஒவ்வொரு மாசமும் 21 ஆம் தேதியில இருந்து உங்க பில்லிங் காலம் தொடங்குது., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க பிளான்ல இருக்கற 75 ஜிபி டேட்டா தீர்ந்த பிறகு, ஸ்பீட் 64 கேபிபிஎஸ்ஸா குறைஞ்சுடும், ஆனா கனெக்ஷன் கட் ஆகாது.', b: '75 ஜிபி டேட்டாவை முழுசா பயன்படுத்தின பிறகு உங்க வேகம் 64 கேபிபிஎஸ் அளவுக்கு இறங்கும், இருந்தாலும் இணைப்பு துண்டிக்கப்படாது.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க பேர்ல ரெண்டு ப்ரொஃபைல் இருந்துச்சு, அதை ஒண்ணா இணைச்சுட்டேன், இப்போ மொத்தம் 1,250 ரிவார்ட் பாயிண்ட்ஸ் ஒரே இடத்துல தெரியும்.', b: 'உங்க பேர்ல இருந்த ரெண்டு கணக்குகளையும் நான் ஒன்றாக்கிட்டேன், அதனால 1,250 ரிவார்ட் பாயிண்ட்ஸையும் இப்போ ஒரே ப்ரொஃபைல்ல பார்க்கலாம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க ப்ரீபெய்ட் பிளான் ₹349, அது 28 நாள் வேலிடிட்டி கொடுக்கும்.', b: ₹349 ரீசார்ஜ் பண்ணா உங்களுக்கு 28 நாள் செல்லுபடி காலம் கிடைக்கும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க ரிட்டர்ன் பார்சல் எங்க வேர்ஹவுஸுக்கு 19 ஆம் தேதி வந்து சேர்ந்துடுச்சு., b: நீங்க திருப்பி அனுப்பின பொருள் 19 ஆம் தேதி எங்க கிடங்குல பெறப்பட்டது., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க ரிட்டர்ன் பிக்கப் நாளைக்கு மதியம் 2 மணிக்கு ஷெட்யூல் ஆகியிருக்கு., b: நாளைக்கு மதியம் 2 மணிக்கு எங்க ஆள் வந்து ரிட்டர்ன் பொருளை எடுத்துட்டு போவாங்க., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க ரெண்டாவது பொருள் தனி பார்சலா வருது, அதோட ட்ராக்கிங் நம்பர் 70341.', b: 'இன்னொரு பொருளை வேற பெட்டியில அனுப்பறோம், அதை 70341 என்ற எண்ணை வச்சு ட்ராக் பண்ணலாம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க வயசு 45 தானே, சார்?', b: 'சார், நீங்க 45 வயசுக்காரர் தானா, கொஞ்சம் சொல்லுங்க?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க வாரண்டி மார்ச் 2027 வரைக்கும் செல்லுபடியாகும்., b: மார்ச் 2027 வரை உங்க பொருளுக்கு வாரண்டி கவரேஜ் இருக்கும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க விசா இன்டர்வியூ அப்பாயிண்ட்மெண்ட் கன்ஃபர்ம் ஆகிடுச்சு, அன்னைக்கு காலை 8 மணிக்கே ஒரிஜினல் பாஸ்போர்ட்டோட வந்துடுங்க.', b: 'விசா நேர்காணலுக்கான உங்க நேரம் உறுதியாகிடுச்சு, அந்த நாள் காலை 8 மணிக்கே அசல் பாஸ்போர்ட்டை எடுத்துக்கிட்டு வாங்க.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: உங்க வீட்டு பிராட்பேண்ட் கனெக்ஷனுக்கு டெக்னீஷியன் பாலு நாளைக்கு மதியம் வந்து ரவுட்டரை மாத்துவார்., b: நாளை மதியம் பாலு என்ற எங்க டெக்னீஷியன் உங்க வீட்டுக்கு வந்து பழைய ரவுட்டருக்கு பதிலா புதுசு பொருத்துவார்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க வீட்டு லோனுக்கு வட்டி விகிதம் 8 சதவீதத்துல இருந்து குறைஞ்சிருக்கு, அதனால இஎம்ஐ கொஞ்சம் கம்மியாகும்.', b: 'ஹோம் லோன் வட்டி 8 சதவீதத்துக்கு கீழ இறங்கியிருக்கறதால, உங்க மாதத் தவணை சற்று குறையும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க ஸ்பா புக்கிங்குக்கு ₹500 அட்வான்ஸ் இப்போவே கட்ட முடியுமா?', b: 'ஸ்பா நேரத்தை உறுதி செய்ய இப்போவே ₹500 முன்பணம் செலுத்த உங்களால முடியுமா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க ஸ்லாட் புக் ஆகிடுச்சு, தீபா மேடம், அப்புறம் பார்க்கலாம்!', b: 'தீபா மேடம், உங்களுக்கான நேரம் ஒதுக்கப்பட்டாச்சு, நேர்ல சந்திப்போம்!', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்க ஹோம் லோன் இஎம்ஐ ₹18,600, அது ஒவ்வொரு மாசமும் 5 ஆம் தேதி கட் ஆகும்.', b: 'மாசா மாசம் 5 ஆம் தேதி உங்க அக்கவுண்ட்ல இருந்து ₹18,600 ஹோம் லோன் தவணையா பிடிக்கப்படும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'உங்களுக்கு ஏதாவது மருந்து அலர்ஜி இருக்கா, கண்ணன் சார்?', b: 'கண்ணன் சார், ஏதாவது மாத்திரை சாப்பிட்டா உங்களுக்கு ஒவ்வாமை வருமா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'எங்க இன்ஜினியர் ரிமோட்டா உங்க கம்ப்யூட்டரை கனெக்ட் பண்ண, ஸ்கிரீன்ல வர்ற 9 இலக்க ஐடியை படிச்சு சொல்லுங்க.', b: 'உங்க கம்ப்யூட்டரை எங்க இன்ஜினியர் தூரத்துல இருந்தே இயக்க, திரையில தெரியற 9 இலக்க ஐடியை எனக்கு வாசிச்சு காட்டுங்க.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'எங்க டெலிவரி பார்ட்னர் உங்க வீட்டுக்கு 2 தடவை வந்தும் யாரும் இல்லாததால, பார்சல் இப்போ பக்கத்து ஹப்ல இருக்கு.', b: 'எங்க ஆள் 2 முறை வந்தப்போவும் வீட்டுல ஆள் இல்லாததால, உங்க பொருளை அருகிலுள்ள மையத்துல வச்சிருக்கோம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'ஏடிஎம்ல பணம் வராம அக்கவுண்ட்ல ₹4,000 கட் ஆகியிருந்தா, அது 5 நாள்ல தானா திரும்ப வந்துடும்.', b: 'ஏடிஎம் பணம் கொடுக்காமலேயே ₹4,000 பிடிச்சிருந்தா, அந்த தொகை 5 நாளுக்குள்ள தானாகவே உங்க கணக்குக்கு திரும்பிடும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'கடந்த 6 மாசத்தோட அக்கவுண்ட் ஸ்டேட்மெண்ட்டை உங்க இமெயிலுக்கு அனுப்பட்டுமா?', b: 'உங்க இமெயில் ஐடிக்கு கடந்த 6 மாச வங்கி அறிக்கையை நான் அனுப்பி வைக்கவா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'கடைசியா ₹3,200 எடுத்தது நீங்கதானா?', b: 'அந்த ₹3,200 வித்ட்ராவலை நீங்களே தான் பண்ணீங்களா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'கண் பரிசோதனைக்கு முன்னாடி டிராப்ஸ் போடுவாங்க, அதனால 2 மணி நேரம் வண்டி ஓட்டாதீங்க.', b: 'பரிசோதனைக்கு முன்னால கண்ணுல சொட்டு மருந்து விடுவதால, அடுத்த 2 மணி நேரத்துக்கு டிரைவ் பண்ண வேண்டாம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'கவலைப்படாதீங்க, மோகன் சார், நாங்க இதை உடனே சரி பண்றோம்!', b: 'மோகன் சார், டென்ஷன் ஆகாதீங்க, இந்த விஷயத்தை இப்பவே நாங்க தீர்த்து வைக்கிறோம்!', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'சந்திரன் சார், உங்க பின்னை யார் கிட்டயும் சொல்லாதீங்க.', b: 'சந்திரன் சார், உங்க ரகசிய பின் நம்பரை எவருக்கும் பகிர வேண்டாம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'சிஸ்டம்ல ஒரு சின்ன கோளாறு இருக்கு, அதனால உங்க ரிக்வெஸ்ட் புராசஸ் ஆக 45 நிமிஷம் ஆகலாம்.', b: 'எங்க சிஸ்டத்துல ஒரு சிறிய தொழில்நுட்ப பிரச்சனை இருக்கறதால, உங்க கோரிக்கையை முடிக்க 45 நிமிஷம் வரை ஆகலாம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'சேகர் சார், உங்க ரத்த அழுத்தம் இப்போ கட்டுக்குள்ள வந்துடுச்சு, மாத்திரையை பாதியா குறைக்கலாம்னு டாக்டர் சொன்னாங்க!', b: 'டாக்டர் சொன்னபடி, சேகர் சார், உங்க பிபி இப்போ கண்ட்ரோல்ல இருக்கறதால மருந்தோட அளவை பாதியாக்கலாம்!', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'டாக்டரை பார்க்க ₹600 ஆகும், அதை வரவேற்பு மேசையில கட்டலாம்.', b: 'டாக்டர் கன்சல்டேஷனுக்கு ₹600 கட்டணம், அந்த தொகையை ரிசப்ஷன்ல செலுத்திடலாம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: டாக்டர் 20 நிமிஷம் லேட்டா வருவாங்க., b: டாக்டர் வந்து சேர இன்னும் 20 நிமிஷம் தாமதமாகும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'டாக்டர் ஆனந்த் இந்த வாரம் லீவுல இருக்கார், ஆனா டாக்டர் பிரகாஷ் உங்களை பார்ப்பார்.', b: 'இந்த வாரம் முழுக்க டாக்டர் ஆனந்த் விடுப்புல இருக்கறதால, அவருக்கு பதிலா டாக்டர் பிரகாஷ் உங்களுக்கு சிகிச்சை பார்ப்பார்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'டாக்டர் வீடியோ கன்சல்டேஷன்லயும் பார்ப்பாங்க, நேர்ல வர்றதுக்கு பதிலா நாளைக்கு 7 மணிக்கு வீடியோ கால்ல பேசலாமா?', b: 'கிளினிக்குக்கு நேர்ல வர்றதுக்கு பதிலா, நாளைக்கு 7 மணிக்கு வீடியோ மூலமா டாக்டர் கிட்ட ஆலோசனை பெற விருப்பமா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'டிவி ஸ்கிரீன்ல எரர் கோட் 301 வந்தா, செட்டாப் பாக்ஸை அன்ப்ளக் பண்ணி மறுபடி போடுங்க.', b: 'திரையில 301 என்ற எரர் கோட் தெரிஞ்சா, செட்டாப் பாக்ஸோட பவரை எடுத்துட்டு திரும்ப கனெக்ட் பண்ணுங்க.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: டெலிவரி கட்டணம் ₹40 மட்டும்., b: பொருளை வீட்டுக்கு கொண்டு வர நீங்க ₹40 தான் கட்டணும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: டெலிவரி பையன் 5 நிமிஷத்துல வந்துடுவார்!, b: இன்னும் 5 நிமிஷத்துக்குள்ள எங்க ஆள் உங்க வாசல்ல நிப்பார்!, label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'டெலிவரி பையன் குமார் உங்க கிட்ட தப்பா நடந்துகிட்டாருன்னா, அதை நான் உடனே ரிப்போர்ட் பண்றேன்.', b: 'குமார் என்ற எங்க டெலிவரி ஊழியர் உங்ககிட்ட முரட்டுத்தனமா பேசியிருந்தா, இப்பவே அதை புகாரா பதிவு செய்யறேன்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'டெலிவரி வண்டி பஞ்சர் ஆகிடுச்சு, ஷாலினி மேடம், அதனால அரை மணி நேரம் லேட்டாகும்.', b: 'ஷாலினி மேடம், எங்க வண்டி டயர் பஞ்சர் ஆனதால, வந்து சேர இன்னும் அரை மணி நேரம் கூடுதலா ஆகும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'டெலிவரிக்கு உங்க பிளாட் நம்பர் 304 தானே?', b: 'பார்சலை கொண்டு வர வேண்டிய வீட்டு எண் 304 தானா, சரியா சொல்லுங்க?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'திவ்யா மேடம், நீங்க எங்க கிளினிக்குக்கு முதல் தடவை வர்றீங்களா?', b: 'திவ்யா மேடம், எங்க கிளினிக்ல இது உங்களோட முதல் விசிட்டா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'நான் இதை உடனே சரிபார்க்கிறேன், சிவா சார்.', b: 'சிவா சார், ஒரு நொடியில இதை நான் செக் பண்ணி சொல்றேன்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'நான் உங்க தெரு முனையில நிக்கறேன், உங்க வீடு கோவில் பக்கத்துல இருக்கற 5வது வீடா?', b: 'உங்க தெருவோட ஆரம்பத்துல இப்போ இருக்கேன், கோவிலுக்கு பக்கத்துல 5வது வீடு தான் உங்களுடையதா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: நீங்க 199 க்கு டயல் பண்ணா உங்க பிளான் விவரங்கள் கேக்கலாம்., b: உங்க திட்டத்தோட முழு விவரத்தையும் தெரிஞ்சுக்க 199 என்ற எண்ணுக்கு அழையுங்க., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'நீங்க 60 வயசுக்கு மேல இருந்தா, ஃபிக்ஸட் டெபாசிட்டுக்கு கூடுதலா அரை சதவீதம் வட்டி கிடைக்கும்.', b: 60 வயசு தாண்டின மூத்த குடிமக்களுக்கு எஃப்டியில அரை சதவீதம் அதிக வட்டி தருவோம்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'நீங்க ஆர்டர் பண்ணது நீல கலர் சைஸ் 42 ஷூ தானே?', b: 'நீங்க கேட்டது 42 சைஸ்ல நீல நிற ஷூஸ் தானா, சரியா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'நீங்க ஒரு புது சேவிங்ஸ் அக்கவுண்ட் திறக்கணும்னா, பான் கார்டு, ஆதார், மற்றும் 2 பாஸ்போர்ட் சைஸ் போட்டோ கொண்டு வாங்க.', b: 'சேமிப்பு கணக்கு தொடங்க விரும்பினா, உங்க பான், ஆதார் கார்டுகளோட 2 பாஸ்போர்ட் அளவு புகைப்படங்களும் எடுத்துட்டு வரணும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'நீங்க கேட்ட காலர் ட்யூன் சேவையை நான் ஆக்டிவேட் பண்ணிட்டேன், மாசம் ₹30 உங்க பேலன்ஸ்ல இருந்து கழிக்கப்படும்.', b: 'உங்க விருப்பப்படி காலர் ட்யூனை இயக்கிட்டேன், அதுக்காக ஒவ்வொரு மாசமும் ₹30 பேலன்ஸ்ல இருந்து எடுக்கப்படும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'நீங்க சரியான நேரத்துக்கு வந்துட்டீங்க, அஜய் சார்!', b: 'அஜய் சார், நீங்க சொன்ன நேரத்துக்கு கச்சிதமா வந்து சேர்ந்துட்டீங்க!', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: நீங்க வந்ததும் 27 ஆம் நம்பர் டோக்கன் வாங்கிக்கோங்க., b: கிளினிக்குக்கு வந்தவுடனே ரிசப்ஷன்ல 27 ஆம் எண் டோக்கனை பெற்றுக்கோங்க., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'நீங்க வீட்டுல இல்லைன்னா, பக்கத்து வீட்டுல ராணி அம்மா கிட்ட கொடுக்கலாமா?', b: 'நீங்க வெளியில போயிருந்தா, பக்கத்து வீட்டு ராணி அம்மா கையில பார்சலை ஒப்படைக்கட்டுமா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'நெட்வொர்க் ஹெல்ப்லைனுக்கு வரவேற்கிறோம், உங்க மொபைல் நம்பர் 8812 ல முடியுதா?', b: 'எங்க நெட்வொர்க் உதவி மையத்துக்கு உங்களை வரவேற்கிறோம், உங்க போன் நம்பரோட கடைசி இலக்கங்கள் 8812 தானா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'பார்சலை பிரகாஷ் சார் தான் வாங்கிக்குவாரா?', b: 'டெலிவரி வரும்போது அதை கையில வாங்கப் போறது பிரகாஷ் சார் தானா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: பிக்கப்புக்கு வர்ற சரவணன் கிட்ட பொருளை அதோட ஒரிஜினல் பாக்ஸ்லயே கொடுங்க., b: 'சரவணன் பிக்கப் பண்ண வரும்போது, பொருளை அது வந்த அசல் பெட்டியிலேயே பேக் பண்ணி ஒப்படைங்க.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'பெரியவங்களுக்காக நாங்க தனி ஹெல்ப்லைன் வச்சிருக்கோம், அங்க ஒரு மனுஷரே நேரடியா பேசுவாங்க, சுதா மேடம்.', b: 'சுதா மேடம், வயசானவங்களுக்குன்னு ஒரு தனி உதவி எண் இருக்கு, அதுல எங்க ஊழியர் ஒருத்தரே உங்களோட நேரடியா பேசுவார்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'மன்னிக்கணும், அந்த மாடல் இப்போ ஸ்டாக்ல இல்லை, ஆனா ஜூலை மாசம் மறுபடியும் வரும்.', b: 'அந்த மாடல் தற்சமயம் கையிருப்புல இல்லை, மன்னிச்சுக்கோங்க, ஜூலை மாசம் திரும்ப ஸ்டாக்குக்கு வரும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'ரமேஷ் சார், உங்க ரவுட்டரை ரீஸ்டார்ட் பண்ணீங்களா?', b: 'ரமேஷ் சார், வைஃபை ரவுட்டரை ஒருமுறை ஆஃப் பண்ணி மறுபடி ஆன் பண்ணி பார்த்தீங்களா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'ரவி சார், உங்க ஸ்மார்ட் வாட்ச்சுக்கும் இதே நம்பர்ல கால் வர்ற மாதிரி இணைக்கலாம்.', b: 'ரவி சார், இதே மொபைல் எண்ணை உங்க ஸ்மார்ட் வாட்ச்லயும் லிங்க் பண்ணி அழைப்புகளை அதுலயே எடுக்கலாம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'ரிப்போர்ட் ரெடியானதும், உங்க வாட்ஸ்அப்புக்கு பிடிஎஃப் அனுப்புவோம், அது பொதுவா 36 மணி நேரம் ஆகும்.', b: 'பொதுவா 36 மணி நேரத்துல ரிசல்ட் தயாராகும், அப்போ அதை பிடிஎஃப்பா வாட்ஸ்அப்ல உங்களுக்கு அனுப்பிடுவோம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'வணக்கம், நான் பிரியா, இன்னைக்கு உங்க கால்ல உதவப் போறேன்.', b: 'வணக்கம், இந்த கால்ல உங்களுக்கு உதவி செய்யப் போறது நான் பிரியா.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'வணக்கம், நான் ரம்யா, உங்க வங்கியோட கஸ்டமர் கேர்ல இருந்து பேசறேன்.', b: 'வணக்கம், உங்க வங்கி வாடிக்கையாளர் சேவை பிரிவுல இருந்து ரம்யா நான் அழைக்கிறேன்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'வீட்டுக்கடனுக்கு உங்க சிபில் ஸ்கோர் 750 க்கு மேல இருக்கணும், உங்களுடையது எவ்வளவுன்னு தெரியுமா?', b: 'ஹோம் லோன் கிடைக்க சிபில் ஸ்கோர் 750 தாண்டணும், உங்க ஸ்கோர் என்னன்னு உங்களுக்கு தெரியுமா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: ஸ்கேன் ரூம் 2வது மாடியில இருக்கு., b: ஸ்கேன் எடுக்கற அறைக்கு நீங்க 2வது தளத்துக்கு போகணும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: te, a: ఈ ప్లాన్‌లో నెట్‌ఫ్లిక్స్ సబ్‌స్క్రిప్షన్ ఉచితంగా రాదు., b: మీ ప్రాంతానికి ప్రస్తుతం క్విక్‌షిప్ ఎక్స్‌ప్రెస్ డెలివరీ సౌకర్యం లేదు., label: changed, request: new, stored: meaning_change}
- {lang: te, a: 'గోపాల్ గారు, మీకు పెన్సిలిన్ వంటి మందులకు అలర్జీ లేదా?', b: 'గోపాల్ గారు, పెన్సిలిన్ లాంటి మెడిసిన్స్ వేసుకుంటే మీకు రియాక్షన్ వస్తుందా?', label: changed, request: paraphrase, stored: meaning_change}
- {lang: te, a: 'పెద్ద ఫర్నిచర్ డెలివరీకి ముందు, మా టీమ్ శనివారం మీకు ఫోన్ చేసి సమయం ఖరారు చేస్తుంది.', b: 'పెద్ద ఫర్నిచర్ డెలివరీకి ముందు, మా టీమ్ శనివారం మీకు ఫోన్ చేయదు, సమయం ఖరారు చేయదు.', label: changed, request: meaning_change, stored: new}
- {lang: te, a: 'మీ ఇంటికి దగ్గర్లో గుర్తుగా చెప్పడానికి ఏదైనా గుడి లేదా స్కూల్ ఉందా, లక్ష్మణ్ గారు?', b: 'మీ ఇంటికి దగ్గర్లో గుర్తుగా చెప్పడానికి ఏ గుడి లేదా స్కూల్ లేదా, లక్ష్మణ్ గారు?', label: changed, request: meaning_change, stored: new}
- {lang: te, a: 'మీ నాన్నగారు రమేష్ గారి పెన్షన్ ఈ నెల ఇంకా జమ కాలేదు, ట్రెజరీ నుంచి ఆలస్యం జరిగింది.', b: 'మీ నాన్నగారు రమేష్ గారి పెన్షన్ ఈ నెల ఇప్పటికే జమ అయింది, ట్రెజరీ నుంచి ఆలస్యం జరగలేదు.', label: changed, request: meaning_change, stored: new}
- {lang: te, a: 'మీ వారంటీ డిసెంబర్ వరకు చెల్లుతుంది, కాబట్టి రిపేర్‌కు ఎలాంటి ఛార్జ్ ఉండదు.', b: 'మీ వారంటీ డిసెంబర్ వరకు చెల్లదు, కాబట్టి రిపేర్‌కు ఛార్జ్ ఉంటుంది.', label: changed, request: meaning_change, stored: new}
- {lang: te, a: 'మీ సమస్య మళ్ళీ వస్తే, ఇదే టికెట్ నంబర్ 80455 చెప్పండి, కొత్తది అవసరం లేదు.', b: 'మీ సమస్య మళ్ళీ వస్తే, ఇదే టికెట్ నంబర్ 80455 చెప్పవద్దు, కొత్తది అవసరం.', label: changed, request: meaning_change, stored: new}
- {lang: te, a: 'మీరు కోరినట్లే, అనిల్ పార్సెల్‌ను గుమ్మం దగ్గర పెట్టి ఫోటో తీసి పంపుతారు.', b: 'మీరు కోరినా, అనిల్ పార్సెల్‌ను గుమ్మం దగ్గర పెట్టరు, ఫోటో తీసి పంపరు.', label: changed, request: meaning_change, stored: new}
- {lang: te, a: 'రోజుకు దాదాపు 10 స్పామ్ కాల్స్ వస్తున్నాయంటే, డీఎన్‌డీ సర్వీస్ ఆన్ చేయమంటారా?', b: 'రోజుకు దాదాపు 10 స్పామ్ కాల్స్ వస్తున్నా, డీఎన్‌డీ సర్వీస్ ఆన్ చేయవద్దంటారా?', label: changed, request: meaning_change, stored: new}
- {lang: te, a: లాయర్ రాజు గారితో మీ కన్సల్టేషన్ ఆఫీస్‌లో కాకుండా ఫోన్‌లో జరుగుతుంది., b: లాయర్ రాజు గారితో మీ కన్సల్టేషన్ ఫోన్‌లో కాకుండా ఆఫీస్‌లో జరుగుతుంది., label: changed, request: meaning_change, stored: new}
- {lang: te, a: '₹4,999 విలువైన ఈ లావాదేవీ మీరు చేయకపోతే, వెంటనే మీ కార్డ్ బ్లాక్ చేస్తాము.', b: '₹4,999 విలువైన ఈ లావాదేవీ మీరు చేయకపోయినా, మీ కార్డ్ బ్లాక్ చేయము.', label: changed, request: meaning_change, stored: new}
- {lang: te, a: 'అపాయింట్‌మెంట్‌కు మీతో పాటు మరో 2 మంది వస్తున్నారా?', b: 'మీ వెంట ఇంకో 2 మంది కూడా అపాయింట్‌మెంట్‌కు వస్తారా?', label: paraphrase, request: paraphrase, stored: new}
