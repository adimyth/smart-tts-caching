- {lang: te, a: 'రౌటర్ మీద ఎడమ నుంచి 3వ లైట్ ఎరుపు రంగులో వెలుగుతోందా?', b: 'మీ రౌటర్‌లో ఎడమ వైపు నుంచి 3వ బల్బ్ రెడ్ కలర్‌లో కనిపిస్తోందా?', label: paraphrase, request: paraphrase, stored: new}
