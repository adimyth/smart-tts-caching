- {lang: pa, a: 'ਬਹੁਤ ਖ਼ੂਬ, ਤੁਹਾਡੀ ਸਰਜਰੀ ਤੋਂ ਬਾਅਦ ਵਾਲੀ ਜਾਂਚ 28 ਫ਼ਰਵਰੀ ਲਈ ਪੱਕੀ ਹੋ ਗਈ!', b: ਵਧੀਆ ਖ਼ਬਰ ਹੈ ਕਿ ਅਪਰੇਸ਼ਨ ਮਗਰੋਂ ਦਾ ਫ਼ੌਲੋ-ਅੱਪ ਚੈੱਕਅਪ 28 ਫ਼ਰਵਰੀ ਨੂੰ ਤੈਅ ਹੋ ਗਿਆ!, label: paraphrase, request: paraphrase, stored: new}
- {lang: pa, a: 'ਬਹੁਤ ਵਧੀਆ, ਤੁਹਾਡਾ ਆਰਡਰ ਸਮੇਂ ਤੋਂ 20 ਮਿੰਟ ਪਹਿਲਾਂ ਪਹੁੰਚ ਗਿਆ!', b: ਖ਼ੁਸ਼ੀ ਦੀ ਗੱਲ ਹੈ ਕਿ ਆਰਡਰ ਤੈਅ ਸਮੇਂ ਤੋਂ 20 ਮਿੰਟ ਜਲਦੀ ਤੁਹਾਡੇ ਤੱਕ ਆ ਗਿਆ!, label: paraphrase, request: paraphrase, stored: new}
- {lang: pa, a: 'ਭਾਰੀ ਸਾਮਾਨ ਹੋਣ ਕਰਕੇ, ਸੋਫ਼ਾ ਦੋ ਬੰਦੇ ਲੈ ਕੇ ਆਉਣਗੇ ਅਤੇ ਉਹ ਹੀ ਇਸਨੂੰ ਤੀਜੀ ਮੰਜ਼ਿਲ ਤੱਕ ਚੜ੍ਹਾਉਣਗੇ।', b: 'ਸੋਫ਼ਾ ਕਾਫ਼ੀ ਭਾਰਾ ਹੈ, ਇਸ ਲਈ ਸਾਡੇ ਦੋ ਕਾਮੇ ਇਸਨੂੰ ਲਿਆ ਕੇ ਤੀਜੀ ਮੰਜ਼ਿਲ ਉੱਤੇ ਪਹੁੰਚਾ ਦੇਣਗੇ।', label: paraphrase, request: paraphrase, stored: new}
- {lang: pa, a: 'ਮੁਬਾਰਕਾਂ, ਤੁਹਾਡੀ ਪਹਿਲੀ ਡਿਲੀਵਰੀ ਮੁਫ਼ਤ ਹੈ, ਅਤੇ ਅਗਲੇ 5 ਆਰਡਰਾਂ ''ਤੇ ਵੀ ਕੋਈ ਚਾਰਜ ਨਹੀਂ ਲੱਗੇਗਾ!', b: 'ਵਧਾਈਆਂ, ਪਹਿਲੇ ਆਰਡਰ ਦੀ ਡਿਲੀਵਰੀ ਦੇ ਕੋਈ ਪੈਸੇ ਨਹੀਂ, ਅਤੇ ਉਸ ਤੋਂ ਬਾਅਦ 5 ਹੋਰ ਆਰਡਰ ਵੀ ਮੁਫ਼ਤ ਪਹੁੰਚਣਗੇ!', label: paraphrase, request: paraphrase, stored: new}
- {lang: pa, a: 'ਮੁਰੰਮਤ ਦੇ ਕੰਮ ਕਰਕੇ, ਤੁਹਾਡੇ ਸੈਕਟਰ ਵਿੱਚ ਰਾਤ 11 ਵਜੇ ਤੱਕ ਇੰਟਰਨੈੱਟ ਹੌਲੀ ਚੱਲੇਗਾ।', b: 'ਤੁਹਾਡੇ ਸੈਕਟਰ ਵਿੱਚ ਮੇਨਟੇਨੈਂਸ ਚੱਲ ਰਹੀ ਹੈ, ਇਸ ਲਈ ਰਾਤ 11 ਵਜੇ ਤੱਕ ਨੈੱਟ ਦੀ ਸਪੀਡ ਘੱਟ ਰਹੇਗੀ।', label: paraphrase, request: paraphrase, stored: new}
- {lang: pa, a: 'ਮੈਂ ਤੁਹਾਡੀ ਈਮੇਲ ਆਈਡੀ ਨਵੀਂ ਕਰ ਦਿੱਤੀ ਹੈ, ਹੁਣ ਸਾਰੇ ਬਿੱਲ ਉੱਥੇ ਹੀ 1 ਤਰੀਕ ਨੂੰ ਆਉਣਗੇ।', b: 'ਤੁਹਾਡਾ ਈਮੇਲ ਪਤਾ ਬਦਲ ਦਿੱਤਾ ਗਿਆ ਹੈ, ਇਸ ਲਈ ਹਰ ਮਹੀਨੇ ਦੀ 1 ਤਰੀਕ ਨੂੰ ਬਿੱਲ ਨਵੇਂ ਪਤੇ ''ਤੇ ਪਹੁੰਚਣਗੇ।', label: paraphrase, request: paraphrase, stored: new}
