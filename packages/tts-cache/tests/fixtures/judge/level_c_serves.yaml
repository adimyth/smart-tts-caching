- {lang: ta, a: 'இந்த ஆர்டர்ல ஐஸ்கிரீம் இருக்கு, வாங்கினவுடனே ஃப்ரீசர்ல வைங்க, இல்லன்னா 15 நிமிஷத்துல உருகிடும்.', b: 'நீங்க 15 நிமிஷத்துக்கு மேல லேட்டா வந்தா, உங்க ஸ்லாட் அடுத்த பேஷன்ட்டுக்கு போயிடும், அதனால கொஞ்சம் முன்னாடியே வாங்க.', label: changed, request: new, stored: slot_change}
- {lang: ta, a: 'இந்த ஏரியாவுல ஃபைபர் கனெக்ஷன் போட கேபிள் வேலை முடியணும், அது ஜனவரி கடைசிக்குள்ள முடிஞ்சுடும்னு எதிர்பார்க்கறோம்.', b: 'இந்த பின்கோடுக்கு நாங்க இன்னும் சர்வீஸ் தொடங்கலை, ஆனா ஜனவரி மாசத்துல இருந்து உங்க ஏரியாவுக்கும் டெலிவரி கிடைக்கும்.', label: changed, request: new, stored: slot_change}
- {lang: ta, a: 'இந்த பின்கோடுக்கு நாங்க இன்னும் சர்வீஸ் தொடங்கலை, ஜனவரி மாசத்துல இருந்தும் உங்க ஏரியாவுக்கு டெலிவரி கிடைக்காது.', b: 'உங்க பின்கோடு பகுதிக்கு இப்போதைக்கு எங்க சேவை இல்லை, ஜனவரி மாசத்துல இருந்து அங்கேயும் டெலிவரி பண்ணத் தொடங்குவோம்.', label: changed, request: paraphrase, stored: meaning_change}
- {lang: ta, a: 'இன்னைக்கு எங்களோட பேசினதுக்கு நன்றி, உங்க கேஸ் பத்தி 36 மணி நேரத்துல அப்டேட் அனுப்பறோம்.', b: 'ரிப்போர்ட் ரெடியானதும், உங்க வாட்ஸ்அப்புக்கு பிடிஎஃப் அனுப்புவோம், அது பொதுவா 36 மணி நேரம் ஆகும்.', label: changed, request: new, stored: slot_change}
- {lang: ta, a: 'உங்க கார்டு நேத்து ராத்திரி 9 மணிக்கு அப்புறம் தான் காணாம போச்சா?', b: 'உங்க கார்டு நேத்து ராத்திரி 9 மணிக்கு அப்புறம் காணாம போகலையா?', label: changed, request: meaning_change, stored: new}
- {lang: ta, a: 'உங்க ஜாயிண்ட் அக்கவுண்ட்ல இருக்கற இன்னொரு பேர் ராஜா தானே?', b: 'இந்த நம்பர் இன்னும் உங்க அப்பா ராஜா பேர்ல தான் இருக்கு, அதை உங்க பேருக்கு மாத்தணுமா?', label: changed, request: new, stored: slot_change}
- {lang: ta, a: உங்க நம்பரை போர்ட் பண்ண யுபிசி கோட் 15 நாள் தான் செல்லுபடியாகும்., b: உங்க இசிம் க்யூஆர் கோட் உங்க இமெயிலுக்கு 15 நிமிஷத்துல வரும்., label: changed, request: new, stored: slot_change}
- {lang: ta, a: உங்க நம்பரை போர்ட் பண்ண யுபிசி கோட் 7 நாள் தான் செல்லுபடியாகும்., b: 'டிஎன்டி சேவையை ஆன் பண்ணா, 7 நாள்ல விளம்பர கால்கள் நின்னுடும்.', label: changed, request: slot_change, stored: new}
- {lang: ta, a: 'உங்க வீட்டு லோனுக்கு வட்டி விகிதம் 8 சதவீதத்துல இருந்து குறைஞ்சிருக்கு, அதனால இஎம்ஐ கொஞ்சம் கம்மியாகும்.', b: 'உங்க வீட்டு லோனுக்கு வட்டி விகிதம் 8 சதவீதத்துல இருந்து அதிகமாயிருக்கு, அதனால இஎம்ஐ கொஞ்சம் கூடும்.', label: changed, request: meaning_change, stored: new}
- {lang: ta, a: 'உங்களுக்கு ஏதாவது மருந்து அலர்ஜி இருக்கா, கண்ணன் சார்?', b: 'உங்களுக்கு எந்த மருந்து அலர்ஜியும் இல்லையா, கண்ணன் சார்?', label: changed, request: meaning_change, stored: new}
- {lang: ta, a: 'டெலிவரி பையன் குமார் உங்க கிட்ட தப்பா நடந்துகிட்டாருன்னா, அதை நான் உடனே ரிப்போர்ட் பண்றேன்.', b: 'டெலிவரி பையன் குமார் உங்க கிட்ட தப்பா நடந்துகிட்டாருன்னா, அதை நான் ரிப்போர்ட் பண்ண மாட்டேன்.', label: changed, request: meaning_change, stored: new}
- {lang: ta, a: 'நீங்க இந்த ஆப்பை 27 ஆம் தேதிக்கு அப்புறம் அப்டேட் பண்ணீங்களா?', b: நீங்க வந்ததும் 27 ஆம் நம்பர் டோக்கன் வாங்கிக்கோங்க., label: changed, request: new, stored: slot_change}
- {lang: ta, a: 'அனிதா மேடம், பார்சல் ஒரு நாள் லேட்டாகும்.', b: 'அனிதா மேடம், உங்க பொருள் வர இன்னும் ஒரு நாள் கூடுதலா எடுக்கும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'அருண் சார், என் குரல் கேக்குதா?', b: 'அருண் சார், நான் பேசறது உங்களுக்கு தெளிவா காதுல விழுதா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'ஆட்டோபே செட் பண்ணா ஒவ்வொரு பில்லுக்கும் 2 சதவீதம் தள்ளுபடி கிடைக்கும், செட் பண்ணட்டுமா?', b: 'தானியங்கி பேமெண்ட் வசதியை இயக்கினா எல்லா பில்லுலயும் 2 சதவீதம் குறையும், அதை ஆன் பண்ணலாமா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'ஆமாம், நீங்க சரியான நேரத்துக்கு வந்துட்டீங்க, அஜய் சார்!', b: 'அஜய் சார், நீங்க சொன்ன நேரத்துக்கு கச்சிதமா வந்து சேர்ந்துட்டீங்க!', label: paraphrase, request: paraphrase, stored: filler}
- {lang: ta, a: 'ஆர்டர் 66390 பாக்ஸ் உடைஞ்சு வந்துச்சா?', b: '66390 ஆர்டரோட பெட்டி சேதமான நிலையில உங்களுக்கு கிடைச்சுதா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'இது வெளிநாட்டுல இருந்து வர்ற ஆர்டர், அதனால டெலிவரிக்கு முன்னாடி $30 சுங்க வரி கட்டணும்.', b: 'இந்த பார்சல் வெளிநாட்டு ஷிப்மெண்ட், கைக்கு வர்றதுக்கு முன்னால $30 கஸ்டம்ஸ் கட்டணம் செலுத்தணும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'இந்த ஆர்டர்ல ஐஸ்கிரீம் இருக்கு, வாங்கினவுடனே ஃப்ரீசர்ல வைங்க, இல்லன்னா 20 நிமிஷத்துல உருகிடும்.', b: 'ஐஸ்கிரீம் 20 நிமிஷத்துல உருகிப் போகும், அதனால பார்சல் கைக்கு வந்ததும் உடனே ஃப்ரீசருக்குள்ள வச்சிடுங்க.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'இந்த ஏரியாவுல ஃபைபர் கனெக்ஷன் போட கேபிள் வேலை முடியணும், அது டிசம்பர் கடைசிக்குள்ள முடிஞ்சுடும்னு எதிர்பார்க்கறோம்.', b: 'உங்க பகுதியில ஃபைபர் இணைப்பு கொடுக்க வயரிங் வேலை பாக்கி இருக்கு, டிசம்பர் கடைசிக்குள்ள அதை முடிக்க திட்டமிட்டிருக்கோம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'இந்த கால் ரெக்கார்ட் செய்யப்படும், ராஜேஷ் சார்.', b: 'ராஜேஷ் சார், தரத்தை உறுதி செய்ய இந்த உரையாடல் பதிவு செய்யப்படும்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: இந்த சேவைக்கு ₹118 கட்டணம் உண்டு., b: இந்த வசதியை பயன்படுத்த ₹118 சார்ஜ் பிடிக்கப்படும்., label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'இந்த தப்புக்கு நாங்க முழு பொறுப்பு ஏத்துக்கறோம், கவிதா மேடம்.', b: 'கவிதா மேடம், நடந்த தவறு முழுக்க எங்க பக்கம்தான், அதை நாங்க ஒப்புக்கறோம்.', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: 'இந்த பெட்டிக்குள்ள 4 கண்ணாடி டம்ளர் இருக்கறதால, அதை ஃப்ரஜைல்னு மார்க் பண்ணட்டுமா?', b: '4 கண்ணாடி டம்ளர்கள் உள்ள இருக்கறதால, பெட்டி மேல உடையக்கூடியதுன்னு ஸ்டிக்கர் ஒட்டலாமா?', label: paraphrase, request: paraphrase, stored: new}
- {lang: ta, a: இந்த மாசம் உங்களுக்கு 10 ஜிபி போனஸ் டேட்டா இலவசம்!, b: 'சூப்பர் ஆஃபர், இந்த மாசம் 10 ஜிபி கூடுதல் டேட்டா எந்த கட்டணமும் இல்லாம கிடைக்கும்!', label: paraphrase, request: paraphrase, stored: new}
