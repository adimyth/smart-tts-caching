- {lang: ml, a: 'വൈഫൈ പാസ്‌വേഡ് മാറ്റിയ ശേഷം എത്ര ഉപകരണങ്ങൾ കണക്ട് ആയി, 5 എണ്ണമാണോ?', b: 'പുതിയ വൈഫൈ പാസ്‌വേഡ് സെറ്റ് ചെയ്തതിന് ശേഷം 5 ഡിവൈസുകളാണോ കണക്ട് ആയത്?', label: paraphrase, request: paraphrase, stored: new}
