  text: ਤੁਹਾਡੇ ਤੋਹਫ਼ੇ ਨਾਲ ਹੱਥ ਨਾਲ ਲਿਖਿਆ ਕਾਰਡ, ਜਿਸ ਉੱਤੇ ਨੂਰ ਦਾ ਨਾਮ ਹੈ, ਪੈਕ ਕਰ ਦਿੱਤਾ ਗਿਆ ਹੈ।
  slots:
  - span: ਨੂਰ
    kind: name
    alts:
    - ਮਹਿਕ
    - ਸਾਨਵੀ
    - ਇਸ਼ਮੀਤ
  paraphrase: ਨੂਰ ਦੇ ਨਾਮ ਵਾਲਾ ਹੱਥ-ਲਿਖਤ ਕਾਰਡ ਵੀ ਤੁਹਾਡੇ ਗਿਫ਼ਟ ਦੇ ਨਾਲ ਡੱਬੇ ਵਿੱਚ ਰੱਖ ਦਿੱਤਾ ਹੈ।
  meaning_change: ਤੁਹਾਡੇ ਤੋਹਫ਼ੇ ਨਾਲ ਹੱਥ ਨਾਲ ਲਿਖਿਆ ਕਾਰਡ, ਜਿਸ ਉੱਤੇ ਨੂਰ ਦਾ ਨਾਮ ਹੈ, ਪੈਕ ਨਹੀਂ ਕੀਤਾ ਗਿਆ ਹੈ।
