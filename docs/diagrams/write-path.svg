<path class="e" d="M1169,164 L1169,258"/>
<rect class="lb" x="1182.0" y="187" width="56" height="18"/><text class="l" x="1210" y="200">decode</text>
<text class="legend" x="44" y="396">capture() enqueues and returns at once. Everything on this page runs in a bounded background task and never blocks audio.</text>
