<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#374151"/></marker>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker>
  </defs>

  <style>
    .lane  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.5; rx: 14; }
    .lt    { fill: #111827; font-size: 17px; font-weight: 700; }
    .gt    { fill: #6b7280; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .node  { fill: #ffffff; stroke: #374151; stroke-width: 2; rx: 10; }
    .plug  { fill: #ffffff; stroke: #6366f1; stroke-width: 2; stroke-dasharray: 6 4; rx: 10; }
    .blue  { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
    .green { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 10; }
    .red   { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 10; }
    .grey  { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; rx: 10; }
    .store { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
    .t     { fill: #111827; font-size: 16px; text-anchor: middle; }
    .sub   { fill: #4b5563; font-size: 12.5px; text-anchor: middle; }
    .e     { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#a); }
    .eg    { fill: none; stroke: #15803d; stroke-width: 2; marker-end: url(#ag); }
    .er    { fill: none; stroke: #b91c1c; stroke-width: 2; marker-end: url(#ar); }
    .ed    { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#ab); }
    .l     { fill: #374151; font-size: 13px; text-anchor: middle; }
    .lg    { fill: #15803d; font-size: 13px; text-anchor: middle; }
    .lr    { fill: #b91c1c; font-size: 13px; text-anchor: middle; }
    .lb    { fill: #f9fafb; }
    .legend{ fill: #6b7280; font-size: 12.5px; }
    .life  { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .act   { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
    .msg   { fill: none; stroke: #374151; stroke-width: 1.8; marker-end: url(#a); }
    .msgr  { fill: none; stroke: #374151; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#a); }
    .msgb  { fill: none; stroke: #2563eb; stroke-width: 1.8; marker-end: url(#ab); }
    .ml    { fill: #111827; font-size: 12.5px; text-anchor: middle; }
    .mlb   { fill: #ffffff; }
  </style>

<rect class="lane" x="20" y="20" width="1240" height="560"/><text class="lt" x="44" y="50">Lookup order for one sentence</text><rect class="green" x="320" y="86" width="640" height="48"/><text class="t" x="640.0" y="116.0">Serve stored audio in the sentence's position</text>
<rect class="green" x="1000" y="86" width="240" height="48"/><text class="t" x="1120.0" y="116.0">Serve and rewrite transcript</text>
<rect class="blue" x="44" y="250" width="150" height="64"/><text class="t" x="119.0" y="279.0">Sentence</text><text class="sub" x="119.0" y="299.0">canonicalise, hash</text>
<rect class="node" x="234" y="250" width="170" height="64"/><text class="t" x="319.0" y="279.0">L1 exact</text><text class="sub" x="319.0" y="299.0">process memory</text>
<rect class="node" x="444" y="250" width="170" height="64"/><text class="t" x="529.0" y="279.0">L2 exact</text><text class="sub" x="529.0" y="299.0">deadline 20 ms</text>
<rect class="node" x="654" y="250" width="170" height="64"/><text class="t" x="739.0" y="279.0">Level B</text><text class="sub" x="739.0" y="299.0">near-duplicate, if on</text>
<rect class="node" x="864" y="250" width="170" height="64"/><text class="t" x="949.0" y="279.0">Level C</text><text class="sub" x="949.0" y="299.0">semantic, slot + span veto</text>
<path class="e" d="M194,282 L232,282"/>
<path class="e" d="M404,282 L442,282"/>
<path class="e" d="M614,282 L652,282"/>
<path class="e" d="M824,282 L862,282"/>
<rect class="lb" x="403.0" y="259" width="40" height="18"/><text class="l" x="423" y="272">miss</text>
<rect class="lb" x="613.0" y="259" width="40" height="18"/><text class="l" x="633" y="272">miss</text>
<rect class="lb" x="823.0" y="259" width="40" height="18"/><text class="l" x="843" y="272">miss</text>
<rect class="red" x="1074" y="250" width="170" height="64"/><text class="t" x="1159.0" y="279.0">Miss</text><text class="sub" x="1159.0" y="299.0">synthesise, then capture</text>
<path class="e" d="M1034,282 L1072,282"/>
<rect class="lb" x="1033.0" y="259" width="40" height="18"/><text class="l" x="1053" y="272">miss</text>
<path class="eg" d="M319,250 L319,136"/>
<rect class="lb" x="301.0" y="177" width="36" height="18"/><text class="lg" x="319" y="190">hit</text>
<path class="eg" d="M529,250 L529,136"/>
<rect class="lb" x="511.0" y="177" width="36" height="18"/><text class="lg" x="529" y="190">hit</text>
<path class="eg" d="M739,250 L739,136"/>
<rect class="lb" x="644.0" y="177" width="190" height="18"/><text class="lg" x="739" y="190">hit, class allowed by policy</text>
<path class="eg" d="M949,250 L949,136"/>
<rect class="lb" x="839.0" y="177" width="220" height="18"/><text class="lg" x="949" y="190">hit: above threshold, both vetoes pass</text>
<path class="e" d="M529,314 L529,370 L319,370 L319,316"/>
<rect class="lb" x="369.0" y="349" width="110" height="18"/><text class="l" x="424" y="362">L2 hit fills L1</text>
<rect class="grey" x="234" y="440" width="170" height="56"/><text class="t" x="319.0" y="465.0">under 0.1 ms</text><text class="sub" x="319.0" y="485.0">hash lookup</text>
<rect class="grey" x="444" y="440" width="170" height="56"/><text class="t" x="529.0" y="465.0">1 to 4 ms</text><text class="sub" x="529.0" y="485.0">hard deadline, then miss</text>
<rect class="grey" x="654" y="440" width="170" height="56"/><text class="t" x="739.0" y="465.0">under 1 ms</text><text class="sub" x="739.0" y="485.0">shingles, LSH, edit distance</text>
<rect class="grey" x="864" y="440" width="170" height="56"/><text class="t" x="949.0" y="465.0">about 3 ms</text><text class="sub" x="949.0" y="485.0">e5-small via onnxruntime, HNSW</text>
<text class="legend" x="44" y="556">Levels B and C are on by default; C serves only in languages that passed the acceptance check. Only the first sentence of a turn is on the critical path; later lookups overlap the LLM stream.</text>
</svg>
