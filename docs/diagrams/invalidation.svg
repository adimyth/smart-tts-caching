<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#374151"/></marker>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#15803d"/></marker>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#b91c1c"/></marker>
  </defs>

  <style>
    .lane  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.5; rx: 14; }
    .lt    { fill: #111827; font-size: 17px; font-weight: 700; }
    .gt    { fill: #6b7280; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .node  { fill: #ffffff; stroke: #374151; stroke-width: 2; rx: 10; }
    .plug  { fill: #ffffff; stroke: #6366f1; stroke-width: 2; stroke-dasharray: 6 4; rx: 10; }
    .blue  { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
    .green { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 10; }
    .red   { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 10; }
    .grey  { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; rx: 10; }
    .store { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
    .t     { fill: #111827; font-size: 16px; text-anchor: middle; }
    .sub   { fill: #4b5563; font-size: 12.5px; text-anchor: middle; }
    .e     { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#a); }
    .eg    { fill: none; stroke: #15803d; stroke-width: 2; marker-end: url(#ag); }
    .er    { fill: none; stroke: #b91c1c; stroke-width: 2; marker-end: url(#ar); }
    .ed    { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#ab); }
    .l     { fill: #374151; font-size: 13px; text-anchor: middle; }
    .lg    { fill: #15803d; font-size: 13px; text-anchor: middle; }
    .lr    { fill: #b91c1c; font-size: 13px; text-anchor: middle; }
    .lb    { fill: #f9fafb; }
    .legend{ fill: #6b7280; font-size: 12.5px; }
    .life  { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .act   { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
    .msg   { fill: none; stroke: #374151; stroke-width: 1.8; marker-end: url(#a); }
    .msgr  { fill: none; stroke: #374151; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#a); }
    .msgb  { fill: none; stroke: #2563eb; stroke-width: 1.8; marker-end: url(#ab); }
    .ml    { fill: #111827; font-size: 12.5px; text-anchor: middle; }
    .mlb   { fill: #ffffff; }
  </style>

<rect class="lane" x="20" y="20" width="400" height="400"/><text class="lt" x="40" y="50">Automatic</text><text class="gt" x="40" y="72">NOTHING TO RUN</text><rect class="blue" x="40" y="96" width="360" height="52"/><text class="t" x="220.0" y="128.0">Voice, model, settings or sample rate change</text>
<path class="e" d="M220,148 L220,168"/>
<rect class="node" x="40" y="170" width="360" height="64"/><text class="sub" x="220" y="197">Scope hash changes; old entries</text><text class="sub" x="220" y="216">become unreachable and age out</text>
<rect class="blue" x="40" y="256" width="360" height="52"/><text class="t" x="220.0" y="288.0">Canonicalisation rule change</text>
<path class="e" d="M220,308 L220,328"/>
<rect class="node" x="40" y="330" width="360" height="64"/><text class="sub" x="220" y="357">schema_version bump on</text><text class="sub" x="220" y="376">deploy; whole cache invalidated</text>
<rect class="lane" x="440" y="20" width="400" height="400"/><text class="lt" x="460" y="50">Operator command</text><text class="gt" x="460" y="72">ONE CLI CALL</text><rect class="blue" x="460" y="96" width="360" height="52"/><text class="t" x="640.0" y="128.0">Bust one voice or model now</text>
<path class="e" d="M640,148 L640,168"/>
<rect class="node" x="460" y="170" width="360" height="64"/><text class="sub" x="640" y="197">bump-generation: INCR the scope counter;</text><text class="sub" x="640" y="216">readers refresh every 60 s</text>
<rect class="blue" x="460" y="256" width="360" height="52"/><text class="t" x="640.0" y="288.0">A sentence must never be replayed</text>
<path class="e" d="M640,308 L640,328"/>
<rect class="node" x="460" y="330" width="360" height="64"/><text class="sub" x="640" y="357">purge by tag,</text><text class="sub" x="640" y="376">key or text match</text>
<rect class="lane" x="860" y="20" width="400" height="400"/><text class="lt" x="880" y="50">Scheduled job</text><text class="gt" x="880" y="72">RUNS ON A TIMER</text><rect class="blue" x="880" y="96" width="360" height="52"/><text class="t" x="1060.0" y="128.0">Provider drift under a floating model alias</text>
<path class="e" d="M1060,148 L1060,168"/>
<rect class="node" x="880" y="170" width="360" height="64"/><text class="sub" x="1060" y="197">daily canary re-synthesises reference sentences,</text><text class="sub" x="1060" y="216">compares, bumps generation and alerts</text>
<rect class="blue" x="880" y="256" width="360" height="52"/><text class="t" x="1060.0" y="288.0">Capture or verifier change</text>
<path class="e" d="M1060,308 L1060,328"/>
<rect class="node" x="880" y="330" width="360" height="64"/><text class="sub" x="1060" y="357">ingest_version per entry; re-verify on</text><text class="sub" x="1060" y="376">next hit or re-ingest in background</text>

</svg>
