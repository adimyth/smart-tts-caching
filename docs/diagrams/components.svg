<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1000" viewBox="0 0 1560 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#374151"/>
    </marker>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    .lane  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.5; rx: 14; }
    .lt    { fill: #111827; font-size: 22px; font-weight: 700; }
    .gt    { fill: #6b7280; font-size: 14px; font-weight: 700; letter-spacing: 0.6px; }
    .node  { fill: #ffffff; stroke: #374151; stroke-width: 2; rx: 10; }
    .plug  { fill: #ffffff; stroke: #6366f1; stroke-width: 2; stroke-dasharray: 6 4; rx: 10; }
    .blue  { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
    .store { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
    .t     { fill: #111827; font-size: 20px; text-anchor: middle; }
    .sub   { fill: #4b5563; font-size: 15px; text-anchor: middle; }
    .e     { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#a); }
    .ed    { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#ab); }
    .l     { fill: #374151; font-size: 20px; text-anchor: middle; }
    .lb    { fill: #f9fafb; }
    .legend{ fill: #6b7280; font-size: 15px; }
  </style>

  <!-- adapter lane -->
  <rect class="lane" x="24" y="20" width="1512" height="132"/>
  <text class="lt" x="48" y="52">tts-cache-pipecat</text>
  <rect class="blue" x="190" y="72" width="220" height="52"/>
  <text class="t" x="300" y="104">TTSCacheRead</text>
  <rect class="blue" x="690" y="72" width="220" height="52"/>
  <text class="t" x="800" y="104">TTSCacheWrite</text>

  <!-- core lane -->
  <rect class="lane" x="24" y="196" width="1512" height="780"/>
  <text class="lt" x="48" y="228">tts-cache core</text>

  <!-- facade -->
  <rect class="blue" x="160" y="260" width="800" height="52"/>
  <text class="t" x="560" y="292">TTSCache: lookup, capture, synthesize, stream</text>

  <path class="ed" d="M300,124 L300,260"/>
  <path class="ed" d="M800,124 L800,260"/>

  <!-- hot path -->
  <text class="gt" x="48" y="492">HOT PATH, PER SENTENCE, UNDER 5 MS</text>
  <rect class="plug" x="48"  y="400" width="164" height="54"/><text class="t" x="130" y="433">Splitter</text>
  <rect class="plug" x="260" y="400" width="164" height="54"/><text class="t" x="342" y="433">Canonicaliser</text>
  <rect class="node" x="472" y="400" width="164" height="54"/><text class="t" x="554" y="433">Key builder</text>
  <rect class="plug" x="684" y="400" width="164" height="54"/><text class="t" x="766" y="433">Policy</text>
  <rect class="plug" x="896" y="400" width="164" height="54"/><text class="t" x="978" y="433">Matcher</text>
  <path class="e" d="M212,427 L260,427"/>
  <path class="e" d="M424,427 L472,427"/>
  <path class="e" d="M636,427 L684,427"/>
  <path class="e" d="M848,427 L896,427"/>
  <path class="e" d="M300,312 L300,364 L130,364 L130,400"/>

  <!-- ingest -->
  <text class="gt" x="1124" y="492">INGEST, IN THE BACKGROUND</text>
  <rect class="node" x="1148" y="400" width="132" height="54"/><text class="t" x="1214" y="433">Checks</text>
  <rect class="plug" x="1336" y="400" width="132" height="54"/><text class="t" x="1402" y="433">Verifier</text>
  <path class="e" d="M1280,427 L1336,427"/>
  <path class="e" d="M800,312 L800,364 L1214,364 L1214,400"/>

  <!-- stores -->
  <rect class="plug" x="482" y="634" width="456" height="56"/>
  <text class="t" x="710" y="668">TieredStore: process memory, then Redis with a deadline</text>
  <path class="e" d="M978,454 L978,562 L710,562 L710,634"/>
  <text class="l" x="844" y="550">fetch</text>
  <path class="e" d="M1402,454 L1402,740 L780,740 L780,778"/>
  <text class="l" x="1100" y="732">store</text>

  <g transform="translate(204,778)">
    <rect class="store" x="0" y="0" width="268" height="88" rx="10"/>
    <rect x="0" y="0" width="268" height="8" rx="4" fill="#c2410c"/>
    <text class="t"   x="134" y="42">Process memory</text>
    <text class="sub" x="134" y="68">hot set at warm start, session fetches</text>
  </g>
  <g transform="translate(576,778)">
    <rect class="store" x="0" y="0" width="268" height="88" rx="10"/>
    <rect x="0" y="0" width="268" height="8" rx="4" fill="#c2410c"/>
    <text class="t"   x="134" y="42">Redis</text>
    <text class="sub" x="134" y="68">the shared cache, same region</text>
  </g>
  <g transform="translate(948,778)">
    <rect class="store" x="0" y="0" width="268" height="88" rx="10"/>
    <rect x="0" y="0" width="268" height="8" rx="4" fill="#c2410c"/>
    <text class="t"   x="134" y="42">SQLite</text>
    <text class="sub" x="134" y="68">one process only, in place of Redis</text>
  </g>
  <path class="e" d="M590,690 L338,778"/>
  <path class="e" d="M710,690 L710,778"/>
  <path class="e" d="M830,690 L1082,778"/>
  <path class="e" d="M576,822 L472,822"/>
  <text class="l" x="524" y="810">warm start</text>

  <text class="gt" x="48" y="908">STORES</text>

  <!-- legend -->
  <text class="legend" x="48" y="944">Dashed border: a protocol you can replace.   The verifier runs as a scheduled job and writes back to Redis. Metrics, CLI and replay share the core's splitter, canonicaliser and policy.</text>
</svg>
