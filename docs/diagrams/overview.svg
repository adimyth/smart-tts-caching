<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/>
    </marker>
    <marker id="ad" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    .lane  { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 12; }
    .lane-title { fill: #111827; font-size: 17px; font-weight: 700; }
    .node  { fill: #ffffff; stroke: #374151; stroke-width: 2; rx: 8; }
    .cache { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
    .store { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
    .ops   { fill: #e5e7eb; stroke: #4b5563; stroke-width: 2; rx: 8; }
    .t     { fill: #111827; font-size: 17px; text-anchor: middle; }
    .sub   { fill: #374151; font-size: 13px; text-anchor: middle; }
    .e     { fill: none; stroke: #1f2937; stroke-width: 2; marker-end: url(#a); }
    .ed    { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#ad); }
    .l     { fill: #111827; font-size: 14px; text-anchor: middle; }
    .lb    { fill: #ffffff; }
    .ld    { fill: #1d4ed8; font-size: 14px; text-anchor: middle; }
  </style>

  <!-- lanes -->
  <rect class="lane" x="20" y="20" width="1240" height="220"/>
  <text class="lane-title" x="40" y="50">Host application: a Pipecat pipeline, or any app</text>
  <rect class="lane" x="20" y="300" width="1240" height="280"/>
  <text class="lane-title" x="40" y="330">tts-cache core: framework-free</text>

  <!-- host row, y=130..194, w=190, x = 45 295 545 795 1045 -->
  <rect class="node"  x="45"   y="130" width="190" height="64"/>
  <text class="t" x="140" y="168">LLM tokens</text>

  <rect class="cache" x="295"  y="130" width="190" height="64"/>
  <text class="t"   x="390" y="158">Cache read</text>
  <text class="sub" x="390" y="180">split, look up, inject</text>

  <rect class="node"  x="545"  y="130" width="190" height="64"/>
  <text class="t" x="640" y="168">TTS provider</text>

  <rect class="cache" x="795"  y="130" width="190" height="64"/>
  <text class="t"   x="890" y="158">Cache write</text>
  <text class="sub" x="890" y="180">capture per sentence</text>

  <rect class="node"  x="1045" y="130" width="190" height="64"/>
  <text class="t" x="1140" y="168">Audio output</text>

  <!-- host edges -->
  <path class="e" d="M235,162 L293,162"/>
  <path class="e" d="M485,162 L543,162"/>
  <rect class="lb" x="494" y="140" width="42" height="18"/>
  <text class="l" x="515" y="154">miss</text>
  <path class="e" d="M735,162 L793,162"/>
  <rect class="lb" x="742" y="140" width="46" height="18"/>
  <text class="l" x="765" y="154">audio</text>
  <path class="e" d="M985,162 L1043,162"/>
  <rect class="lb" x="990" y="140" width="50" height="18"/>
  <text class="l" x="1014" y="154">audio</text>

  <!-- hit bypass: over the top of the row -->
  <path class="e" d="M390,130 L390,95 Q390,85 400,85 L1130,85 Q1140,85 1140,95 L1140,128"/>
  <rect class="lb" x="640" y="76" width="250" height="18"/>
  <text class="l" x="765" y="90">hit: stored audio, in sentence order</text>

  <!-- core row 1, y=360..424 -->
  <rect class="cache" x="295" y="360" width="190" height="64"/>
  <text class="t"   x="390" y="388">lookup(text)</text>
  <text class="sub" x="390" y="410">canonicalise, key, match</text>

  <g transform="translate(545,360)">
    <rect class="store" x="0" y="0" width="190" height="64" rx="8"/>
    <rect x="0" y="0" width="190" height="8" rx="4" fill="#c2410c"/>
    <text class="t" x="95" y="34">Process memory</text><text class="sub" x="95" y="52">hot set, loaded at warm start</text>
  </g>

  <rect class="cache" x="795" y="360" width="190" height="64"/>
  <text class="t"   x="890" y="388">capture(text, audio)</text>
  <text class="sub" x="890" y="410">enqueue and return</text>

  <!-- core row 2, y=480..544 -->
  <rect class="ops" x="45" y="480" width="190" height="64"/>
  <text class="t"   x="140" y="508">CLI and jobs</text>
  <text class="sub" x="140" y="530">ping, verify, purge, export</text>

  <g transform="translate(545,480)">
    <rect class="store" x="0" y="0" width="190" height="64" rx="8"/>
    <rect x="0" y="0" width="190" height="8" rx="4" fill="#c2410c"/>
    <text class="t" x="95" y="34">Redis, same region</text><text class="sub" x="95" y="52">every lookup and capture</text>
  </g>

  <rect class="node" x="795" y="480" width="190" height="64"/>
  <text class="t"   x="890" y="508">Ingest</text>
  <text class="sub" x="890" y="530">check, verify, put</text>

  <!-- core edges -->
  <path class="e" d="M485,392 L543,392"/>
  <path class="e" d="M660,424 L660,478"/>
  <rect class="lb" x="668" y="442" width="42" height="18"/>
  <text class="l" x="689" y="456">miss</text>
  <path class="e" d="M620,478 L620,426"/>
  <rect class="lb" x="574" y="442" width="36" height="18"/>
  <text class="l" x="592" y="456">warm</text>
  <path class="e" d="M890,424 L890,478"/>
  <path class="e" d="M793,512 L737,512"/>
  <rect class="lb" x="746" y="490" width="36" height="18"/>
  <text class="l" x="764" y="504">put</text>
  <path class="e" d="M235,512 L543,512"/>

  <!-- host to core calls -->
  <path class="ed" d="M390,194 L390,358"/>
  <rect class="lb" x="400" y="262" width="110" height="18"/>
  <text class="ld" x="455" y="276">lookup(text)</text>
  <path class="ed" d="M890,194 L890,358"/>
  <rect class="lb" x="900" y="262" width="160" height="18"/>
  <text class="ld" x="980" y="276">capture(text, audio)</text>
</svg>
